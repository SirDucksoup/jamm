  { id:'l29', c:1, t:'Цветные формы: дроп-аккорды', x:'Дроп-аккорды (drop2) — четырёхголосые формы на 4 струнах: бас «сброшен» на октаву вниз. Стандарт фанк/джаз-аккомпанемента.<br><b>Сделай:</b> возьми любой m7 и проедь его вверх по грифу, сохраняя форму.' },
  { id:'l30', c:1, t:'Переходы с общими пальцами', x:'Смотри, какие пальцы общие у соседних аккордов, — их НЕ отрывай. Am→C (1-й палец живёт), C→G7, Em→G.<br><b>Сделай:</b> по 8 смен каждой пары — рука запоминает минимум движения.' },
  { id:'l31', c:1, t:'Быстрые смены: тренировка пар', x:'Челлендж «60 секунд»: сколько ЧИСТЫХ смен между двумя аккордами за минуту. Схема: медленно → чисто → быстро. Отличная ежедневная практика.<br><b>Сделай:</b> три раунда на любой паре.', app:{ text:'Тренажёр пар с метрономом — здесь, в Школе.', sect:'prac', btn:'🏋 К практикам' } },
  { id:'l32', c:1, t:'Тональности твоего аккорда', x:'Один аккорд живёт в нескольких тональностях — и звучит там по-разному (другая ступень, другое напряжение).<br><b>Сделай:</b> выбери аккорд во вкладке «🎵 Песня» и посмотри топ тональностей с покрытием.', app:{ text:'Тональности и покрытие — во вкладке «🎵 Песня».', tool:'song', btn:'🎵 Песня' } },
  /* ——— Курс «Ритм и бой» (33–46) ——— */
  { id:'l33', c:2, t:'Счёт: раз-и-два-и', x:'Восьмая сетка считается «раз-И, два-И, три-И, четыре-И». Проговаривай вслух с ровным маятником руки — это фундамент всех боёв.<br><b>Сделай:</b> 8 тактов счёта вслух с движением руки без удара — рука уже держит ритм.' },
  { id:'l34', c:2, t:'Четвертной бой', x:'Один удар вниз на каждый счёт, восьмые рука проходит молча. Звук ровный, как метроном.<br><b>Сделай:</b> Em, 8 тактов по 4 удара вниз.' },
  { id:'l35', c:2, t:'Восьмёрки: D-DU', x:'На счёт — вниз, на «И» — вверх. Все удары одной громкости, маятник не останавливается.<br><b>Сделай:</b> 8 тактов D-DU на Em под счёт вслух.' },
  { id:'l36', c:2, t:'Универсальный бой D-DU-UDU', x:'Самый ходовой бой поп-музыки: вниз, вниз-вверх, вверх-вниз-вверх. Схема на такт: Д-ДУ-УДУ. Разучи медленно по частям, потом собери.<br><b>Сделай:</b> 8 тактов на Em или Am.' },
  { id:'l37', c:2, t:'Бой «шестёрка» (баллада)', x:'Шесть ударов на такт: Д-Д-ДУ-Д-ДУ — мягкое балладное покачивание. Хорошо звучит с перебором в куплетах.<br><b>Сделай:</b> 8 тактов на C–G–Am–F... или на любой паре аккордов.' },
  { id:'l38', c:2, t:'Регги-скип: акцент на «И»', x:'Регги переворачивает ритм: сильные доли ПРОПУСКАются (глушатся), удары — на «И». Отсюда «прыгающий» грув.<br><b>Сделай:</b> считай «раз-и-два-и» и играй только на «И», на счёт — глушение ладонью.' },
  { id:'l39', c:2, t:'Шаффл и свинг', x:'Шаффл — восьмые играются неровно: «длинная-короткая», как триоль с паузой. Блюзовый качающий грув.<br><b>Сделай:</b> проговори «1-и-а» и играй D-DU, ударяя на «1» и на «а».' },
  { id:'l40', c:2, t:'Паузы и глушилка', x:'Пауза в бое — это НЕ молчание руки, а глушение: ладонь или пальцы левой кладутся на струны в момент удара. Ритм-машина продолжает качать.<br><b>Сделай:</b> бой D-DU, где первый удар каждого такта — глушёный «чок».' },
  { id:'l41', c:2, t:'Фингерстайл: базовые паттерны', x:'Пальцы правой: p (большой) — бас, i-m-a (указательный-средний-безымянный) — три верхние. Классика: p–i–m–a–m–i.<br><b>Сделай:</b> паттерн p-i-m-a на аккорде Em, медленно, без спешки.' },
  { id:'l42', c:2, t:'Перебор 4-3-2-1', x:'Простой перебор: большой палец по 4-й струне (бас), дальше 3-2-1 по очереди. Держи ровность: каждая нота одинаковой длины.<br><b>Сделай:</b> Am, 4 круга перебора, бас меняется по аккорду.' },
  { id:'l43', c:2, t:'Перебор с басом (Travis-лайт)', x:'Упрощённый Трэвис: бас чередуется между двумя нижними струнами, пальцы перебирают 3-2-1 поверх. Получается «качающийся» фон.<br><b>Сделай:</b> C: бас 5-4, пальцы 3-2-1 — медленно, по кругу.' },
  { id:'l44', c:2, t:'Игра с метрономом', x:'Метроном — честный учитель: он не врёт про ровность. Начинай с 60 bpm, добавляй +5 только когда сыграл чисто три раза подряд.<br><b>Сделай:</b> включи метроном в «🧰 Инструментах» и пройди любимый бой 8 тактов.', app:{ text:'Метроном с размерами — в Инструментах.', tool:'tools', btn:'🧰 Открыть' } },
  { id:'l45', c:2, t:'Игра с ▶ Фоном', x:'Фон (бэктрек) — это уже «живая» группа: аккорды по тактам, бит, бас. Играй поверх свой бой или перебор.<br><b>Сделай:</b> собери песню «✨ Сделай красиво» и включи «▶ Фон» прямо там.', app:{ text:'Фон запускается из «✨ Сделай красиво» и «Лада дня».', sect:'prac', btn:'🏋 К практикам' } },
  { id:'l46', c:2, t:'Перкуссия корпусом', x:'Удар костяшками большого пальца по деке (X) или шлепок ладонью по струнам — перкуссия прямо на гитаре. Добавляет груву «хлопок».<br><b>Сделай:</b> бой Д-X-ДУ-Х: на X — костяшки по деке.' },
  /* ——— Курс «Гаммы и лады» (47–62) ——— */
  { id:'l47', c:3, t:'Хроматика — знакомство с грифом', x:'Хроматика — все 12 полутонов подряд. Играй 1-2-3-4 пальцами по каждой струне — рука учится ходить по грифу, ухо — слышать полутоны.<br><b>Сделай:</b> хроматика от 5-го лада, шестая струна → первая.', fret:[0, 'chromatic'] },
  { id:'l48', c:3, t:'Мажор: боксы', x:'Мажорная гамма живёт в «боксах» — окнах из 4 ладов в одной позиции. Возьми до-мажор в открытой позиции и в 7-й — это одна и та же гамма.<br><b>Сделай:</b> до-мажор на грифе, сыграй вверх-вниз в двух позициях.', fret:[0, 'major'] },
  { id:'l49', c:3, t:'Минорная пентатоника: бокс 1', x:'Пентатоника — 5 нот без «сложных» ступеней: на ней НЕЛЬЗЯ ошибиться, если играть по подсветке. Бокс 1 — самый ходовой на грифе.<br><b>Сделай:</b> ля-минорная пентатоника, бокс 1, сыграй вверх-вниз.', fret:[9, 'pentaMin'] },
  { id:'l50', c:3, t:'Пентатоника: боксы 2–5', x:'Тот же набор нот — следующие окна по грифу. Бокс 2 начинается с 3-го лада после бокса 1, и так далее по цепочке.<br><b>Сделай:</b> переключи «Позицию» на грифе и пройди боксы 2–5 ля-минорной пентатоники.', fret:[9, 'pentaMin'] },
  { id:'l51', c:3, t:'Связка боксов', x:'Играют не боксы, а ГРИФ: из конца бокса 1 шагай в начало бокса 2 без паузы. Стыки — самая ценная часть.<br><b>Сделай:</b> играй бокс 1 вверх, бокс 2 вверх, бокс 1 вниз — непрерывный маршрут.' },
  { id:'l52', c:3, t:'Блюзовая гамма (+бенд на ♭5)', x:'Блюзовая = минорная пентатоника + ♭5 — «дьявольская» нота, которую тянут бендом. Она и делает грув блюзовым.<br><b>Сделай:</b> ми-блюзовая, найди ♭5 и подтяни её бендом на тон.', fret:[0, 'blues'] },
  { id:'l53', c:3, t:'Натуральный минор', x:'Минор — тот же мажор, но с другим характером (иначе расставлены тоны/полутоны). Ля-минор = ноты до-мажора с центром в A.<br><b>Сделай:</b> ля-минор на грифе, сыграй вверх-вниз и сравни с пентатоникой.', fret:[9, 'minor'] },
  { id:'l54', c:3, t:'Гармонический и мелодический минор', x:'Гармонический минор — минор с высокой VII (восточный вкус, «испанка»). Мелодический — подняты VI и VII вверх. Оба — для драматических мелодий.<br><b>Сделай:</b> ля-гармонический на грифе — найди «зияющий» шаг между VI и VII.', fret:[9, 'harmonic'] },
  { id:'l55', c:3, t:'Дорийский лад', x:'Дорийский = минор со «светлой» VI — модный модальный вайб (фанк, рок). Ре-дорийский = все белые клавиши от D.<br><b>Сделай:</b> ре-дорийский на грифе, сыграй с дроном или фоном ре.', fret:[2, 'dorian'] },
  { id:'l56', c:3, t:'Фригийский и локрийский', x:'Фригийский — минор с низкой II: «испанский» оттенок. Локрийский — самый «тёмный» лад с низкой V. Оба — для напряжения.<br><b>Сделай:</b> ми-фригийский на грифе, сравни с обычным ми-минором.', fret:[4, 'phrygian'] },
  { id:'l57', c:3, t:'Лидийский и миксолидийский', x:'Лидийский — мажор с #IV (сказочность). Миксолидийский — мажор с ♭VII (рок-мажор). Оба — «мажор с сюрпризом».<br><b>Сделай:</b> соль-миксолидийский на грифе, сыграй с фоном G.', fret:[7, 'mixolydian'] },
  { id:'l58', c:3, t:'Позиции и переезды', x:'Одна гамма — до 7 позиций по грифу. Переезд — смещение всей руки на несколько ладов без смены нот.<br><b>Сделай:</b> до-мажор в 1-й позиции и в 7-й (селект «Позиция» на грифе) — услышь разницу тембра.', fret:[0, 'major'] },
  { id:'l59', c:3, t:'«Гамма дня» — ежедневная практика', x:'Лучший способ знать гриф — каждый день новая случайная гамма. Две минуты в день дают больше, чем два часа раз в месяц.<br><b>Сделай:</b> открой «🏋 Практики → 🎲 Гамма дня» и пройди сегодня.', app:{ text:'Практика «Гамма дня» — в Школе.', sect:'prac', btn:'🏋 К практикам' } },
  { id:'l60', c:3, t:'Импровизация: фразы, повторы, дыхание', x:'Импровизация — не поток нот, а ФРАЗЫ, как речь: сказал — пауза. Повтор мотивов делает мелодию узнаваемой. Дыши на концах фраз.<br><b>Сделай:</b> 🎲 Фраза на грифе — проиграй её и повтори своими руками.' },
  { id:'l61', c:3, t:'Импровизация под ▶ Фон', x:'Фон задаёт аккорды и ритм — твоя пентатоника всегда к месту. Играй просто: 2–3 ноты, ритм важнее количества.<br><b>Сделай:</b> включи «▶ Фон» в «Ладе дня» и импровизируй 8 тактов только на нотах гаммы.', app:{ text:'Фон — в «🏋 Практики → Лад дня».', sect:'prac', btn:'🏋 К практикам' } },
  { id:'l62', c:3, t:'Таргет-ноты: попадай в аккорд', x:'Профессиональный секрет: на СИЛЬНЫЕ доли играй тоны текущего аккорда, на слабые — проходные. Мелодия сразу «ложится» на гармонику.<br><b>Сделай:</b> с фоном играй так: на 1-ю долю — тон или терция аккорда такта.' },
  /* ——— Курс «Техника» (63–76) ——— */
  { id:'l63', c:4, t:'«Паучок» 1-2-3-4', x:'Хроматика пальцами 1-2-3-4 на каждой струне — базовая разминка: ровность, сила, независимость пальцев.<br><b>Сделай:</b> подход под щелчки в «🏋 Практики → Техника».', app:{ text:'Щелчки с темпом — в «Практиках».', sect:'prac', btn:'🏋 К практикам' } },
  { id:'l64', c:4, t:'Альтернативный медиатор', x:'Всегда чередуй: вниз-вверх-вниз-вверх, даже на одном звуке. Это удваивает скорость почти бесплатно.<br><b>Сделай:</b> хроматика медиатором строго D-U-D-U — медленно, следи за рукой.' },
  { id:'l65', c:4, t:'Хаммер-он и пулл-офф', x:'Хаммер-он: нота берётся ПАЛЬЦЕМ левой ударом по грифу (без правой руки). Пулл-офф: палец срывает струну, снимаясь. Вместе — легато, «текущие» ноты.<br><b>Сделай:</b> на 3-й струне: 5 → хаммер 7 → пулл 5.' },
  { id:'l66', c:4, t:'Слайды', x:'Слайд — движение вдоль струны с прижатой нотой: звук «переезжает» между нотами. Берём ноту ЧИСТО, потом едем.<br><b>Сделай:</b> на 2-й струне 5 → слайд → 8 → слайд обратно.' },
  { id:'l67', c:4, t:'Бенды', x:'Бенд — подтягивание струны пальцами до соседней ноты (полутон или тон). Кислота и экспрессия блюза. Тяни запястьем и локтем, не пальцами.<br><b>Сделай:</b> на 3-й струне 7-й лад — бенд на тон, сравни с реальной нотой на 9-м.' },
  { id:'l68', c:4, t:'Вибрато', x:'Вибрато — живое покачивание ноты (смена высоты или громкости). Ритмичное, медленное в начале ноты, ускоряется к концу.<br><b>Сделай:</b> длинная нота на 2-й струне 10-го лада — подведи вибрато за 2 секунды.' },
  { id:'l69', c:4, t:'Легато-лики в пентатонике', x:'Лик — короткая красивая фраза. В пентатонике делается хаммерами/пуллами: 2–3 ноты на один удар правой.<br><b>Сделай:</b> классический лик в ля-минорной пентатонике: 8-5-7-5 хаммерами на 1-й струне.', fret:[9, 'pentaMin'] },
  { id:'l70', c:4, t:'Арпеджио по аккорду', x:'Арпеджио — ноты аккорда по одной: мелодия и гармония одновременно. Играй ноты аккорда снизу вверх и обратно.<br><b>Сделай:</b> арпеджио Cmaj на грифе — тоны аккорда подряд.', play:[0, 'maj'] },
  { id:'l71', c:4, t:'Свипы (введение)', x:'Свип — медиатор «подметает» струны одним движением, левая глушит между нотами. Эффектно, но требует ровности.<br><b>Сделай:</b> трёхнотный свип на Em (верхние струны) — медленно, метроном 50.' },
  { id:'l72', c:4, t:'Триоли и трипл-чувство', x:'Триоль — три ноты на время двух: «та-та-та» ровно. Считай «трип-л-ет» или «ко-фе-чай». Нужна для шаффла и блюза.<br><b>Сделай:</b> хроматика триолями под счёт «1-и-а».' },
  { id:'l73', c:4, t:'Динамика', x:'Громкость — инструмент выразительности: куплет тише, припев громче, кульминация — самая сильная атака. Играй осознанно тихо — это сложнее.<br><b>Сделай:</b> тот же бой в трёх громкостях: тихо-средне-громко.' },
  { id:'l74', c:4, t:'Палм-мьют', x:'Палм-мьют — ребро ладони правой касается струн у бриджа: рокочущий приглушённый звук. Основа риффов панк/метал.<br><b>Сделай:</b> пауэр-аккорд E5 с палм-мьютом восьмыми — сравни с открытым.' },
  { id:'l75', c:4, t:'Натуральные флажолеты', x:'Флажолет — касание струны НАД ладом (не прижимая) и удар: чистый «свистящий» тон. Магические точки: 12, 7 и 5 лады.<br><b>Сделай:</b> флажолеты над 12-м ладом на всех струнах.' },
  { id:'l76', c:4, t:'Разогрев перед игрой', x:'Рутина 5 минут: паучок → слайды/бенды → любимый лик → песня. Рука «просыпается», шанс сорваться на скорости ниже.<br><b>Сделай:</b> пройди рутину перед следующей сессией целиком.', app:{ text:'Щелчки для разогрева — в «Практиках».', sect:'prac', btn:'🏋 К практикам' } },
  /* ——— Курс «Теория» (77–92) ——— */
  { id:'l77', c:5, t:'Полутоны и тоны', x:'Полутон — 1 лад на грифе (самый маленький шаг), тон — 2 лада. На пианино: соседние клавиши — полутон, через одну — тон.<br><b>Сделай:</b> сыграй хроматику от E по 6-й струне — все 12 полутонов.' },
  { id:'l78', c:5, t:'Строение мажора', x:'Мажор — формула Т-Т-П-Т-Т-Т-П (тон-тон-полутон-тон-тон-тон-полутон). От C: C-D-E-F-G-A-B-C. Меняем корень — формула та же.<br><b>Сделай:</b> построй G-мажор на 6-й струне по формуле.', fret:[0, 'major'] },
  { id:'l79', c:5, t:'Строение минора', x:'Натуральный минор — Т-П-Т-Т-П-Т-Т. От A: A-B-C-D-E-F-G-A. Характер «грустный» из-за низкой III ступени.<br><b>Сделай:</b> построй ми-минор по формуле от E.', fret:[4, 'minor'] },
  { id:'l80', c:5, t:'Интервалы', x:'Интервал — расстояние между нотами: прима (0), секунда (2), терция (4), кварта (5), квинта (7), секста (9), септима (11), октава (12) — в полутонах. Аккорды — стопки интервалов.<br><b>Сделай:</b> пощёлкай интерактив в разделе «🧭 Лады» — интервал от всех 12 нот.', app:{ text:'Интерактив — в разделе «🧭 Лады».', sect:'modes', btn:'🧭 К ладам' } },
  { id:'l81', c:5, t:'Квинтовый круг', x:'Шаг по кругу = квинта (7 полутонов). По часовой — +1 диез, против — +1 бемоль. Соседи отличаются одной нотой. Тональность + 2 соседа + минорные напарники = 6 аккордов для песни. V → I — возвращение домой.<br><b>Сделай:</b> покрути интерактивный круг.', app:{ text:'Интерактивный круг — вкладка «🎡 Круги».', tool:'circles', btn:'🎡 Круги' } },
  { id:'l82', c:5, t:'Тональности и знаки', x:'Каждая мажорная тональность имеет свой набор диезов/бемолей: G — 1♯, D — 2♯, A — 3♯… F — 1♭, B♭ — 2♭… Знаки идут по квинтовому кругу.<br><b>Сделай:</b> на вкладке «⏰ Круг» посмотри знак выбранной тональности (цифры по ободу).' },
  { id:'l83', c:5, t:'Диатонические аккорды лада', x:'На каждой ступени гаммы строится трезвучие: в мажоре — I ii iii IV V vi vii°. Это «палитра» тональности — аккорды, которые звучат вместе без случайностей.<br><b>Сделай:</b> во вкладке «🎵 Песня» посмотри палитру «Из тональности».' },
  { id:'l84', c:5, t:'Ступени: I, IV, V, vi', x:'I — дом, точка покоя. IV — уход «в сторону». V — главное напряжение, тянет в I. vi — «грустная ложная тоника». Остальные ступени — проходные.<br><b>Сделай:</b> сыграй I → IV → V → I — классический каденс.' },
  { id:'l85', c:5, t:'Прогрессии I-IV-V и I-V-vi-IV', x:'I-IV-V — фундамент рок-н-ролла и кантри. I-V-vi-IV («поп-хит») — формула сотен хитов: эмоция в одном круге.<br><b>Сделай:</b> собери «поп-хит» в «✨ Сделай красиво» (стиль Поп) и послушай с фоном.', app:{ text:'Пресет «Поп» — в «✨ Сделай красиво».', sect:'base', btn:'🎵 К песне' } },
  { id:'l86', c:5, t:'12-тактовый блюз', x:'Форма блюза: I7×4, IV7×2, I7×2, V7–IV7–I7–I7 — 12 тактов по кругу. Поверх — минорная пентатоника от тоники.<br><b>Сделай:</b> стиль «Блюз» в «✨ Сделай красиво» + «▶ Фон».', app:{ text:'Стиль «Блюз» — в «✨ Сделай красиво».', sect:'base', btn:'🎵 К песне' } },
  { id:'l87', c:5, t:'Пентатоника от лада', x:'Какой пентатоникой импровизировать: от мажорных ладов — мажорная пентатоника тоники, от минорных — минорная. Это уже встроено в подсказки «Лада дня».<br><b>Сделай:</b> «Лад дня» — смотри строку «импровизируй: …».', app:{ text:'Подсказка — в «Ладе дня».', sect:'prac', btn:'🏋 К практикам' } },
  { id:'l88', c:5, t:'Относительные мажор и минор', x:'Минорная тональность с теми же нотами, что мажор, живёт на VI ступени ниже (C-мажор ↔ ля-минор). Центр сместился — характер сместился.<br><b>Сделай:</b> на грифе сыграй до-мажор и ля-минор — ноты те же, тоника разная.' },
  { id:'l89', c:5, t:'Транспонирование ±полутон', x:'Сдвинуть песню на полутон = сдвинуть ВСЕ аккорды на полутон (или передвинуть формы барре). Так песню подстраивают под голос.<br><b>Сделай:</b> возьми I-V-vi-IV от C и сыграй то же от C♯ — все аккорды на полтона выше.', app:{ text:'Живые кнопки транспонирования — во вкладке «🎵 Песня» (♭ −1 / ♯ +1 в ряду «Твоя песня»).', tool:'song', btn:'🎵 Песня' } },
  { id:'l90', c:5, t:'Как определить тональность песни', x:'Признаки: первый/последний аккорд часто тоника; смотри, в чью палитру ложится больше аккордов. Программа сама подсказывает: «Похоже, тональность…».<br><b>Сделай:</b> собери аккорды в «🎵 Песня» и читай строку подсказки.', app:{ text:'Подсказка — во вкладке «🎵 Песня».', tool:'song', btn:'🎵 Песня' } },
  { id:'l91', c:5, t:'Каподастр', x:'Каподастр на N-м ладу = все открытые аккорды звучат на N полутонов выше. Играй «удобные» формы — меняй тональность одним зажимом.<br><b>Сделай:</b> каподастр на 2-м ладу + формы G-C-Em-D = звучит A-D-F#m-E.' },
  { id:'l92', c:5, t:'Строи: дропы и открытые', x:'Drop D (6-я струна в D) — риффы на двух нижних струнах одним пальцем. Open G — слайд-блюз и китары Кита Ричардса. Строй меняет саму логику грифа.<br><b>Сделай:</b> включи Drop D в Настройках и сравни.', app:{ text:'Строи — в ⚙️ Настройках.', tool:'settings', btn:'⚙️ Настройки' } },
  /* ——— Курс «Песни и джем» (93–100) ——— */
  { id:'l93', c:6, t:'Разбор песни из 2 аккордов', x:'Возьми любой двухаккордный хит (8 ударов на аккорд). Схема разбора: послушай оригинал → найди тоника/напарник → бой → слова поверх.<br><b>Сделай:</b> Em–Am, 8 кругов с боем восьмёрками.' },
  { id:'l94', c:6, t:'Разбор песни из 3 аккордов', x:'Три аккорда = I-IV-V (или i-VI-VII). Схема: тоника-куплет → IV в припеве → V перед возвратом. 90% дворовых песен живут здесь.<br><b>Сделай:</b> A-D-E или Am-Dm-Em — бой на выбор.' },
  { id:'l95', c:6, t:'12-тактовый блюз разучиваем', x:'Форма: 4 такта I7, 2 такта IV7, 2 такта I7, V7-IV7-I7-I7. Считай такты вслух — форма «проваливается» в руки после 3–4 кругов.<br><b>Сделай:</b> стиль «Блюз» + «▶ Фон» + минорная пентатоника сверху.', app:{ text:'Блюз — в «✨ Сделай красиво».', sect:'base', btn:'🎵 К песне' } },
  { id:'l96', c:6, t:'Разобрать песню из «Сделай красиво»', x:'Выбери стиль, сгенерируй песню, включи фон и разбирай: какие ступени, где тоника, какой бой подходит. Готовая учебная задача.<br><b>Сделай:</b> любой стиль → «▶ Фон» → играй тоны аккордов.', app:{ text:'Генератор — во вкладке «🎵 Песня».', tool:'song', btn:'🎵 Песня' } },
  { id:'l97', c:6, t:'Собери свою песню', x:'Своя песня: 4 аккорда, бой, структура куплет-припев. В конструкторе песен аккорды складываются кликами, играть можно сразу с фоном.<br><b>Сделай:</b> собери свою последовательность и сохрани (она остаётся в программе).', app:{ text:'Конструктор — вкладка «🎵 Песня».', tool:'song', btn:'🎵 Песня' } },
  { id:'l98', c:6, t:'Запиши фразу в редакторе фраз', x:'Придумал мотив — запиши: на грифе кликай ноты в правом боксе «Фраза», ставь длительности и паузы, играй с темпом. Так копится личная библиотека ликов.<br><b>Сделай:</b> запиши фразу из 8 нот поверх своей песни.', app:{ text:'Редактор фраз — на вкладке «Гриф», бокс «Фраза».', tool:'fret', btn:'🎼 Гриф' } },
  { id:'l99', c:6, t:'Игра по памяти', x:'Убери подсказки: играй песню, глядя только на руки (или закрой глаза). Память рук крепче зрения, если играть медленно и одинаково.<br><b>Сделай:</b> своя песня из «Песни» — 3 круга без подглядывания в чипы.' },
  { id:'l100', c:6, t:'Мини-концерт: 3 песни подряд', x:'Финал курса: собери сет из 3 песен, настройся перед выходом, играй без остановок — паузы между песнями короткие и спокойные. Это уже настоящее выступление.<br><b>Сделай:</b> сыграй сет целиком для друга или камеры.' },
  ];
  let scDone = store.get('ga_school100', null);
  if (!scDone || typeof scDone !== 'object'){
    scDone = {};
    const old = store.get('ga_school', []); // миграция старой шестёрки уроков
    if (Array.isArray(old) && old.length === 6){
      [[0,'l02'],[1,'l05'],[1,'l06'],[2,'l11'],[3,'l49'],[4,'l13'],[5,'l61']].forEach(([i, id]) => { if (old[i]) scDone[id] = true; });
    }
  }
  let scCourse = 0, scOpen = null;
  const uiSc2 = loadUI('school');
  if (Number.isInteger(uiSc2.course) && uiSc2.course >= 0 && uiSc2.course <= 6) scCourse = uiSc2.course;

  function scSave(){ store.set('ga_school100', scDone); saveUI('school', { course: scCourse, open: scOpen }); }
  function scIn(ci){ return LESSONS.filter(l => l.c === ci); }
  function scDoneIn(ci){ return scIn(ci).filter(l => scDone[l.id]).length; }

  function drawSchoolBase(){
    const dnAll = LESSONS.filter(l => scDone[l.id]).length;
    $('#sc-progress').textContent = dnAll + ' / ' + LESSONS.length;
    $('#sc-progress-bar').style.width = Math.round(dnAll / LESSONS.length * 100) + '%';
    $('#sc-courses').innerHTML = SC_COURSES.map((nm, ci) =>
      '<button class="chip' + (ci === scCourse ? ' on' : '') + '" data-ci="' + ci + '">' + nm +
      ' <span class="muted small">' + scDoneIn(ci) + '/' + scIn(ci).length + '</span></button>').join(' ');
    $('#sc-courses').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { scCourse = +b.dataset.ci; scOpen = null; scSave(); drawSchoolBase(); }));
    const dnC = scDoneIn(scCourse), totC = scIn(scCourse).length;
    $('#sc-course-head').innerHTML = '<div class="row" style="gap:10px"><span>Курс «<b>' + esc(SC_COURSES[scCourse]) + '» — ' + dnC + ' из ' + totC + '</span>' +
      '<div class="progress" style="flex:1"><i style="width:' + Math.round(dnC / totC * 100) + '%"></i></div></div>';
    let nextMarked = false;
    $('#sc-list').innerHTML = LESSONS.map((L, idx) => {
      if (L.c !== scCourse) return '';
      const isDone = !!scDone[L.id];
      const isNext = !isDone && !nextMarked ? (nextMarked = true, true) : false;
      const open = scOpen === L.id;
      return '<div class="sc-lesson' + (open ? ' open' : '') + '">' +
        '<div class="sc-row" data-open="' + L.id + '">' +
          '<span class="muted small" style="min-width:30px">' + (idx + 1) + '</span>' +
          '<span class="grow"' + (isDone ? ' style="opacity:.55"' : '') + '>' + esc(L.t) +
            (isNext ? ' <b style="color:var(--accent)">→ следующий</b>' : '') + '</span>' +
          '<button class="chip' + (isDone ? '" style="background:var(--good); color:#141210; border-color:transparent; font-weight:700' : '') + '" data-done="' + L.id + '" title="Отметить/снять пройденным">✓</button>' +
        '</div>' +
        (open ? '<div class="sc-body">' + L.x +
          '<div class="row" style="margin-top:8px">' +
            (L.fret ? '<button class="btn small primary" data-fret="' + idx + '">🎼 Показать на грифе</button>' : '') +
            (L.chord ? '<button class="btn small" data-chord="' + idx + '">🔊 Послушать аккорд</button>' : '') +
            (L.play ? '<button class="btn small" data-play="' + idx + '">🔊 Послушать</button>' : '') +
            (L.app ? '<span class="muted small">' + L.app.text + '</span>' +
              (L.app.tool || L.app.sect ? '<button class="btn small" data-app="' + idx + '">' + (L.app.btn || 'Открыть') + '</button>' : '') : '') +
          '</div></div>' : '') +
      '</div>';
    }).join('');
    $('#sc-list').querySelectorAll('[data-done]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        const id = b.dataset.done;
        if (scDone[id]) delete scDone[id]; else scDone[id] = true;
        scSave(); drawSchoolBase();
      }));
    $('#sc-list').querySelectorAll('.sc-row').forEach(r =>
      r.addEventListener('click', () => { scOpen = scOpen === r.dataset.open ? null : r.dataset.open; scSave(); drawSchoolBase(); }));
    $('#sc-list').querySelectorAll('[data-fret]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        const L = LESSONS[+b.dataset.fret];
        showTool('fret');
        const s = currentSection();
        if (s._open) s._open(L.fret[0], L.fret[1]);
      }));
    $('#sc-list').querySelectorAll('[data-chord]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        const L = LESSONS[+b.dataset.chord];
        strum(L.chord[0], L.chord[1]);
        showTool('fret');
        const s = currentSection();
        if (s._openChord) s._openChord(L.chord[0], L.chord[1]);
      }));
    $('#sc-list').querySelectorAll('[data-play]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        const L = LESSONS[+b.dataset.play];
        strum(L.play[0], L.play[1]);
      }));
    $('#sc-list').querySelectorAll('[data-app]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        const L = LESSONS[+b.dataset.app];
        if (L.app.tool) showTool(L.app.tool);
        if (L.app.sect){ sect = L.app.sect; drawSects(); }
      }));
  }
  drawSchoolBase();
  /* --- разделы: переключатель + показ нужного --- */
  function drawSects(){
    $('#sc-sect-row').innerHTML = SECTS.map(([k, t]) =>
      '<button class="chip' + (k === sect ? ' on' : '') + '" data-sect="' + k + '">' + t + '</button>').join(' ');
    $('#sc-sect-row').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { sect = b.dataset.sect; saveUI('school', { sect }); drawSects(); }));
    SECTS.forEach(([k]) => { const d = $('#sc-' + k); if (d) d.style.display = k === sect ? '' : 'none'; });
  }
  drawSects();

  /* --- Практики: счётчики и текущие задания (ga_prac) --- */
  let prac = store.get('ga_prac', null);
  if (!prac || typeof prac !== 'object') prac = {};
  prac.gamma = prac.gamma || { count: 0, cur: null }; // cur: {T, k}
  prac.lad = prac.lad || { count: 0, cur: null };     // cur: {T, mode}
  prac.tech = prac.tech || { count: 0, bpm: 80 };
  prac.ear = prac.ear || { ok: 0, total: 0, streak: 0, best: 0, cur: null }; // cur: {root, q, opts, answered}
  prac.ch = prac.ch || { count: 0, bpm: 70, cur: null }; // cur: {a:{root,q}, b:{root,q}}
  function persistPrac(){ store.set('ga_prac', prac); }
  const rnd12 = () => Math.floor(Math.random() * 12);
  const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];

  /* Гамма дня */
  const GAMMA_POOL = SCALE_CORE.filter(k => k !== 'chromatic' && k !== 'all');
  function drawGamma(){
    if (!prac.gamma.cur) prac.gamma.cur = { T: rnd12(), k: pickOne(GAMMA_POOL) };
    const c = prac.gamma.cur;
    $('#pr-gamma-cur').innerHTML = '<b style="color:var(--accent)">' + esc(pcName(c.T)) + ' ' + esc(SCALES[c.k].name) + '</b>' +
      (SCALES[c.k].d ? '<div class="muted small" style="margin-top:2px">' + esc(SCALES[c.k].d) + '</div>' : '');
    $('#pr-gamma-count').textContent = 'сыграно: ' + prac.gamma.count;
    persistPrac();
  }
  $('#pr-gamma-roll').addEventListener('click', () => { prac.gamma.cur = { T: rnd12(), k: pickOne(GAMMA_POOL) }; drawGamma(); });
  $('#pr-gamma-open').addEventListener('click', () => {
    const c = prac.gamma.cur;
    showTool('fret');
    const s = currentSection();
    if (s._open) s._open(c.T, c.k); // гамма сразу подсвечена
  });
  $('#pr-gamma-done').addEventListener('click', () => { prac.gamma.count++; persistPrac(); drawGamma(); });

  /* Лад дня */
  const LAD_MODES = ['maj','min','dorian','phrygian','lydian','mixolydian','locrian'];
  const PENTA_FOR = { maj:'pentaMaj', min:'pentaMin', dorian:'pentaMin', phrygian:'pentaMin', lydian:'pentaMaj', mixolydian:'pentaMaj', locrian:'pentaMaj' };
  function drawLad(){
    if (!prac.lad.cur) prac.lad.cur = { T: rnd12(), mode: pickOne(LAD_MODES) };
    const c = prac.lad.cur;
    const dia = diatonicTriads(c.T, c.mode).map(x => esc(chordName(x.root, x.q)));
    const nm = (SONG_MODES.find(x => x[0] === c.mode) || [])[1] || c.mode;
    $('#pr-lad-cur').innerHTML = '<b style="color:var(--accent)">' + esc(pcName(c.T)) + ' ' + esc(nm) + '</b> · <span class="small">' + dia.join(' – ') + '</span>';
    const pk = PENTA_FOR[c.mode];
    $('#pr-lad-hint').textContent = 'импровизируй: ' + SCALES[pk].name + ' от ' + pcName(c.T) + ' (▶ Фон — бэктрек играет и на вкладке «Гриф»)';
    $('#pr-lad-count').textContent = 'сыграно: ' + prac.lad.count;
    const b = $('#pr-lad-bg');
    if (b) b.textContent = bgTrack ? '■ Стоп фона' : '▶ Фон';
    persistPrac();
  }
  $('#pr-lad-roll').addEventListener('click', () => { prac.lad.cur = { T: rnd12(), mode: pickOne(LAD_MODES) }; drawLad(); });
  $('#pr-lad-bg').addEventListener('click', () => {
    if (bgTrack){ bgStop(); drawLad(); return; }
    const c = prac.lad.cur;
    bgStart(diatonicTriads(c.T, c.mode).map(x => ({ root: x.root, q: x.q })), 100);
    drawLad();
  });
  $('#pr-lad-done').addEventListener('click', () => { prac.lad.count++; persistPrac(); drawLad(); });

  /* Техника — «паучок» под щелчки */
  let techTimer = 0, techOn = false;
  function drawTech(){
    $('#pr-tech-frets').textContent = '5 · 6 · 7 · 8';
    $('#pr-tech-count').textContent = 'подходов: ' + prac.tech.count;
    $('#pr-tech-bpm').value = prac.tech.bpm;
    $('#pr-tech-bpmv').textContent = prac.tech.bpm;
  }
  $('#pr-tech-toggle').addEventListener('click', () => {
    techOn = !techOn;
    $('#pr-tech-toggle').textContent = techOn ? '■ Стоп' : '▶ Щёлкать';
    if (techOn){
      let next = audio().currentTime + 0.1;
      techTimer = setInterval(() => {
        const ctx = audio();
        while (next < ctx.currentTime + 0.25){
          click(next, 1); // ровный средний бит
          next += 60 / prac.tech.bpm;
        }
      }, 80);
    } else clearInterval(techTimer);
  });
  $('#pr-tech-bpm').addEventListener('input', e => { prac.tech.bpm = +e.target.value; $('#pr-tech-bpmv').textContent = prac.tech.bpm; persistPrac(); });
  $('#pr-tech-done').addEventListener('click', () => { prac.tech.count++; persistPrac(); drawTech(); });

  /* Слух — угадай аккорд */
  const EAR_POOL = ['maj','min','7','m7','5','dim','sus4'];
  function playEarChord(){
    const c = prac.ear.cur;
    if (!c) return;
    const vs = findVoicings(c.root, c.q);
    if (vs.length) playVoicing(vs[0]);
    else CHORD_INTERVALS[c.q].forEach((o, i) => pluck(midiFreq(48 + c.root + o), i * 0.02, 0.5));
  }
  function drawEar(){
    const c = prac.ear.cur;
    $('#pr-ear-opts').innerHTML = c ? c.opts.map(o =>
      '<button class="chip" data-ear="' + o + '"' + (c.answered ? ' style="pointer-events:none; ' +
        (o === c.q ? 'background:var(--good); color:#141210; border-color:transparent; font-weight:700' : (o === c.answered ? 'color:var(--bad); border-color:var(--bad)' : 'opacity:.5')) + '"' : '') +
      '>' + esc(CHORD_LABEL[o] || o) + '</button>').join(' ') : '';
    $('#pr-ear-msg').innerHTML = !c ? '&nbsp;'
      : c.answered === null ? 'послушай и угадай тип'
      : c.answered === c.q ? '<b style="color:var(--good)">✓ Верно!</b> Это ' + esc(chordName(c.root, c.q))
      : '<b style="color:var(--bad)">✗</b> Это был ' + esc(chordName(c.root, c.q));
    $('#pr-ear-score').textContent = 'верно: ' + prac.ear.ok + ' из ' + prac.ear.total + ' · подряд: ' + prac.ear.streak + ' · рекорд: ' + prac.ear.best;
    $('#pr-ear-opts').querySelectorAll('[data-ear]').forEach(b =>
      b.addEventListener('click', () => {
        const cc = prac.ear.cur;
        if (!cc || cc.answered !== null) return;
        cc.answered = b.dataset.ear;
        prac.ear.total++;
        if (cc.answered === cc.q){ prac.ear.ok++; prac.ear.streak++; prac.ear.best = Math.max(prac.ear.best, prac.ear.streak); }
        else prac.ear.streak = 0;
        persistPrac();
        drawEar();
        playEarChord(); // повторить правильный аккорд после ответа
      }));
  }
  function newEarRound(){
    const q = pickOne(EAR_POOL);
    const opts = [q];
    while (opts.length < 4){ const o = pickOne(EAR_POOL); if (!opts.includes(o)) opts.push(o); }
    for (let i = opts.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
    prac.ear.cur = { root: rnd12(), q, opts, answered: null };
    persistPrac();
    drawEar();
    playEarChord();
  }
  $('#pr-ear-play').addEventListener('click', playEarChord);
  $('#pr-ear-next').addEventListener('click', newEarRound);

  /* Смена аккордов — два аккорда + метроном по тактам */
  let chTimer = 0, chOn = false;
  function randPairChord(){ // случайный аккорд, у которого есть аппликатура
    for (let i = 0; i < 30; i++){
      const root = rnd12(), q = pickOne(['maj', 'min']);
      if (findVoicings(root, q).length) return { root, q };
    }
    return { root: 0, q: 'maj' };
  }
  function drawChPair(){
    if (!prac.ch.cur) prac.ch.cur = { a: randPairChord(), b: randPairChord() };
    const cards = [prac.ch.cur.a, prac.ch.cur.b].map(c => {
      const vs = findVoicings(c.root, c.q);
      const v = vs && vs.length ? vs[0] : null;
      return '<div class="chord-card" style="cursor:default"><div class="cname">' + esc(chordName(c.root, c.q)) + '</div>' +
        (v ? chordDiagramSVG(v, c.root, c.q, { noTitle:true, fingers: deriveFingers(v) }) : '<div class="muted small">нет аппликатуры</div>') + '</div>';
    }).join('<span class="muted" style="align-self:center">→ в такт →</span>');
    $('#pr-ch-pair').innerHTML = '<div class="row">' + cards + '</div>';
    $('#pr-ch-count').textContent = 'подходов: ' + prac.ch.count;
    $('#pr-ch-bpm').value = prac.ch.bpm;
    $('#pr-ch-bpmv').textContent = prac.ch.bpm;
  }
  $('#pr-ch-roll').addEventListener('click', () => { prac.ch.cur = { a: randPairChord(), b: randPairChord() }; persistPrac(); drawChPair(); });
  $('#pr-ch-toggle').addEventListener('click', () => {
    chOn = !chOn;
    $('#pr-ch-toggle').textContent = chOn ? '■ Стоп' : '▶ Метроном';
    if (chOn){
      const ctx = audio();
      const barDur = (60 / prac.ch.bpm) * 4;
      let next = ctx.currentTime + 0.1, bar = 0;
      chTimer = setInterval(() => {
        const now = audio().currentTime;
        while (next < now + 0.3){
          for (let b = 0; b < 4; b++) click(next + b * (barDur / 4), b === 0 ? 2 : 0);
          const c = bar % 2 === 0 ? prac.ch.cur.a : prac.ch.cur.b; // такт — один аккорд
          const vs = findVoicings(c.root, c.q);
          if (vs.length) vs[0].f.forEach((f, i) => { if (f >= 0) pluck(midiFreq(tuningNotes()[i] + f), Math.max(0, next - audio().currentTime) + i * 0.02, 0.32); });
          next += barDur;
          bar++;
        }
      }, 80);
    } else clearInterval(chTimer);
  });
  $('#pr-ch-bpm').addEventListener('input', e => { prac.ch.bpm = +e.target.value; $('#pr-ch-bpmv').textContent = prac.ch.bpm; persistPrac(); });
  $('#pr-ch-done').addEventListener('click', () => { prac.ch.count++; persistPrac(); drawChPair(); });

  drawGamma(); drawLad(); drawTech(); drawEar(); drawChPair();
  renderModes($('#sc-modes')); // 🧭 Лады — переехали из отдельной вкладки
  $('[data-goquints]').addEventListener('click', () => showTool('circles'));

  el._cleanup = () => { timers.forEach(clearTimeout); timers = []; droneStop(); techOn = false; clearInterval(techTimer); chOn = false; clearInterval(chTimer); };
}

/* Инструменты: holes — число отверстий, notes — нота каждого положения (H+1:
   notes[0] = все отверстия закрыты, notes[k] = открыты нижние k). */
const WIND_INSTRUMENTS = [
  { id:'sopilka-c',  name:'🪈 Сопилка (до)',    holes:10, notes:[60,62,64,65,67,69,71,72,74,76,77] },
  { id:'sopilka-g',  name:'🪈 Сопилка (соль)',  holes:10, notes:[55,57,59,60,62,64,66,67,69,71,72] },
  { id:'whistle-d',  name:'🪈 Тин-вистл (ре)',  holes:6,  notes:[62,64,66,67,69,71,73,74] },
  { id:'recorder-c', name:'🪈 Блокфлейта (до)', holes:8,  notes:[72,74,76,77,79,81,83,84,85] },
  { id:'flute-c',    name:'🪈 Флейта (до)',     holes:12, notes:[60,61,62,63,64,65,66,67,68,69,70,71,72] },
];
const WIND_COLOR = '#69db7c';     // ноты лада на духовых
const TONIC_COLOR = 'var(--bad)'; // тоника (красная)
function getWindDef(){ // текущее определение духового (с учётом своих отверстий)
  const uiW = loadUI('wind');
  const id = WIND_INSTRUMENTS.some(x => x.id === uiW.inst) ? uiW.inst : WIND_INSTRUMENTS[0].id;
  const base = WIND_INSTRUMENTS.find(x => x.id === id);
  const custom = (loadUI('wind_custom') || {})[id];
  return custom && Array.isArray(custom.notes) && custom.notes.length >= 5
    ? { id, name: base.name + ' ★', holes: custom.holes, notes: custom.notes.slice(), custom: true }
    : base;
}

function renderWind(el){
  /* Духовые: трубка с отверстиями (по числу holes), у каждого отверстия своя нота.
     Гамма/пентатоника подсвечиваются на отверстиях, ниже — классические
     аппликатурные схемы (залитый кружок = закрытое отверстие). Свои отверстия
     (4–12) и ноты настраиваются и сохраняются. */
  const uiW = loadUI('wind');
  const windCustom = loadUI('wind_custom') || {};
  let inst = WIND_INSTRUMENTS.some(x => x.id === uiW.inst) ? uiW.inst : WIND_INSTRUMENTS[0].id;
  let tonic = Number.isInteger(uiW.tonic) ? uiW.tonic : 0;
  let scaleKey = SCALES[uiW.scaleKey] ? uiW.scaleKey : 'pentaMin';
  let melody = null, melodyTimers = [], melodyBpm = Number.isInteger(uiW.melodyBpm) ? uiW.melodyBpm : 120;
  let melodyShow = uiW.melodyShow !== false;
  let melHit = -1;
  const PHRASE_WIND = '#4dd0e1';
  const $ = s => el.querySelector(s);

  function def(){ return getWindDef(); }
  function saveCustom(holes, notes){
    windCustom[inst] = { holes, notes };
    saveUI('wind_custom', windCustom);
  }
  function resetCustom(){
    delete windCustom[inst];
    saveUI('wind_custom', windCustom);
  }

  el.innerHTML =
    '<h2>🪈 Духовые</h2>' +
    '<div class="card">' +
      '<div class="row" id="w-insts"></div>' +
      '<div class="row" style="margin-top:12px; padding:10px; border:1px solid var(--line); border-radius:12px">' +
        '<label class="small">Тоника <select id="w-key">' +
          NOTE_SHARP.map((n, i) => '<option value="' + i + '"' + (i === 0 ? ' selected' : '') + '>' + n + '</option>').join('') +
        '</select></label>' +
        '<label class="small">Гамма <select id="w-scale">' +
          '<optgroup label="Основные">' +
            SCALE_CORE.map(k => '<option value="' + k + '">' + SCALES[k].name + '</option>').join('') +
          '</optgroup>' +
          '<optgroup label="Guitar Grimoire">' +
            SCALE_GRIMOIRE.map(k => '<option value="' + k + '">' + SCALES[k].name + '</option>').join('') +
          '</optgroup>' +
        '</select></label>' +
        '<button class="btn small" id="w-play-scale" title="Проиграть гамму вверх от тоники флейтой">▶ Проиграть гамму</button>' +
        '<span class="muted small" id="w-info"></span>' +
      '</div>' +
      '<div class="fb-scroll" id="w-svg" style="margin-top:12px"></div>' +
      '<h3 style="margin:14px 0 6px; font-size:14px">Аппликатурные схемы — гамма на отверстиях</h3>' +
      '<div class="fb-scroll" id="w-finger" style="padding-bottom:4px"></div>' +
      '<details class="side-box" id="w-custom-box" style="margin-top:12px; border-top:3px solid var(--accent)">' +
        '<summary style="cursor:pointer; font-weight:700; color:var(--accent); letter-spacing:1.2px; font-size:13px">⚙️ СВОЙ СТРОЙ — число отверстий и нота каждого положения</summary>' +
        '<div class="muted small" style="margin:8px 0 8px">Положение = сколько нижних отверстий открыто; выбрал ноту — строй твой.</div>' +
        '<div id="w-custom"></div>' +
      '</details>' +
      '<div class="row" style="margin-top:12px">' +
        '<button class="btn primary small" id="w-gen">🎲 Мелодия</button>' +
        '<button class="btn small" id="w-play" title="Сыграть мелодию — играющая нота подсвечивается">▶</button>' +
        '<button class="btn small icon" id="w-stop" title="Стоп">⏹</button>' +
        '<button class="btn small icon" id="w-clear" title="Убрать мелодию">✕</button>' +
        '<label class="small muted" style="margin-left:auto">темп <b>' + melodyBpm + '</b> <input type="range" id="w-bpm" min="70" max="200" value="' + melodyBpm + '" style="width:110px; vertical-align:middle"></label>' +
      '</div>' +
      '<div class="side-list" id="w-mel-chips" style="margin-top:8px"></div>' +
      '<div class="muted small" style="margin-top:8px">Клик по отверстию — нота флейтой. <b>Повторяй ноты смело — повторение и делает мелодию.</b> Табы: бирюзовые номера над отверстиями — порядок игры.</div>' +
    '</div>';

  function stopMel(){ melodyTimers.forEach(clearTimeout); melodyTimers = []; melHit = -1; }
  function persistW(){ saveUI('wind', { inst, tonic, scaleKey, melodyBpm, melodyShow }); }

  function scaleEntries(){ // позиции (индексы), чьи ноты в гамме
    const d = def();
    const out = [];
    d.notes.forEach((midi, k) => {
      if (ivIn(midi, tonic, SCALES[scaleKey].iv)) out.push({ k, midi });
    });
    return out;
  }
  function ivIn(midi, root, iv){ return iv.includes(((midi - root) % 12 + 12) % 12); }

  function draw(){
    const d = def();
    const H = d.holes;
    const notes = d.notes;
    const holesN = notes.length; // H+1 положений
    const wrapEl = document.getElementById('w-svg');
    const avail = Math.max(560, (wrapEl && wrapEl.clientWidth) || 0);
    const hw = Math.max(24, (avail - 64) / holesN);
    const W = Math.round(30 + hw * holesN + 20), Hpx = 150;
    const cy = 92;
    const rHole = Math.max(9, Math.min(14, hw * 0.4));
    const fnt = Math.max(7.5, Math.min(10.5, hw * 0.33));
    let s = '<svg width="' + W + '" height="' + Hpx + '" viewBox="0 0 ' + W + ' ' + Hpx + '" style="min-width:' + Math.min(W, avail) + 'px; width:100%">';
    s += '<rect width="' + W + '" height="' + Hpx + '" fill="none"/>';
    s += '<rect x="12" y="' + (cy - 27) + '" width="' + Math.round(hw * holesN + 26) + '" height="54" rx="27" fill="var(--card2)" stroke="currentColor" stroke-opacity=".35"/>';
    s += '<rect x="18" y="' + (cy - 9) + '" width="11" height="18" rx="4" fill="currentColor" opacity=".55"/>';
    for (let k = 0; k < holesN; k++){
      const midi = notes[k];
      const pc = ((midi % 12) + 12) % 12;
      const inScale = ivIn(midi, tonic, SCALES[scaleKey].iv);
      const isTonic = pc === tonic;
      const x = 30 + k * hw + hw / 2;
      const melIdx = melody ? melody.findIndex(m2 => m2.k === k) : -1;
      const isHit = melIdx === melHit;
      const r = inScale ? rHole : Math.max(5, rHole * 0.55);
      const fill = isTonic ? TONIC_COLOR : (inScale ? WIND_COLOR : 'none');
      s += '<g data-k="' + k + '" style="cursor:pointer">' +
        '<circle cx="' + x + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '" stroke="currentColor" stroke-opacity="' + (inScale ? '.6' : '.3') + '" stroke-width="' + (isHit ? '3.5' : '1') + '" opacity="' + (inScale ? 1 : 0.3) + '"/>';
      if (inScale)
        s += '<text x="' + x + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="' + fnt + '" font-weight="800" fill="' + (isTonic ? '#fff' : '#141210') + '" pointer-events="none">' + pcName(pc) + '</text>';
      else
        s += '<circle cx="' + x + '" cy="' + cy + '" r="3" fill="currentColor" opacity=".5"/>';
      if (melIdx >= 0)
        s += '<text x="' + x + '" y="' + (cy - 36) + '" text-anchor="middle" font-size="11" font-weight="800" fill="' + (isHit ? '#fff' : PHRASE_WIND) + '" pointer-events="none">' + (melIdx + 1) + '</text>';
      s += '</g>';
    }
    s += '</svg>';
    const box = $('#w-svg');
    box.innerHTML = s;
    box.querySelectorAll('g[data-k]').forEach(g =>
      g.addEventListener('click', () => {
        const k = +g.dataset.k;
        windNote(notes[k], 0.9); // звучит
        const wbox = document.getElementById('w-custom-box'); // редактор строя раскрыт для смены ноты
        if (wbox) wbox.open = true;
        const csel = document.querySelector('#w-custom [data-wn="' + k + '"]'); // и открывает смену ноты
        if (csel){
          csel.scrollIntoView({ behavior: 'smooth', block: 'center' });
          csel.focus();
          csel.style.outline = '2px solid var(--accent)';
          setTimeout(() => { csel.style.outline = ''; }, 1200);
        }
      }));
    $('#w-info').textContent = d.name + (d.custom ? ' ★' : '') + ': ' + d.holes + ' отверстий, диапазон ' +
      noteFull(notes[0]) + '–' + noteFull(notes[notes.length - 1]) + ' (' + notes.length + ' нот)';
    fingerRow();
  }

  /* аппликатурные схемы: вертикальный столбик отверстий, залитый = закрыто */
  function fingerRow(){
    const box = $('#w-finger');
    if (!box) return;
    const d = def();
    const H = d.holes;
    const entries = scaleEntries();
    box.innerHTML = entries.map(e => {
      const open = Math.min(e.k, H); // открыты нижние k отверстий
      let col = '<svg width="26" height="' + (H * 18 + 8) + '" viewBox="0 0 26 ' + (H * 18 + 8) + '">';
      for (let h = 0; h < H; h++){
        const closed = h < H - open; // сверху закрытые
        const cy = 10 + h * 18;
        col += '<circle cx="13" cy="' + cy + '" r="6.5" fill="' + (closed ? WIND_COLOR : 'none') + '" stroke="currentColor" stroke-opacity=".55"/>';
      }
      col += '</svg>';
      return '<div class="w-finger"><div class="w-fcol">' + col + '</div><div class="w-fname">' + esc(pcName(e.midi)) + '</div></div>';
    }).join('') || '<span class="muted small">В этой гамме нет ни одной ноты на инструменте — смени тонику или гамму.</span>';
    box.querySelectorAll('.w-finger').forEach((w, i) => {
      w.style.cursor = 'pointer';
      w.addEventListener('click', () => windNote(entries[i].midi, 0.9));
    });
  }

  function drawCustom(){
    const box = $('#w-custom');
    if (!box) return;
    const d = def();
    let html = '<div class="row" style="align-items:center; gap:6px">' +
      '<span class="small muted">Отверстий:</span>' +
      '<button class="btn small icon" data-wh="-1">−</button>' +
      '<b>' + d.holes + '</b>' +
      '<button class="btn small icon" data-wh="1">+</button>' +
      '<span class="muted small">(от 4 до 12)</span>' +
      '<button class="btn small" data-wreset style="margin-left:auto">Сбросить к обычному</button>' +
      '</div>' +
      '<div class="muted small" style="margin-top:6px">Нота каждого положения: 0 — все отверстия закрыты (нижняя нота), 1 — открыт нижнее… ' +
      'Меняй ноты — строй инструмента твой.</div>' +
      '<div class="side-list" style="margin-top:8px">';
    d.notes.forEach((midi, k) => {
      html += '<div class="row" style="gap:6px; margin-bottom:4px; align-items:center">' +
        '<span class="muted small" style="width:110px">' + (k === 0 ? 'все закрыты:' : 'открыто нижних: ' + k) + '</span>' +
        '<select data-wn="' + k + '" style="width:90px">' +
          NOTE_SHARP.map((n, i) => {
            let sel = '';
            for (let o = 0; o <= 2; o++){
              const mm = i + 12 * o;
              if (mm === midi) sel = ' selected';
            }
            return '<option value="' + i + '"' + sel + '>' + n + '</option>';
          }).join('') +
        '</select>' +
        '<span class="muted small">' + noteFull(midi) + '</span>' +
        '</div>';
    });
    html += '</div>';
    box.innerHTML = html;
    box.querySelectorAll('[data-wh]').forEach(b =>
      b.addEventListener('click', () => {
        const d2 = def();
        const nh = Math.max(4, Math.min(12, d2.holes + +b.dataset.wh));
        if (nh === d2.holes) return;
        const notes = [];
        for (let k = 0; k <= nh; k++) notes.push(d2.notes[Math.min(k, d2.notes.length - 1)]);
        saveCustom(nh, notes);
        draw(); fingerRow(); drawCustom(); drawInsts();
      }));
    box.querySelectorAll('[data-wn]').forEach(sel =>
      sel.addEventListener('change', () => {
        const d2 = def();
        const k = +sel.dataset.wn;
        const notes = d2.notes.slice();
        const pc = +sel.value;
        const oct = Math.floor(k / 7); // октавы для диатонического строя
        notes[k] = pc + 12 * oct;
        notes.sort((a, b) => a - b);
        saveCustom(d2.holes, notes);
        draw(); fingerRow(); drawCustom();
      }));
    box.querySelector('[data-wreset]').addEventListener('click', () => {
      resetCustom();
      draw(); fingerRow(); drawCustom(); drawInsts();
    });
  }

  /* --- мелодия --- */
  function playScale(){
    const entries = scaleEntries();
    entries.forEach((e, i) => melodyTimers.push(setTimeout(() => windNote(e.midi, 0.55), i * 320)));
  }
  function genMelody(){
    const d = def();
    const entries = scaleEntries();
    if (entries.length < 4) return;
    const len = 8 + Math.floor(Math.random() * 5);
    let cur = entries[Math.floor(Math.random() * entries.length)];
    const seq = [{ ...cur, dur: pickDurW() }];
    for (let k = 1; k < len; k++){
      const nb = entries.filter(e => Math.abs(e.k - cur.k) === 1 || (Math.abs(e.k - cur.k) === 2 && Math.random() < 0.4));
      const r = Math.random();
      let next;
      if (r < 0.24){ next = cur; } // повтор ноты — мелодия
      else if (nb.length && r < 0.88){
        nb.sort((a, b) => Math.abs(a.midi - cur.midi) - Math.abs(b.midi - cur.midi));
        next = nb[Math.floor(Math.random() * Math.min(2, nb.length))];
      } else {
        next = entries[Math.floor(Math.random() * entries.length)];
      }
      seq.push({ ...next, dur: pickDurW() });
      cur = next;
    }
    const roots = entries.filter(e => ivIn(e.midi, tonic, SCALES[scaleKey].iv) && pcOf(e.midi) === tonic);
    if (roots.length){
      roots.sort((a, b) => Math.abs(a.midi - cur.midi) - Math.abs(b.midi - cur.midi));
      seq[seq.length - 1] = { ...roots[0], dur: 2 };
    }
    melody = seq;
    melHit = -1;
    persistW();
    draw(); drawMelChips();
  }
  function pcOf(midi){ return ((midi % 12) + 12) % 12; }
  function playMelody(){
    stopMel();
    if (!melody || !melody.length) return;
    const step = 30000 / melodyBpm;
    let t = 0;
    melody.forEach((m, i) => {
      melodyTimers.push(setTimeout(() => {
        if (!m.rest){
          windNote(m.midi, m.dur * step / 1000 * 0.9);
          melHit = melody.findIndex(x => x.k === m.k); // позиция отверстия
          draw(); drawMelChips();
        }
      }, t));
      t += m.dur * step;
    });
    melodyTimers.push(setTimeout(() => { melHit = -1; draw(); drawMelChips(); }, t + 300));
  }

  $('#w-key').addEventListener('change', e => { tonic = +e.target.value; saveUI('wind', { tonic }); stopMel(); draw(); fingerRow(); drawMelChips(); });
  $('#w-scale').addEventListener('change', e => { scaleKey = e.target.value; saveUI('wind', { scaleKey }); stopMel(); draw(); fingerRow(); drawMelChips(); });
  document.getElementById('w-play-scale').addEventListener('click', playScale);
  document.getElementById('w-gen').addEventListener('click', genMelody);
  document.getElementById('w-play').addEventListener('click', playMelody);
  document.getElementById('w-stop').addEventListener('click', () => { stopMel(); draw(); drawMelChips(); });
  document.getElementById('w-clear').addEventListener('click', () => { stopMel(); melody = null; draw(); drawMelChips(); });
  document.getElementById('w-bpm').addEventListener('input', e => { melodyBpm = +e.target.value; saveUI('wind', { melodyBpm }); });

  function pickDurW(){
    const r = Math.random();
    return r < 0.28 ? 0.5 : (r < 0.8 ? 1 : 2); // ♪ короткая / ♩ обычная / — длинная
  }

  function drawMelChips(){
    const box = $('#w-mel-chips');
    if (!box) return;
    box.innerHTML = melody && melody.length
      ? melody.map((m, i) =>
          '<button class="side-chip' + (i === melHit ? ' on' : '') + '" data-i="' + i + '" title="Клик — прозвучит"><span class="muted small">' + (i + 1) + '.</span> <b>' +
          noteFull(m.midi) + '</b> <span class="muted small">' + (m.dur === 0.5 ? '♪' : m.dur === 2 ? '—' : '♩') + '</span></button>').join('')
      : '<div class="muted small">Мелодии пока нет — жми 🎲 Мелодия.</div>';
    box.querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => windNote(melody[+b.dataset.i].midi, 0.9)));
  }

  function drawInsts(){
    $('#w-insts').innerHTML = WIND_INSTRUMENTS.map(x => {
      const c = windCustom[x.id];
      return '<button class="chip' + (x.id === inst ? ' on' : '') + '" data-inst="' + x.id + '">' + x.name + (c ? ' ★' : '') + '</button>';
    }).join(' ');
    $('#w-insts').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { inst = b.dataset.inst; saveUI('wind', { inst }); stopMel(); drawInsts(); draw(); fingerRow(); drawMelChips(); }));
  }
  drawInsts();
  drawCustom();
  draw();
  fingerRow();
  drawMelChips();
  el._cleanup = () => { stopMel(); droneStop(); };
  el._windDef = def; // вкладка «Гриф» читает определение духовых
}
/* ================= РЕЕСТР ИНСТРУМЕНТОВ =================
   Свой инструмент = одна строка здесь + функция renderИмя(el) выше.
   Пример: { id:'my', icon:'✨', title:'Моё', render:renderMy } */
const TOOLS = [
  { id:'fret',   icon:'🎼', title:'Гриф',       render:renderFretboard },
  { id:'circles', icon:'🎡', title:'Круги',    render:renderCircles },
  { id:'prog',   icon:'🎶', title:'Прогрессии', render:renderProgressions },
  { id:'chords', icon:'🎸', title:'Аккорды',    render:renderChords },
  { id:'song',   icon:'🎵', title:'Песня',      render:renderSong },
  { id:'school', icon:'🎓', title:'Школа',      render:renderSchool },
  { id:'wind',   icon:'🪈', title:'Духовые',    render:renderWind },
  { id:'tools',  icon:'🧰', title:'Инструменты', render:renderTools },
];

/* ================= КАРКАС ПРИЛОЖЕНИЯ ================= */

const app = document.getElementById('app');
const nav = document.getElementById('nav');
let activeId = null;
const rendered = new Map();

TOOLS.forEach(t => {
  const sec = document.createElement('section');
  sec.className = 'tool'; sec.id = 'tool-' + t.id;
  app.appendChild(sec);
  const b = document.createElement('button');
  b.innerHTML = '<span class="ic">' + t.icon + '</span>' + t.title;
  b.dataset.tool = t.id;
  b.addEventListener('click', () => showTool(t.id));
  nav.appendChild(b);
});

function currentSection(){ return document.getElementById('tool-' + activeId); }

function showTool(id){
  const prev = TOOLS.find(t => t.id === activeId);
  if (prev && prev.id !== id){
    const sec = document.getElementById('tool-' + prev.id);
    if (sec && sec._cleanup) sec._cleanup(); // стоп звука/микрофона при уходе со вкладки (можно вызывать многократно)
  }
  activeId = id;
  app.querySelectorAll('section.tool').forEach(s => s.classList.remove('active'));
  const sec = document.getElementById('tool-' + id);
  const t = TOOLS.find(x => x.id === id);
  sec.classList.add('active'); // сначала показать вкладку (нужна реальная ширина для отрисовки), потом рисовать
  if (!rendered.has(id)){ t.render(sec); rendered.set(id, true); }
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tool === id));
  window.scrollTo(0, 0); // смена вкладки — смотрим с начала (скролл длинной вкладки не тянется за глаза)
}

/* горячие клавиши: event.code — раскладка не важна; обрабатывает активная вкладка */
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const t = e.target;
  if (t && /INPUT|SELECT|TEXTAREA/.test(t.tagName)) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const sec = document.getElementById('tool-' + activeId);
  if (sec && sec._hotkey && sec._hotkey(e)) e.preventDefault();
});

/* модальные окна: принимают готовый элемент (с живыми обработчиками) или строку HTML */
function openModal(content){
  const root = document.getElementById('modal-root');
  root.innerHTML = '<div class="overlay"><div class="sheet">' +
    '<button class="btn icon modal-close">✕</button></div></div>';
  const sheet = root.querySelector('.sheet');
  if (typeof content === 'string') sheet.insertAdjacentHTML('beforeend', content);
  else sheet.appendChild(content);
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  root.querySelector('.overlay').addEventListener('click', e => { if (e.target.classList.contains('overlay')) close(); });
  root.querySelector('.modal-close').addEventListener('click', close);
  document.addEventListener('keydown', onKey);
}

/* настройки открываются шестерёнкой (отдаём живой элемент — обработчики сохраняются) */
document.getElementById('btn-settings').addEventListener('click', () => {
  const wrap = document.createElement('div');
  renderSettings(wrap);
  openModal(wrap);
});

/* ================= СТАРТ ================= */
document.getElementById('ver').textContent = 'v' + APP_VERSION;
document.documentElement.dataset.theme = settings.theme;
document.documentElement.dataset.density = settings.density || 'compact';
document.addEventListener('pointerdown', () => audio(), { once:true });
showTool('fret');

/* PWA: service worker регистрируется ТОЛЬКО по https (публикация на GitHub Pages).
   При запуске двойным кликом (file://) ничего не происходит — ярлык на рабочем
   столе работает ровно как раньше. */
if (location.protocol === 'https:' && 'serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
