 і пройди бокси 2–5 ля-мінорної пентатоніки.",fret:[9,"pentaMin"]}},l51:{en:{t:"Connecting the boxes",x:"You don’t play boxes, you play the NECK: from the end of box 1 step into the start of box 2 without a pause. The seams are the most valuable part.<br><b>Do:</b> play box 1 up, box 2 up, box 1 down — a continuous route."},uk:{t:"Зв’язка боксів",x:"Грають не бокси, а ГРИФ: з кінця бокса 1 крокуй у початок бокса 2 без паузи. Стикови — найцінніша частина.<br><b>Зроби:</b> грай бокс 1 вверх, бокс 2 вверх, бокс 1 вниз — безперервний маршрут."}},l52:{en:{t:"The blues scale (+ a bend on ♭5)",x:"Blues = minor pentatonic + ♭5 — the “evil” note that gets bent. It’s what makes the groove bluesy.<br><b>Do:</b> E blues, find the ♭5 and bend it up a whole tone.",fret:[0,"blues"]},uk:{t:"Блюзова гама (+бенд на ♭5)",x:"Блюзова = мінорна пентатоніка + ♭5 — «зла» нота, яку тягнуть бендом. Вона і робить грув блюзовим.<br><b>Зроби:</b> мі-блюзова, знайди ♭5 і підтягни її бендом на тон.",fret:[0,"blues"]}},l53:{en:{t:"Natural minor",x:"Minor — the same major, another character (tones/semitones placed differently). A minor = the notes of C major centred on A.<br><b>Do:</b> A minor on the fretboard, play up and down and compare with the pentatonic.",fret:[9,"minor"]},uk:{t:"Натуральний мінор",x:"Мінор — той самий мажор, але з іншим характером (інакше розставлені тони/півтони). Ля-мінор = ноти до-мажора з центром в A.<br><b>Зроби:</b> ля-мінор на грифі, зіграй вверх-вниз і порівняй із пентатонікою.",fret:[9,"minor"]}},l54:{en:{t:"Harmonic and melodic minor",x:"Harmonic minor — a minor with a raised VII (an eastern taste, “Spanish”). Melodic — VI and VII raised. Both are for dramatic melodies.<br><b>Do:</b> A harmonic on the fretboard — find the “gaping” step between VI and VII.",fret:[9,"harmonic"]},uk:{t:"Гармонійний і мелодійний мінор",x:"Гармонійний мінор — мінор із високою VII (східний смак, «іспанка»). Мелодійний — підняті VI і VII вгору. Обидва — для драматичних мелодій.<br><b>Зроби:</b> ля-гармонійний на грифі — знайди «розкритий» крок між VI і VII.",fret:[9,"harmonic"]}},l55:{en:{t:"The Dorian mode",x:"Dorian = minor with a “bright” VI — a trendy modal vibe (funk, rock). D dorian = all white keys from D.<br><b>Do:</b> D dorian on the fretboard, play over a D drone or backing.",fret:[2,"dorian"]},uk:{t:"Дорійський лад",x:"Дорійський = мінор зі «світлою» VI — модний модальний вайб (фанк, рок). Ре-дорійський = усі білі клавіші від D.<br><b>Зроби:</b> ре-дорійський на грифі, грай із дроном або фоном ре.",fret:[2,"dorian"]}},l56:{en:{t:"Phrygian and Locrian",x:"Phrygian — a minor with a low II: the “Spanish” shade. Locrian — the “darkest” mode with a low V. Both — for tension.<br><b>Do:</b> E phrygian on the fretboard, compare with plain E minor.",fret:[4,"phrygian"]},uk:{t:"Фригійський і локрійський",x:"Фригійський — мінор із низькою II: «іспанський» відтінок. Локрійський — най«темніший» лад із низькою V. Обидва — для напруги.<br><b>Зроби:</b> мі-фригійський на грифі, порівняй зі звичайним мі-мінором.",fret:[4,"phrygian"]}},l57:{en:{t:"Lydian and Mixolydian",x:"Lydian — a major with #IV (fairytale). Mixolydian — a major with ♭VII (rock-major). Both — “a major with a surprise”.<br><b>Do:</b> G mixolydian on the fretboard, play over a G backing.",fret:[7,"mixolydian"]},uk:{t:"Лідійський і міксолідійський",x:"Лідійський — мажор із #IV (казковість). Міксолідійський — мажор із ♭VII (рок-мажор). Обидва — «мажор із сюрпризом».<br><b>Зроби:</b> соль-міксолідійський на грифі, грай із фоном G.",fret:[7,"mixolydian"]}},l58:{en:{t:"Positions and moves",x:"One scale — up to 7 positions on the neck. A move — shifting the whole hand a few frets without changing notes.<br><b>Do:</b> C major in the 1st and 7th position (the «Position» select on the fretboard) — hear the timbre difference.",fret:[0,"major"]},uk:{t:"Позиції і переїзди",x:"Одна гама — до 7 позицій по грифу. Переїзд — зміщення всієї руки на кілька ладів без зміни нот.<br><b>Зроби:</b> до-мажор у 1-й позиції і в 7-й (селект «Позиція» на грифі) — почуй різницю тембру.",fret:[0,"major"]}},l59:{en:{t:"“Scale of the day” — daily practice",x:"The best way to know the neck — a new random scale every day. Two minutes a day beats two hours a month.<br><b>Do:</b> open «🏋 Practices → 🎲 Scale of the day» and do today’s.",app:{text:"The «Scale of the day» practice — in School.",sect:"prac",btn:"🏋 To practices"}},uk:{t:"«Гама дня» — щоденна практика",x:"Найкращий спосіб знати гриф — щодня нова випадкова гама. Дві хвилини на день дають більше, ніж дві години на місяць.<br><b>Зроби:</b> відкрий «🏋 Практики → 🎲 Гама дня» і пройди сьогоднішню.",app:{text:"Практика «Гама дня» — у Школі.",sect:"prac",btn:"🏋 До практик"}}},l60:{en:{t:"Improvising: phrases, repeats, breathing",x:"Improvisation is not a stream of notes but PHRASES, like speech: say it — pause. Repeating motifs makes a melody recognisable. Breathe at the ends of phrases.<br><b>Do:</b> 🎲 Phrase on the fretboard — play it and repeat with your hands."},uk:{t:"Імпровізація: фрази, повтори, дихання",x:"Імпровізація — не потік нот, а ФРАЗИ, як мова: сказав — пауза. Повтор мотивів робить мелодію впізнаваною. Дихай на кінцях фраз.<br><b>Зроби:</b> 🎲 Фраза на грифі — програй її і повтори своїми руками."}},l61:{en:{t:"Improvising over the ▶ Backing",x:"The backing sets the chords and rhythm — your pentatonic always fits. Play simple: 2–3 notes, rhythm matters more than quantity.<br><b>Do:</b> turn on the «▶ Backing» in «Mode of the day» and improvise 8 bars on scale notes only.",app:{text:"The backing — in «🏋 Practices → Mode of the day».",sect:"prac",btn:"🏋 To practices"}},uk:{t:"Імпровізація під ▶ Фон",x:"Фон задає акорди і ритм — твоя пентатоніка завжди до місця. Грай просто: 2–3 ноти, ритм важливіший за кількість.<br><b>Зроби:</b> увімкни «▶ Фон» у «Ладі дня» і імпровізуй 8 тактів тільки на нотах гами.",app:{text:"Фон — в «🏋 Практики → Лад дня».",sect:"prac",btn:"🏋 До практик"}}},l62:{en:{t:"Target notes: land on the chord",x:"A pro secret: on STRONG beats play the chord tones, on weak ones — passing notes. The melody instantly “sits” on the harmony.<br><b>Do:</b> over the backing, on beat 1 play the root or third of that bar’s chord."},uk:{t:"Таргет-ноти: потрапляй в акорд",x:"Професійний секрет: на СИЛЬНІ частки грай тони поточного акорду, на слабкі — прохідні. Мелодія одразу «лягає» на гармонію.<br><b>Зроби:</b> із фоном грай так: на 1-у частку — тон або терція акорду такту."}},l63:{en:{t:"The 1-2-3-4 “spider”",x:"Chromatics with fingers 1-2-3-4 on every string — the basic warm-up: evenness, strength, finger independence.<br><b>Do:</b> a run with the clicks in «🏋 Practices → Technique».",app:{text:"Clicks with tempo — in Practices.",sect:"prac",btn:"🏋 To practices"}},uk:{t:"«Павучок» 1-2-3-4",x:"Хроматика пальцями 1-2-3-4 на кожній струні — базова розминка: рівність, сила, незалежність пальців.<br><b>Зроби:</b> підхід під клацання в «🏋 Практики → Техника».",app:{text:"Клацання з темпом — в «Практиках».",sect:"prac",btn:"🏋 До практик"}}},l64:{en:{t:"Alternate picking",x:"Always alternate: down-up-down-up, even on one note. It doubles speed almost for free.<br><b>Do:</b> chromatics with strict D-U-D-U picking — slowly, watch the hand."},uk:{t:"Альтернативний медіатор",x:"Завжди чергуй: вниз-вверх-вниз-вверх, навіть на одному звуку. Це подвоює швидкість майже задарма.<br><b>Зроби:</b> хроматика медіатором строго D-U-D-U — повільно, стеж за рукою."}},l65:{en:{t:"Hammer-on and pull-off",x:"Hammer-on: a note is taken by a LEFT-hand finger tapping the fret (no right hand). Pull-off: the finger snaps the string while lifting. Together — legato, “flowing” notes.<br><b>Do:</b> on the 3rd string: 5 → hammer 7 → pull 5."},uk:{t:"Хамер-он і пул-офф",x:"Хамер-он: нота береться ПАЛЬЦЕМ лівої ударом по грифу (без правої руки). Пул-офф: палець зриває струну, знімаючись. Разом — легато, «текучі» ноти.<br><b>Зроби:</b> на 3-й струні: 5 → хамер 7 → пул 5."}},l66:{en:{t:"Slides",x:"A slide — moving along the string with a fretted note: the sound “drives” between notes. Take the note CLEAN, then travel.<br><b>Do:</b> on the 2nd string 5 → slide → 8 → slide back."},uk:{t:"Слайди",x:"Слайд — рух уздовж струни з притиснутою нотою: звук «переїжджає» між нотами. Беремо ноту ЧИСТО, потім їдемо.<br><b>Зроби:</b> на 2-й струні 5 → слайд → 8 → слайд назад."}},l67:{en:{t:"Bends",x:"A bend — pulling the string with your fingers up to the neighbouring note (a semitone or a tone). The acid and expression of blues. Pull with the wrist and elbow, not the fingers.<br><b>Do:</b> 3rd string, 7th fret — bend a whole tone, compare with the real note at the 9th."},uk:{t:"Бенди",x:"Бенд — підтягування струни пальцями до сусідньої ноти (півтон або тон). Кислота і експресія блюзу. Тягни зап’ястком і ліктем, не пальцями.<br><b>Зроби:</b> на 3-й струні 7-й лад — бенд на тон, порівняй із реальною нотою на 9-му."}},l68:{en:{t:"Vibrato",x:"Vibrato — a living sway of the note (pitch or volume). Rhythmic, slow at the start of the note, speeding to the end.<br><b>Do:</b> a long note on the 2nd string 10th fret — bring in vibrato over 2 seconds."},uk:{t:"Вібрато",x:"Вібрато — живе похитування ноти (зміна висоти або гучності). Ритмічне, повільне на початку ноти, прискорюється до кінця.<br><b>Зроби:</b> довга нота на 2-й струні 10-го ладу — підведи вібрато за 2 секунди."}},l69:{en:{t:"Legato licks in the pentatonic",x:"A lick — a short beautiful phrase. In the pentatonic it’s made with hammers/pulls: 2–3 notes per one right-hand strike.<br><b>Do:</b> the classic A minor pentatonic lick: 8-5-7-5 hammered on the 1st string.",fret:[9,"pentaMin"]},uk:{t:"Легато-ліки в пентатоніці",x:"Лік — коротка красива фраза. У пентатоніці робиться хамерами/пулами: 2–3 ноти на один удар правої.<br><b>Зроби:</b> класичний лік у ля-мінорній пентатоніці: 8-5-7-5 хамерами на 1-й струні.",fret:[9,"pentaMin"]}},l70:{en:{t:"Arpeggios over a chord",x:"An arpeggio — the chord’s notes one by one: melody and harmony at once. Play the chord’s notes up and back down.<br><b>Do:</b> a Cmaj arpeggio on the fretboard — chord tones in a row.",play:[0,"maj"]},uk:{t:"Арпедджіо по акорду",x:"Арпедджіо — ноти акорда по одній: мелодія і гармонія одночасно. Грай ноти акорда знизу вверх і назад.<br><b>Зроби:</b> арпедджіо Cmaj на грифі — тони акорда підряд.",play:[0,"maj"]}},l71:{en:{t:"Sweeps (an intro)",x:"A sweep — the pick “sweeps” the strings in one motion, the left hand mutes between notes. Flashy, but demands evenness.<br><b>Do:</b> a three-note sweep on Em (top strings) — slowly, metronome 50."},uk:{t:"Свіпи (вступ)",x:"Свіп — медіатор «підмітає» струни одним рухом, ліва глушить між нотами. Ефектно, але вимагає рівності.<br><b>Зроби:</b> трьохнотний свіп на Em (верхні струни) — повільно, метроном 50."}},l72:{en:{t:"Triplets and triplet feel",x:"A triplet — three notes in the time of two: “ta-ta-ta” evenly. Count “trip-let” or “cof-fee”. Needed for shuffle and blues.<br><b>Do:</b> chromatics in triplets counting “1-and-a”."},uk:{t:"Тріолі і трипл-почуття",x:"Тріоль — три ноти на час двох: «та-та-та» рівно. Рахуй «трі-п-лет» або «ко-фе-чай». Потрібна для шафла і блюзу.<br><b>Зроби:</b> хроматика тріолями під рахунок «1-і-а»."}},l73:{en:{t:"Dynamics",x:"Volume is an instrument of expression: verse quieter, chorus louder, the climax — the strongest attack. Playing deliberately soft is harder.<br><b>Do:</b> the same strum at three volumes: soft-medium-loud."},uk:{t:"Динаміка",x:"Гучність — інструмент виразності: куплет тихіше, приспів гучніше, кульмінація — найсильніша атака. Грай усвідомлено тихо — це складніше.<br><b>Зроби:</b> той самий бій у трьох гучностях: тихо-середньо-гучно."}},l74:{en:{t:"Palm mute",x:"Palm mute — the side of the right palm touches the strings near the bridge: a rolling muted sound. The base of punk/metal riffs.<br><b>Do:</b> an E5 power chord with palm mute in eighths — compare with open."},uk:{t:"Палм-м’ют",x:"Палм-м’ют — ребро долоні правої торкається струн біля бриджу: рокочучий приглушений звук. Основа рифів панк/метал.<br><b>Зроби:</b> пауер-акорд E5 із палм-м’ютом восьмими — порівняй з відкритим."}},l75:{en:{t:"Natural harmonics",x:"A harmonic — touching the string ABOVE the fret (without pressing) and striking: a clean “whistling” tone. Magic spots: frets 12, 7 and 5.<br><b>Do:</b> harmonics over the 12th fret on all strings."},uk:{t:"Натуральні флажолети",x:"Флажолет — дотик струни НАД ладом (не притискаючи) і удар: чистий «свистячий» тон. Магічні точки: 12, 7 і 5 лади.<br><b>Зроби:</b> флажолети над 12-м ладом на всіх струнах."}},l77:{en:{t:"Semitones and whole tones",x:"A semitone — 1 fret on the neck (the smallest step), a whole tone — 2 frets. On a piano: adjacent keys are semitones, skipping one — a tone.<br><b>Do:</b> play the chromatic from E along the 6th string — all 12 semitones."},uk:{t:"Півтони і тони",x:"Півтон — 1 лад на грифі (найменший крок), тон — 2 лади. На піаніно: сусідні клавіші — півтон, через одну — тон.<br><b>Зроби:</b> зіграй хроматику від E по 6-й струні — всі 12 півтонів."}},l78:{en:{t:"Major construction",x:"Major — the formula T-T-S-T-T-T-S (tone-tone-semitone…). From C: C-D-E-F-G-A-B-C. Change the root — the formula stays.<br><b>Do:</b> build G major on the 6th string by the formula.",fret:[0,"major"]},uk:{t:"Будова мажора",x:"Мажор — формула Т-Т-П-Т-Т-Т-П. Від C: C-D-E-F-G-A-B-C. Змінюємо корінь — формула та ж.<br><b>Зроби:</b> побудуй G-мажор на 6-й струні за формулою.",fret:[0,"major"]}},l79:{en:{t:"Minor construction",x:"Natural minor — T-S-T-T-S-T-T. From A: A-B-C-D-E-F-G-A. The “sad” character comes from the low III.<br><b>Do:</b> build E minor by the formula from E.",fret:[4,"minor"]},uk:{t:"Будова мінора",x:"Натуральний мінор — Т-П-Т-Т-П-Т-Т. Від A: A-B-C-D-E-F-G-A. Характер «сумний» через низьку III ступінь.<br><b>Зроби:</b> побудуй мі-мінор за формулою від E.",fret:[4,"minor"]}},l80:{en:{t:"Intervals",x:"An interval — the distance between notes: unison (0), second (2), third (4), fourth (5), fifth (7), sixth (9), seventh (11), octave (12) — in semitones. Chords are stacks of intervals.<br><b>Do:</b> click the interactive in «🧭 Modes» — an interval from all 12 notes.",app:{text:"The interactive — in «🧭 Modes».",sect:"modes",btn:"🧭 To modes"}},uk:{t:"Інтервали",x:"Інтервал — відстань між нотами: прима (0), секунда (2), терція (4), кварта (5), квінта (7), секста (9), септима (11), октава (12) — у півтонах. Акорди — стопки інтервалів.<br><b>Зроби:</b> пощелкай інтерактив у розділі «🧭 Лади» — інтервал від усіх 12 нот.",app:{text:"Інтерактив — у розділі «🧭 Лади».",sect:"modes",btn:"🧭 До ладів"}}},l81:{en:{t:"The circle of fifths",x:"A step around the circle = a fifth (7 semitones). Clockwise — +1 sharp, counter — +1 flat. Neighbours differ by one note. A key + 2 neighbours + minor partners = 6 chords for a song. V → I — coming home.<br><b>Do:</b> spin the interactive circle.",app:{text:"The interactive circle — the «🎡 Circles» tab.",tool:"circles",btn:"🎡 Circles"}},uk:{t:"Квінтовий круг",x:"Крок по колу = квінта (7 півтонів). За годинниковою — +1 дієз, проти — +1 бемоль. Сусіди відрізняються однією нотою. Тональність + 2 сусіди + мінорні партнери = 6 акордів для пісні. V → I — повернення додому.<br><b>Зроби:</b> покрути інтерактивний круг.",app:{text:"Інтерактивний круг — вкладка «🎡 Круги».",tool:"circles",btn:"🎡 Круги"}}},l82:{en:{t:"Keys and signatures",x:"Every major key has its set of sharps/flats: G — 1♯, D — 2♯, A — 3♯… F — 1♭, B♭ — 2♭… The signs follow the circle of fifths.<br><b>Do:</b> on the «⏰ Circle» look at the chosen key’s signature (the numbers on the rim)."},uk:{t:"Тональності і знаки",x:"Кожна мажорна тональність має свій набір дієзів/бемолів: G — 1♯, D — 2♯, A — 3♯… F — 1♭, B♭ — 2♭… Знаки йдуть по квінтовому колу.<br><b>Зроби:</b> на вкладці «⏰ Круг» подивись знак обраної тональності (цифри по ободу)."}},l83:{en:{t:"Diatonic chords of a mode",x:"On every degree of the scale a triad is built: in major — I ii iii IV V vi vii°. That’s the key’s “palette” — chords that sound together without accidents.<br><b>Do:</b> on the «🎵 Song» tab look at the «From the key» palette."},uk:{t:"Діатонічні акорди ладу",x:"На кожній ступені гами будується тризвук: у мажорі — I ii iii IV V vi vii°. Це «палітра» тональності — акорди, які звучать разом без випадковостей.<br><b>Зроби:</b> у вкладці «🎵 Пісня» подивись палітру «З тональності»."}},l84:{en:{t:"Roles: why each chord sounds so",x:"Degrees have characters: I — home, V — the spring, vi — sadness… Knowing the roles, you predict how a progression will sound before playing it.<br><b>Do:</b> hover the cards in «From the key» — the role is in the tooltip."},uk:{t:"Ролі: чому кожен акорд звучить так",x:"Ступені мають характери: I — дім, V — пружина, vi — смуток… Знаючи ролі, ти передбачиш звучання прогресії ще до гри.<br><b>Зроби:</b> наведи на картки «З тональності» — роль у підказці."}},l85:{en:{t:"Cadences",x:"A cadence — the “landing” at the end of a phrase. Full (V → I), plagal (IV → I, church-soft), deceptive (V → vi — expected home, got sadness).<br><b>Do:</b> play each cadence in C from the chords tab."},uk:{t:"Каденції",x:"Каденція — «посадка» наприкінці фрази. Повна (V → I), плагальна (IV → I, церковно-ніжна), обманлива (V → vi — чекали додому, потрапили в смуток).<br><b>Зроби:</b> зіграй кожну каденцію в C з вкладки акордів."}},l86:{en:{t:"Tensions: 7ths and extensions",x:"Sevenths add a “question”, ninths add air, thirteenths — jazzy sparkle. Tensions add colour without changing the function.<br><b>Do:</b> play C → C7 → C9 → C13 — hear the colour grow."},uk:{t:"Напруги: септимі та розширення",x:"Септими додають «питання», нони — повітря, терцдецими — джазовий блиск. Напруги додають колір, не змінюючи функцію.<br><b>Зроби:</b> зіграй C → C7 → C9 → C13 — почуй, як росте колір."}},l87:{en:{t:"Borrowed chords",x:"Borrowed chords come from the parallel key: ♭VII, ♭VI, ♭III, iv — they add colour “from the other side”. After them you usually return to the tonic.<br><b>Do:</b> on the «🎵 Song» tab look at the «Nice borrowed» section.",app:{text:"Borrowed chords — on the «🎵 Song» tab.",tool:"song",btn:"🎵 Song"}},uk:{t:"Запозичені акорди",x:"Запозичені акорди приходять із паралельної тональності: ♭VII, ♭VI, ♭III, iv — вони додають колір «з іншого боку». Після них зазвичай повертаються в тоніку.<br><b>Зроби:</b> на вкладці «🎵 Пісня» подивись розділ «Гарні запозичені».",app:{text:"Запозичені акорди — у вкладці «🎵 Пісня».",tool:"song",btn:"🎵 Пісня"}}},l88:{en:{t:"Modal colours",x:"Modes are the same notes with another centre: dorian — bright minor, mixolydian — rock-major, phrygian — Spanish… Each mode is a ready-made “mood” of a song.<br><b>Do:</b> switch the mode chips on the «🎵 Song» tab and hear the character change.",app:{text:"Mode chips — on the «🎵 Song» tab.",tool:"song",btn:"🎵 Song"}},uk:{t:"Модальні кольори",x:"Лади — ті самі ноти з іншим центром: дорійський — світлий мінор, міксолідійський — рок-мажор, фригійський — іспанський… Кожен лад — готовий «настрій» пісні.<br><b>Зроби:</b> переключи чіпи ладів на «🎵 Пісні» і почуй зміну характеру.",app:{text:"Чіпи ладів — у вкладці «🎵 Пісня».",tool:"song",btn:"🎵 Пісня"}}},l89:{en:{t:"Transposing ±1 semitone",x:"Shifting a song a semitone = shifting ALL its chords (or moving the barre shapes). That’s how songs are fitted to a voice.<br><b>Do:</b> take I-V-vi-IV from C and play the same from C♯ — every chord a semitone higher.",app:{text:"Live transpose buttons — on the «🎵 Song» tab (♭ −1 / ♯ +1 in the «Your song» row).",tool:"song",btn:"🎵 Song"}},uk:{t:"Транспонування ±півтон",x:"Зсунути пісню на півтон = зсунути ВСІ акорди на півтон (або передвинути форми баре). Так пісню підлаштовують під голос.<br><b>Зроби:</b> візьми I-V-vi-IV від C і зіграй те саме від C♯ — всі акорди на півтон вище.",app:{text:"Живі кнопки транспонування — у вкладці «🎵 Пісня» (♭ −1 / ♯ +1 у ряду «Твоя пісня»).",tool:"song",btn:"🎵 Пісня"}}},l90:{en:{t:"How to detect a song’s key",x:"Signs: the first/last chord is often the tonic; look at whose palette fits more chords. The app hints by itself: «Looks like the key…».<br><b>Do:</b> put chords into «🎵 Song» and read the hint line.",app:{text:"The hint — on the «🎵 Song» tab.",tool:"song",btn:"🎵 Song"}},uk:{t:"Як визначити тональність пісні",x:"Ознаки: перший/останній акорд часто тоніка; дивись, у чию палітру лягає більше акордів. Програма сама підказує: «Схоже, тональність…».<br><b>Зроби:</b> зібери акорди в «🎵 Пісня» і читай рядок підказки.",app:{text:"Підказка — у вкладці «🎵 Пісня».",tool:"song",btn:"🎵 Пісня"}}},l91:{en:{t:"The capo",x:"A capo at the Nth fret = all open shapes sound N semitones higher. Play “comfortable” shapes — change the key with one clamp.<br><b>Do:</b> capo at the 2nd fret + G-C-Em-D shapes = sounds A-D-F#m-E."},uk:{t:"Каподастр",x:"Каподастр на N-му ладу = всі відкриті акорди звучать на N півтонів вище. Грай «зручні» форми — змінюй тональність одним зажимом.<br><b>Зроби:</b> каподастр на 2-му ладу + форми G-C-Em-D = звучить A-D-F#m-E."}},l92:{en:{t:"Tunings: drops and open",x:"Drop D (6th string to D) — riffs on the two lowest strings with one finger. Open G — slide blues and Keith Richards’ guitars. A tuning changes the very logic of the neck.<br><b>Do:</b> switch to Drop D in Settings and compare.",app:{text:"Tunings — in ⚙️ Settings.",tool:"settings",btn:"⚙️ Settings"}},uk:{t:"Строї: дропи і відкриті",x:"Drop D (6-я струна в D) — риффи на двох нижніх струнах одним пальцем. Open G — слайд-блюз і гітари Кіта Річардса. Стрій змінює саму логіку грифу.<br><b>Зроби:</b> увімкни Drop D у Налаштуваннях і порівняй.",app:{text:"Строї — в ⚙️ Налаштуваннях.",tool:"settings",btn:"⚙️ Налаштування"}}},l93:{en:{t:"Breaking down a 2-chord song",x:"Take any two-chord hit (8 strums per chord). The breakdown scheme: listen to the original → find the tonic/partner → the strum → words on top.<br><b>Do:</b> Em–Am, 8 cycles with eighth strums."},uk:{t:"Розбір пісні з 2 акордів",x:"Візьми будь-який двоакордний хіт (8 ударів на акорд). Схема розбору: послухай оригінал → знайди тоніку/напарника → бій → слова поверх.<br><b>Зроби:</b> Em–Am, 8 кругів з боєм восьмими."}},l94:{en:{t:"Breaking down a 3-chord song",x:"Three chords = I-IV-V (or i-VI-VII). Scheme: tonic verse → IV in the chorus → V before the return. 90% of campfire songs live here.<br><b>Do:</b> A-D-E or Am-Dm-Em — any strum."},uk:{t:"Розбір пісні з 3 акордів",x:"Три акорди = I-IV-V (або i-VI-VII). Схема: тоніка-куплет → IV у приспіві → V перед поверненням. 90% дворових пісень живуть тут.<br><b>Зроби:</b> A-D-E або Am-Dm-Em — бій на вибір."}},l95:{en:{t:"Learning the 12-bar blues",x:"The form: 4 bars I7, 2 bars IV7, 2 bars I7, V7-IV7-I7-I7. Count the bars out loud — the form “falls into the hands” after 3–4 cycles.<br><b>Do:</b> the «Blues» style + «▶ Backing» + minor pentatonic on top.",app:{text:"The Blues — in «✨ Make it pretty».",sect:"base",btn:"🎵 To song"}},uk:{t:"12-тактовий блюз розучуємо",x:"Форма: 4 такти I7, 2 такти IV7, 2 такти I7, V7-IV7-I7-I7. Рахуй такти уголос — форма «провалюється» в руки після 3–4 кругів.<br><b>Зроби:</b> стиль «Блюз» + «▶ Фон» + мінорна пентатоніка зверху.",app:{text:"Блюз — у «✨ Зроби гарно».",sect:"base",btn:"🎵 До пісні"}}},l96:{en:{t:"Break down a song from Make-it-pretty",x:"Pick a style, generate a song, turn on the backing and break it down: which degrees, where the tonic, what strum fits. A ready-made study task.<br><b>Do:</b> any style → «▶ Backing» → play the chord tones.",app:{text:"The generator — on the «🎵 Song» tab.",tool:"song",btn:"🎵 Song"}},uk:{t:"Розібрати пісню з «Зроби гарно»",x:"Вибери стиль, згенеруй пісню, увімкни фон і розбирай: які ступені, де тоніка, який бій підходить. Готове навчальне завдання.<br><b>Зроби:</b> будь-який стиль → «▶ Фон» → грай тони акордів.",app:{text:"Генератор — у вкладці «🎵 Пісня».",tool:"song",btn:"🎵 Пісня"}}},l97:{en:{t:"Build your own song",x:"Your song: 4 chords, a strum, verse-chorus structure. In the song builder chords stack by clicks, and you can play with the backing right away.<br><b>Do:</b> build your own sequence and save it (it stays in the app).",app:{text:"The builder — the «🎵 Song» tab.",tool:"song",btn:"🎵 Song"}},uk:{t:"Зібери свою пісню",x:"Своя пісня: 4 акорди, бій, структура куплет-приспів. У конструкторі пісень акорди складаються кліками, грати можна одразу з фоном.<br><b>Зроби:</b> зібери свою послідовність і збережи (вона залишається в програмі).",app:{text:"Конструктор — вкладка «🎵 Пісня».",tool:"song",btn:"🎵 Пісня"}}},l98:{en:{t:"Record a phrase in the phrase editor",x:"Got a motif — record it: on the fretboard click notes in the right «Phrase» panel, set durations and rests, play with tempo. That’s how a personal library of licks grows.<br><b>Do:</b> record an 8-note phrase over your song.",app:{text:"The phrase editor — on the Fretboard tab, the «Phrase» panel.",tool:"fret",btn:"🎼 Fretboard"}},uk:{t:"Запиши фразу в редакторі фраз",x:"Придумав мотив — запиши: на грифі клікай ноти в правому боксі «Фраза», став тривалості і паузи, грай із темпом. Так копиться особиста бібліотека ліків.<br><b>Зроби:</b> запиши фразу з 8 нот поверх своєї пісні.",app:{text:"Редактор фраз — на вкладці «Гриф», бокс «Фраза».",tool:"fret",btn:"🎼 Гриф"}}},l99:{en:{t:"Playing from memory",x:"Remove the hints: play the song looking only at your hands (or close your eyes). Muscle memory is stronger than sight if you play slowly and the same way.<br><b>Do:</b> your song from «Song» — 3 cycles without peeking at the chips."},uk:{t:"Гра по пам’яті",x:"Прибери підказки: грай пісню, дивлячись тільки на руки (або заплющи очі). Пам’ять рук міцніша за зір, якщо грати повільно й однаково.<br><b>Зроби:</b> своя пісня з «Пісні» — 3 круги без підглядання в чіпи."}},l100:{en:{t:"Mini-gig: 3 songs in a row",x:"The course finale: build a 3-song set, tune up before going out, play without stops — the pauses between songs short and calm. This is a real performance already.<br><b>Do:</b> play the whole set for a friend or a camera."},uk:{t:"Міні-концерт: 3 пісні підряд",x:"Фінал курсу: зібери сет із 3 пісень, налаштуйся перед виходом, грай без зупинок — паузи між піснями короткі й спокійні. Це вже справжній виступ.<br><b>Зроби:</b> зіграй сет цілком для друга або камери."}},s01:{en:{t:"Blues: the grandfather of all styles",x:"Mississippi Delta, 1920s–30s: work songs under the fingers. The 12-bar I7–IV7–V7 form and the “evil” ♭5 in the pentatonic — rock, jazz and metal all grew from this grandfather.<br><b>Do:</b> build the «Blues» style ✨ and turn on the ▶ Backing.",app:{text:"Build «Blues» ✨ and turn on the ▶ Backing — improvise the minor pentatonic.",tool:"song",btn:"🎵 Song"}},uk:{t:"Блюз: дідусь усіх стилів",x:"Дельта Міссісіпі, 20–30-ті: робочі пісні під пальці. 12-тактова форма I7–IV7–V7 і «зла» ♭5 у пентатоніці — від цього дідуся виросли рок, джаз і метала.<br><b>Зроби:</b> зібери стиль «Блюз» ✨ і увімкни ▶ Фон.",app:{text:"Зібери «Блюз» ✨ і увімкни ▶ Фон — імпровізуй мінорною пентатонікою.",tool:"song",btn:"🎵 Пісня"}}},s02:{en:{t:"Pop: the power of four chords",x:"I–V–vi–IV — four chords holding decades of hits (a 2000s loop built on them as a joke — and it sounded like a hit). The point: the familiar path “home—away—sadness—return”.<br><b>Do:</b> build «Pop» ✨ and play over the major pentatonic.",app:{text:"Build «Pop» ✨ and turn on the ▶ Backing.",tool:"song",btn:"🎵 Song"}},uk:{t:"Поп: сила чотирьох акордів",x:"I–V–vi–IV — чотири акорди, на яких тримаються десятиліття хітів (луп 2000-х на їх звуках збирався в жарт — і звучав як хіт). Суть: знайомий шлях «дім—відхід—смуток—повернення».<br><b>Зроби:</b> зібери «Поп» ✨ і грай поверх мажорної пентатоніки.",app:{text:"Зібери «Поп» ✨ і увімкни ▶ Фон.",tool:"song",btn:"🎵 Пісня"}}},s03:{en:{t:"Punk: three chords and the truth",x:"Mid-70s: speed and honesty instead of virtuosity. I–IV–V on power chords, 150–190 bpm, two fingers — and the song is ready. Energy matters more than notes.<br><b>Do:</b> build «Punk» ✨ and keep the eighths down.",app:{text:"Build «Punk» ✨ and turn on the ▶ Backing.",tool:"song",btn:"🎵 Song"}},uk:{t:"Панк: три акорди і правда",x:"Середина 70-х: швидкість і чесність замість віртуозності. I–IV–V на пауер-акордах, 150–190 уд/хв, два пальці — і пісня готова. Енергія важливіша за ноти.<br><b>Зроби:</b> зібери «Панк» ✨ і тримай восьмі вниз.",app:{text:"Зібери «Панк» ✨ і увімкни ▶ Фон.",tool:"song",btn:"🎵 Пісня"}}},s04:{en:{t:"Metal: dark phrygian and Drop D",x:"Metal took the phrygian mode (the low II — “evil”) and power chords i–♭II. Drop D (⚙️) — a low riff on one open string: the Sabbath-rooted classic.<br><b>Do:</b> build «Metal» ✨, set Drop D and strike down.",app:{text:"Build «Metal» ✨ and turn on the ▶ Backing.",tool:"song",btn:"🎵 Song"}},uk:{t:"Метал: темний фригійський і Drop D",x:"Метал узяв фригійський лад (низька II — «зла») і пауер-акорди i–♭II. Drop D (⚙️) — низький рифф однією відкритою струною: класика Sabbath-коренів.<br><b>Зроби:</b> зібери «Метал» ✨, постав Drop D і бий вниз.",app:{text:"Зібери «Метал» ✨ і увімкни ▶ Фон.",tool:"song",btn:"🎵 Пісня"}}},s05:{en:{t:"Hardcore: punk at maximum",x:"Late 70s, Washington: punk sped up and got angry. 150–190 bpm, minute-long songs, the short i–i–♭VI–♭VII form. Always down, always palm-muted.<br><b>Do:</b> build «Hardcore» ✨ — a 4-bar form, laps over laps.",app:{text:"Build «Hardcore» ✨ and turn on the ▶ Backing.",tool:"song",btn:"🎵 Song"}},uk:{t:"Хардкор: панк на максимумі",x:"Кінець 70-х, Вашингтон: панк прискорився і озлився. 150–190 уд/хв, пісні по хвилині, коротка форма i–i–♭VI–♭VII. Завжди вниз, завжди палм-м’ют.<br><b>Зроби:</b> зібери «Хардкор» ✨ — форма на 4 такти, круги по кругу.",app:{text:"Зібери «Хардкор» ✨ і увімкни ▶ Фон.",tool:"song",btn:"🎵 Пісня"}}},s06:{en:{t:"Thrash: gallops and a low tuning",x:"Bay Area, 80s: metal took speed from punk, riffs became gallops, tunings went lower (Drop C♯). A fast I–IV–V motor + dark degrees.<br><b>Do:</b> build «Thrash» ✨; learn the gallop in lesson r03.",app:{text:"Build «Thrash» ✨ and turn on the ▶ Backing.",tool:"song",btn:"🎵 Song"}},uk:{t:"Треш: кантери і низький стрій",x:"Bay Area, 80-і: метал узяв швидкість у панків, риффи — кантерами, стрій — нижче (Drop C♯). Швидкий I–IV–V-мотор + темні ступені.<br><b>Зроби:</b> зібери «Трэш» ✨; кантер вивчи в уроці r03.",app:{text:"Зібери «Трэш» ✨ і увімкни ▶ Фон.",tool:"song",btn:"🎵 Пісня"}}},s07:{en:{t:"Doom/Sludge: slow = heavy",x:"Sabbath roots slowed to 50–80: a chord hangs for two bars, and the silence between hits is part of the riff. Sludge = doom with dirt. Drop C/B (⚙️) — the genre standard.<br><b>Do:</b> build «Doom/Sludge» ✨ — it’s already «2 bars per chord».",app:{text:"Build «Doom/Sludge» ✨ and turn on the ▶ Backing.",tool:"song",btn:"🎵 Song"}},uk:{t:"Дум/Сладж: повільно = важко",x:"Саббат-коріння, уповільнене до 50–80: акорд висить два такти, і тиша між ударами — частина рифа. Сладж = дум із брудом. Drop C/B (⚙️) — стандарт жанру.<br><b>Зроби:</b> зібери «Дум/Сладж» ✨ — там уже «2 такти на акорд».",app:{text:"Зібери «Дум/Сладж» ✨ і увімкни ▶ Фон.",tool:"song",btn:"🎵 Пісня"}}},s08:{en:{t:"Flamenco: the fire of phrygian dominant",x:"Andalusia: the courios cycle i–♭VII–♭VI–V — a “falling” back-and-forth on the phrygian dominant. Juan Martín calls this move the heart of flamenco; the compás — the rhythmic circle — matters more than notes.<br><b>Do:</b> set the «Phrygian dominant» with the chips, build «Flamenco» ✨.",fret:[0,"phrygDom"],app:{text:"The mode on the fretboard and the song — build «Flamenco» ✨ and turn on the ▶ Backing.",tool:"song",btn:"🎵 Song"}},uk:{t:"Фламенко: вогонь фригійського домінанта",x:"Андалузія: сокро-цикл i–♭VII–♭VI–V — «падіння» туди-сюди на фригійському домінанті. Juan Martín називає цей хід серцем фламенко; компас — ритмічне коло — важливіший за ноти.<br><b>Зроби:</b> постав чіпом «Фригійський домінант», зібери «Фламенко» ✨.",fret:[0,"phrygDom"],app:{text:"Лад на грифі і пісня — зібери «Фламенко» ✨ і увімкни ▶ Фон.",tool:"song",btn:"🎵 Пісня"}}},s09:{en:{t:"Swing/Manouche: Django and swing",x:"Gypsy jazz of the 30s: Django Reinhardt played swing on one chord position. A minor vamp i–v with heavy swing (70%) — sway with your body and arpeggiate the chords.<br><b>Do:</b> build «Swing/Manouche» ✨ and play along the arpeggio chips.",app:{text:"Build «Swing/Manouche» ✨ and turn on the ▶ Backing.",tool:"song",btn:"🎵 Song"}},uk:{t:"Свінг/Мануш: Джанго і гойдалка",x:"Циганський джаз 30-х: Джанго Рейнхардт грав свінг на одній акордовій позиції. Мінорний вамп i–v із сильним качанням (70%) — хитайся корпусом і арпеджуй акорди.<br><b>Зроби:</b> зібери «Свінг/Мануш» ✨ і грай по арпедджіо чіпів.",app:{text:"Зібери «Свінг/Мануш» ✨ і увімкни ▶ Фон.",tool:"song",btn:"🎵 Пісня"}}},s10:{en:{t:"Reggae: the skank offbeat",x:"Jamaica, 60s: the hit lands NOT on the beat but between — a muted “skank”. A slow 70–90 tempo and an i–i vamp. Everything holds on what you DON’T play.<br><b>Do:</b> build «Reggae» ✨ — the offbeat slips into the backing by itself.",app:{text:"Build «Reggae» ✨ and turn on the ▶ Backing — listen to the offbeat.",tool:"song",btn:"🎵 Song"}},uk:{t:"Реггі: офбіт скенк",x:"Ямайка, 60-і: удар НЕ на частку, а між — «скенк» приглушений (x). Повільний темп 70–90 і вамп i–i. Все тримається на тому, чого НЕ граєш.<br><b>Зроби:</b> зібери «Реггі» ✨ — офбіт підставиться у фон сам.",app:{text:"Зібери «Реггі» ✨ і увімкни ▶ Фон — слухай офбіт.",tool:"song",btn:"🎵 Пісня"}}},s11:{en:{t:"Lofi: dust and maj7",x:"The 2010s YouTube era: a soft 60–80 beat, maj7 colour, vinyl noise. The point is unfinishedness: a slightly late beat and “warm” triads.<br><b>Do:</b> build «Lofi» ✨ and play with 30% swing.",app:{text:"Build «Lofi» ✨ and turn on the ▶ Backing.",tool:"song",btn:"🎵 Song"}},uk:{t:"Лоуфай: пил і maj7",x:"YouTube-ера 2010-х: м’який біт 60–80, maj7-фарба, вініловий шум. Суть — незавершеність: трохи запізнілий біт і «теплі» тризвуки.<br><b>Зроби:</b> зібери «Лоуфай» ✨ і грай із гойдалкою 30%.",app:{text:"Зібери «Лоуфай» ✨ і увімкни ▶ Фон.",tool:"song",btn:"🎵 Пісня"}}},s12:{en:{t:"Acoustic blues: under the fingers",x:"Delta blues for acoustic: 12 bars on sevenths, 66% swing, the melody scattered across the strings (fingerstyle/travis). The thumb leads the bass — the melody on top.<br><b>Do:</b> build «Acoustic blues» ✨; the finger texture — later, for now hit the bass.",app:{text:"Build «Acoustic blues» ✨ and turn on the ▶ Backing.",tool:"song",btn:"🎵 Song"}},uk:{t:"Акустичний блюз: під пальці",x:"Дельта-блюз для акустики: 12 тактів на септакордах, гойдалка 66%, мелодія розсипається по струнах (фінгерстайл/тревіс). Бас веде великий палець — мелодія зверху.<br><b>Зроби:</b> зібери «Акуст. блюз» ✨; пальцева фактура — потім, поки бий по басу.",app:{text:"Зібери «Акуст. блюз» ✨ і увімкни ▶ Фон.",tool:"song",btn:"🎵 Пісня"}}},l76:{en:{t:"A warm-up before playing",x:"A 5-minute routine: spider → slides/bends → a favourite lick → a song. The hand “wakes up”, the chance of cracking at speed drops.<br><b>Do:</b> run the whole routine before your next session.",app:{text:"Warm-up clicks — in Practices.",sect:"prac",btn:"🏋 To practices"}},uk:{t:"Розігрів перед грою",x:"Рутина 5 хвилин: павучок → слайди/бенди → улюблений лік → пісня. Рука «прокидається», шанс зірватися на швидкості нижчий.<br><b>Зроби:</b> пройди рутину перед наступною сесією цілком.",app:{text:"Клацання для розігріву — в «Практиках».",sect:"prac",btn:"🏋 До практик"}}},l32:{en:{t:"The keys of your chord",x:"One chord lives in several keys — and sounds different in each (another degree, another tension).<br><b>Do:</b> pick a chord on the «🎵 Song» tab and look at the top keys with coverage.",app:{text:"Keys and coverage — on the «🎵 Song» tab.",tool:"song",btn:"🎵 Song"}},uk:{t:"Тональності твого акорда",x:"Один акорд живе в кількох тональностях — і звучить там по-різному (інша ступінь, інша напруга).<br><b>Зроби:</b> вибери акорд у вкладці «🎵 Пісня» і подивись топ тональностей із покриттям.",app:{text:"Тональності і покриття — у вкладці «🎵 Пісня».",tool:"song",btn:"🎵 Пісня"}}}};function renderSchool(e){const t=t=>e.querySelector(t);let n=store.get("ga_school",[]);Array.isArray(n)&&6===n.length||(n=[!1,!1,!1,!1,!1,!1]);let o=[];const s=[["base",T("sch.sect.base")],["prac",T("sch.sect.prac")],["modes",T("sch.sect.modes")],["theory",T("sch.sect.theory")]],a=loadUI("school");let r=s.some(e=>e[0]===a.sect)?a.sect:"base";function i(e,t){const n=findVoicings(e,t);n.length&&playVoicing(n[0])}e.innerHTML="<h2>"+T("sch.title")+'</h2><div class="row" id="sc-sect-row" style="margin-bottom:var(--gap)"></div><div id="sc-base"><div class="card"><div class="row"><div class="grow"><b>'+T("sch.lib.title")+'</b><div class="muted small">'+T("sch.lib.hint")+'</div></div><div style="text-align:right"><div id="sc-progress" style="font-weight:800; color:var(--accent); font-size:18px"></div><div class="progress"><i id="sc-progress-bar"></i></div></div></div><div class="row" id="sc-courses" style="margin-top:10px"></div><div id="sc-course-head" class="muted small" style="margin-top:8px"></div><div id="sc-list" style="margin-top:4px"></div></div></div><div id="sc-prac" style="display:none"><div class="cols"><div class="card"><h3>'+T("sch.pr.gamma")+'</h3><div id="pr-gamma-cur"></div><div class="row" style="margin-top:8px"><button class="btn small" id="pr-gamma-roll">'+T("sch.pr.roll.s")+'</button><button class="btn small primary" id="pr-gamma-open">'+T("sch.pr.open")+'</button><button class="btn small" id="pr-gamma-done">'+T("sch.pr.done")+'</button><span class="muted small" id="pr-gamma-count"></span></div></div><div class="card"><h3>'+T("sch.pr.lad")+'</h3><div id="pr-lad-cur"></div><div class="row" style="margin-top:8px"><button class="btn small" id="pr-lad-roll">'+T("sch.pr.roll.m")+'</button><button class="btn small primary" id="pr-lad-bg">'+T("sng.bg")+'</button><button class="btn small" id="pr-lad-done">'+T("sch.pr.done")+'</button><span class="muted small" id="pr-lad-count"></span></div><div class="muted small" id="pr-lad-hint" style="margin-top:6px"></div></div><div class="card"><h3>'+T("sch.pr.tech")+'</h3><div class="muted small">'+T("sch.pr.tech.hint",{f:'<b id="pr-tech-frets"></b>'})+'</div><div class="row" style="margin-top:8px"><button class="btn small primary" id="pr-tech-toggle">'+T("sch.pr.tech.on")+'</button><label class="small muted">'+T("mel.bpm")+'<b id="pr-tech-bpmv">80</b> <input type="range" id="pr-tech-bpm" min="60" max="160" value="80" style="width:100px"></label><button class="btn small" id="pr-tech-done">'+T("sch.pr.done.approach")+'</button><span class="muted small" id="pr-tech-count"></span></div></div><div class="card"><h3>'+T("sch.pr.ear")+'</h3><div class="muted small">'+T("sch.pr.ear.hint")+'</div><div class="row" style="margin-top:8px"><button class="btn small primary" id="pr-ear-play">'+T("sch.pr.ear.play")+'</button><button class="btn small" id="pr-ear-next">'+T("sch.pr.ear.next")+'</button></div><div class="row" id="pr-ear-opts" style="margin-top:8px"></div><div id="pr-ear-msg" class="small" style="margin-top:6px">&nbsp;</div><div class="muted small" id="pr-ear-score" style="margin-top:4px"></div></div><div class="card"><h3>'+T("sch.pr.ch")+'</h3><div id="pr-ch-pair"></div><div class="row" style="margin-top:8px"><button class="btn small" id="pr-ch-roll">'+T("sch.pr.roll.pair")+'</button><button class="btn small primary" id="pr-ch-toggle">'+T("sch.pr.ch.metro")+'</button><label class="small muted">'+T("mel.bpm")+'<b id="pr-ch-bpmv">70</b> <input type="range" id="pr-ch-bpm" min="50" max="120" value="70" style="width:90px"></label><button class="btn small" id="pr-ch-done">'+T("sch.pr.done.approach")+'</button><span class="muted small" id="pr-ch-count"></span></div></div></div></div><div id="sc-modes" style="display:none"></div><div id="sc-theory" style="display:none"><div class="cols"><div class="card"><h3>'+T("theory.1")+'</h3><div class="muted small" style="margin-bottom:6px">'+T("theory.1.hint")+'</div><div style="margin-bottom:6px"><b>'+T("theory.1.maj")+"</b> "+("uk"===settings.lang?["Т","Т","П","Т","Т","Т","П"]:["T","T","S","T","T","T","S"]).map(e=>'<span class="chip" style="padding:2px 9px">'+e+"</span>").join(" ")+'</div><div style="margin-bottom:8px"><b>'+T("theory.1.min")+"</b> "+("uk"===settings.lang?["Т","П","Т","Т","П","Т","Т"]:["T","S","T","T","S","T","T"]).map(e=>'<span class="chip" style="padding:2px 9px">'+e+"</span>").join(" ")+'</div><div class="muted small">'+T("theory.1.hint2")+'</div></div><div class="card"><h3>'+T("theory.q.title")+'</h3><div style="margin-bottom:6px">'+("uk"===settings.lang?"<b>Крокуємо за циферблатом не на 1 годину, а на 7 (квінта):</b> C → G → D → A → E → B → F♯ → D♭ → A♭ → E♭ → B♭ → F → C.":"<b>Step around the dial not by 1 hour but by 7 (a fifth):</b> C → G → D → A → E → B → F♯ → D♭ → A♭ → E♭ → B♭ → F → C.")+'</div><div style="margin-bottom:6px">'+("uk"===settings.lang?"<b>За годинниковою — +1 дієз</b> (G 1♯, D 2♯, A 3♯…), <b>проти — +1 бемоль</b> (F 1♭, B♭ 2♭…).":"<b>Clockwise — +1 sharp</b> (G 1♯, D 2♯, A 3♯…), <b>counter-clockwise — +1 flat</b> (F 1♭, B♭ 2♭…).")+'</div><div style="margin-bottom:6px">'+("uk"===settings.lang?"<b>Головне:</b> тональність + 2 сусіди + їхні мінорні партнери = 6 акордів для пісні.":"<b>The main thing:</b> a key + 2 neighbours + their minor partners = 6 chords for a song.")+'</div><div style="margin-bottom:6px">'+("uk"===settings.lang?"<b>Сусіди</b> відрізняються однією нотою — перехід майже непомітний. <b>V → I</b> — повернення додому: так закінчують куплет і всю пісню.":"<b>Neighbours</b> differ by one note — the move is almost invisible. <b>V → I</b> — coming home: that’s how the verse and the whole song end.")+'</div><button class="btn small primary" data-goquints>'+T("theory.q.go")+'</button></div></div><div class="card"><h3>'+T("theory.m.title")+'</h3><div class="muted small" style="margin-bottom:8px">'+T("theory.m.hint")+"</div>"+["major","minor","dorian","phrygian","lydian","mixolydian","locrian"].map(e=>'<div style="margin-bottom:6px"><b>'+scaleName(e)+':</b> <span class="muted small">'+esc(scaleDesc(e))+"</span></div>").join("")+'</div><div class="card"><h3>'+T("theory.iv.title")+'</h3><div class="muted small">'+T("theory.iv.hint")+'</div></div><div class="card"><h3>'+T("theory.gl.title")+'</h3><div class="muted small" style="margin-bottom:8px">'+T("theory.gl.hint")+"</div>"+GLOSSARY.map(e=>{const t=GLOSSARY_L10N[settings.lang]&&GLOSSARY_L10N[settings.lang][e[0]]||{t:e[0],x:e[1]};return'<details class="hint" style="margin-bottom:5px"><summary style="cursor:pointer; font-weight:700">'+esc(t.t)+'</summary><div class="muted small">'+esc(t.x)+"</div></details>"}).join("")+'</div><div class="card"><h3>'+T("theory.forms.title")+'</h3><div class="muted small" style="margin-bottom:8px">'+T("theory.forms.hint")+"</div>"+SONG_FORMS.map(e=>{const t=SONG_FORMS_L10N[settings.lang]&&SONG_FORMS_L10N[settings.lang][e[0]]||{t:e[0],x:e[2]};return'<details class="hint" style="margin-bottom:5px"><summary style="cursor:pointer; font-weight:700">'+esc(t.t)+'</summary><div class="muted small"><b style="color:var(--accent)">'+esc(e[1])+"</b><br>"+esc(t.x)+"</div></details>"}).join("")+"</div></div>";const l=["С нуля","Аккорды","Ритм и бой","Гаммы и лады","Техника","Теория","Песни и джем","Стили"],c={en:["From scratch","Chords","Rhythm & strumming","Scales & modes","Technique","Theory","Songs & jam","Styles"],uk:["З нуля","Акорди","Ритм і бій","Гами та лади","Техніка","Теорія","Пісні й джем","Стилі"]},d=e=>c[settings.lang]&&c[settings.lang][e]||l[e],u=[{id:"l01",c:0,t:"Посадка и держание гитары",x:"Сядь на край стула, спина свободная, без заваливания. Гитара изгибом корпуса лежит на правой ноге (для правши), гриф смотрит вверх под ~45°. Три точки опоры: две ноги и правое предплечье.<br><b>Сделай:</b> сядь и пройди чек-лист — ничего не должно свисать или держаться напряжённо."},{id:"l02",c:0,t:"Названия струн и настройка",x:"Струны снизу вверх: <b>E A D G B E</b>. Запоминалка от 1-й к 6-й: «Каждый Вечер Достаёт Гитару — Брат Играет». Настройся тюнером перед КАЖДОЙ игрой: расстроенная гитара учит слух неправильно.",app:{text:"Эталоны струн и тюнер — в Инструментах.",tool:"tools",btn:"🧰 Открыть"}},{id:"l03",c:0,t:"Первое касание: медиатор и пальцы",x:"Медиатор держи большим и указательным, наружу торчит кончик 3–5 мм. Удар вниз — скольжение вдоль струны, не «втык» под углом. Пальцами — щипок апойандо: защипнул и опустил на соседнюю струну.<br><b>Сделай:</b> по 8 ударов вниз на каждой открытой струне — звук ровный, без «щелчков»."},{id:"l04",c:0,t:"Как читать табы",x:"Табы — шесть линий: сверху самая тонкая струна (1-я), снизу толстая (6-я). Цифра на линии = номер лада, 0 = открытая. Читай слева направо, как текст.<br><b>Сделай:</b> сыграй на 1-й струне 0–1–3–0 — это уже мелодия."},{id:"l05",c:0,t:"Первый аккорд: Em",x:"Em (ми-минор) — всего два пальца: 2-й палец на 2-й лад 5-й струны, 3-й — на 2-й лад 4-й. Остальные струны открытые, бей все шесть.<br><b>Сделай:</b> возьми аккорд и проверь струны ПО ОДНОЙ — каждая должна звенеть чисто.",chord:[4,"min"]},{id:"l06",c:0,t:"Аккорд Am",x:"Am: 1-й палец — 1-й лад 2-й струны, 2-й — 2-й лад 4-й, 3-й — 2-й лад 3-й. Форма как у Em плюс один палец.<br><b>Сделай:</b> Em → Am → Em — найди вариант движения, где пальцы не слетают с ладов.",chord:[9,"min"]},{id:"l07",c:0,t:"Аккорд D",x:"D: три пальца в ряд на 2-м ладу — на 4-й, 3-й и 2-й струнах (пальцы 1-2-3). Бей от 4-й струны вниз — басовые не играем.<br><b>Сделай:</b> проверь звонкость каждой струны, потом медленно 4 удара.",chord:[2,"maj"]},{id:"l08",c:0,t:"Аккорды C и G",x:"C: 3-й палец — 3-й лад 5-й струны, 2-й — 2-й лад 4-й, 1-й — 1-й лад 2-й. G — выбери из двух удобных вариантов (с 2–3 пальцами или четырьмя) и придерживайся одного.<br><b>Сделай:</b> C и G по 4 удара.",chord:[0,"maj"]},{id:"l09",c:0,t:"Переходы между двумя аккордами",x:"Секрет быстрых смен — двигать пальцы ВМЕСТЕ, по кратчайшей дуге, и не отрывать общие точки. Смотри на цель, не на руку.<br><b>Сделай:</b> Em↔Am — 8 смен по 4 удара в темпе 60 без пауз."},{id:"l10",c:0,t:"Первые 4 аккорда вместе",x:"Em, Am, C, G — на них уже есть сотни песен. Круг: Em → Am → C → G → Em.<br><b>Сделай:</b> 4 удара на аккорд, темп 60–70, три круга без остановки."},{id:"l11",c:0,t:"Бой «вниз» на четвертях",x:"Считай вслух «раз-два-три-четыре» и бей вниз на каждый счёт. Медиатор возвращается вверх НАД струнами, не задевая их.<br><b>Сделай:</b> Em, 8 тактов по 4 удара — ровно и одинаково громко."},{id:"l12",c:0,t:"Восьмёрки: вниз-вверх",x:"Восьмые — два удара на счёт: «раз-И». Вниз на счёт, вверх на «И» — вверх мягче. Рука качается маятником без остановки, как метроном.<br><b>Сделай:</b> та же Em, счёт вслух, 8 тактов."},{id:"l13",c:0,t:"Песня из 2 аккордов",x:"Em и Am по 8 ударов каждый — уже песня (классика жанра — «Horse With No Name»). Меняй аккорд на ПЕРВОМ ударе такта.<br><b>Сделай:</b> четыре круга по 8 ударов."},{id:"l14",c:0,t:"Песня из 4 аккордов",x:"Am – C – G – Em по 4 удара восьмёрками — готовый куплет. Если сбоишь — замедли вдвое, чистота важнее скорости.<br><b>Сделай:</b> играй 4 круга; собери эту же прогрессию в конструкторе.",app:{text:"Собери её во вкладке «🎵 Песня».",tool:"song",btn:"🎵 Песня"}},{id:"l15",c:1,t:"Семейства A и E",x:"A, A7, Am, Am7 и E, E7, Em — «якорные» формы на 1–2 ладах: базовые пальцы + дополнения. Они дружат с соседними аккордами по общим пальцам.<br><b>Сделай:</b> A → A7 → A и E → E7 → E по 4 удара — услышишь, как меняется характер.",chord:[9,"maj"]},{id:"l16",c:1,t:"F без барре (упрощённый)",x:"«Маленький F»: xx3211 — 1-й палец плашмя прижимает 1-ю И 2-ю струны на 1-м ладу (мини-барре), остальные пальцы — 2, 3, 4. Басовую E не играем.<br><b>Сделай:</b> F → C → F — приучай палец лежать плашмя, а не на ребре.",chord:[5,"maj"]},{id:"l17",c:1,t:"Что такое барре и зачем",x:"Барре — указательный палец плашмя прижимает 5–6 струн на одном ладу. Это передвижной «порожек»: одна форма = 12 аккордов по грифу. Сначала укрепи руку маленьким F.<br><b>Сделай:</b> барре на 5-м ладу — пощипай струны по одной, все должны звенеть."},{id:"l18",c:1,t:"Барре F (полное)",x:"Полное F: барре на 1-м ладу + форма E на 2–3 ладах (133211). Тесно у порожка? Возьми на 3-м ладу — легче, звук тот же класс.<br><b>Сделай:</b> F → C → G → F по 2 удара — барре давит только в момент удара.",chord:[5,"maj"]},{id:"l19",c:1,t:"Пауэр-аккорды (5)",x:"Пауэр-аккорд — только корень и квинта: два-три пальца, работает в любой тональности, с дисторшном звучит жирно. Форма: корень на 6-й струне + квинта через струну выше.<br><b>Сделай:</b> E5 → G5 → A5 чеканкой по 4 удара.",chord:[4,"5"]},{id:"l20",c:1,t:"Барре-формы по грифу: E и A",x:"E-форма (барре + E) — корень на 6-й струне; A-форма (барре + A) — корень на 5-й. Вместе они покрывают весь гриф.<br><b>Сделай:</b> B♭ на 6-м ладу (E-форма) и B♭ на 1-м (A-форма) — это один и тот же аккорд.",chord:[10,"maj"]},{id:"l21",c:1,t:"Септаккорды: 7, m7, maj7",x:"7 (доминант) — мажор с «вопросом», тянет в тонику: блюз и рок. m7 — мягкий минор (соул). maj7 — «сказочный» джаз. Разница — одна ступень.<br><b>Сделай:</b> Cmaj7 → C → C7 → Cm7 — услышь, как меняется настроение.",chord:[0,"maj7"]},{id:"l22",c:1,t:"sus2 и sus4",x:"Sus-аккорды «подвешены»: терция заменена на секунду или кварту — напряжение висит в воздухе. Классика: D → Dsus4 → D (палец ставится и снимается).<br><b>Сделай:</b> D → Dsus4 → D → Dsus2.",chord:[2,"sus4"]},{id:"l23",c:1,t:"add9 и 6 — поп-краска",x:"add9 и 6 добавляют цвет, не меняя функцию аккорда — любимый приём поп-баллад. Cadd9 ещё и удобнее C для смен.<br><b>Сделай:</b> C → Cadd9 → C6 → C — цвет меняется, песня та же.",chord:[0,"add9"]},{id:"l24",c:1,t:"dim, aug, m7♭5 — зачем они",x:"Уменьшённые (dim) — тревожно-проходные, увеличенные (aug) — «стеклянные», m7♭5 — джазовая грусть перед доминантой. В песнях — редкие гости на 1–2 удара.<br><b>Сделай:</b> C → Ddim → G — услышь тяготение в G.",chord:[2,"dim"]},{id:"l25",c:1,t:"Большое барре на 5–7 ладах",x:"Выше по грифу лады ближе и жать легче — тренируй барре на 5–7 ладах, потом спускайся к 1-му. Это честный способ укрепить руку.<br><b>Сделай:</b> барре-мажор на 5-м ладу, сдвигай вниз по полутонам до 1-го."},{id:"l26",c:1,t:"Открытые альтернативы",x:"Cadd9, G с четырьмя пальцами, Em7 — «удобные» формы поп-музыки: смена Cadd9↔G — всего два пальца, звон остаётся.<br><b>Сделай:</b> G → Cadd9 → Em7 → D — связка половины современных песен.",chord:[0,"add9"]},{id:"l27",c:1,t:"Джазовые формы",x:"Джазовые m7/maj7/7 берутся барре-формами с корнем на 6-й или 5-й струне — те же E/A-формы, но с септимой внутри.<br><b>Сделай:</b> Dm7 → G7 → Cmaj7 — это ii–V–I, главный джазовый ход.",chord:[2,"m7"]},{id:"l28",c:1,t:"Трезвучия вверх по грифу",x:"Любой аккорд можно собрать из трёх верхних струн в разных местах грифа — так рождаются «тонкие» партии второй гитары и аранжировки.<br><b>Сделай:</b> найди трезвучие C на 3-м и на 8–10-м ладах (первые 3 струны)."},{id:"l29",c:1,t:"Цветные формы: дроп-аккорды",x:"Дроп-аккорды (drop2) — четырёхголосые формы на 4 струнах: бас «сброшен» на октаву вниз. Стандарт фанк/джаз-аккомпанемента.<br><b>Сделай:</b> возьми любой m7 и проедь его вверх по грифу, сохраняя форму."},{id:"l30",c:1,t:"Переходы с общими пальцами",x:"Смотри, какие пальцы общие у соседних аккордов, — их НЕ отрывай. Am→C (1-й палец живёт), C→G7, Em→G.<br><b>Сделай:</b> по 8 смен каждой пары — рука запоминает минимум движения."},{id:"l31",c:1,t:"Быстрые смены: тренировка пар",x:"Челлендж «60 секунд»: сколько ЧИСТЫХ смен между двумя аккордами за минуту. Схема: медленно → чисто → быстро. Отличная ежедневная практика.<br><b>Сделай:</b> три раунда на любой паре.",app:{text:"Тренажёр пар с метрономом — здесь, в Школе.",sect:"prac",btn:"🏋 К практикам"}},{id:"l32",c:1,t:"Тональности твоего аккорда",x:"Один аккорд живёт в нескольких тональностях — и звучит там по-разному (другая ступень, другое напряжение).<br><b>Сделай:</b> выбери аккорд во вкладке «🎵 Песня» и посмотри топ тональностей с покрытием.",app:{text:"Тональности и покрытие — во вкладке «🎵 Песня».",tool:"song",btn:"🎵 Песня"}},{id:"l33",c:2,t:"Счёт: раз-и-два-и",x:"Восьмая сетка считается «раз-И, два-И, три-И, четыре-И». Проговаривай вслух с ровным маятником руки — это фундамент всех боёв.<br><b>Сделай:</b> 8 тактов счёта вслух с движением руки без удара — рука уже держит ритм."},{id:"l34",c:2,t:"Четвертной бой",x:"Один удар вниз на каждый счёт, восьмые рука проходит молча. Звук ровный, как метроном.<br><b>Сделай:</b> Em, 8 тактов по 4 удара вниз."},{id:"l35",c:2,t:"Восьмёрки: D-DU",x:"На счёт — вниз, на «И» — вверх. Все удары одной громкости, маятник не останавливается.<br><b>Сделай:</b> 8 тактов D-DU на Em под счёт вслух."},{id:"l36",c:2,t:"Универсальный бой D-DU-UDU",x:"Самый ходовой бой поп-музыки: вниз, вниз-вверх, вверх-вниз-вверх. Схема на такт: Д-ДУ-УДУ. Разучи медленно по частям, потом собери.<br><b>Сделай:</b> 8 тактов на Em или Am."},{id:"l37",c:2,t:"Бой «шестёрка» (баллада)",x:"Шесть ударов на такт: Д-Д-ДУ-Д-ДУ — мягкое балладное покачивание. Хорошо звучит с перебором в куплетах.<br><b>Сделай:</b> 8 тактов на C–G–Am–F... или на любой паре аккордов."},{id:"l38",c:2,t:"Регги-скип: акцент на «И»",x:"Регги переворачивает ритм: сильные доли ПРОПУСКАются (глушатся), удары — на «И». Отсюда «прыгающий» грув.<br><b>Сделай:</b> считай «раз-и-два-и» и играй только на «И», на счёт — глушение ладонью."},{id:"l39",c:2,t:"Шаффл и свинг",x:"Шаффл — восьмые играются неровно: «длинная-короткая», как триоль с паузой. Блюзовый качающий грув.<br><b>Сделай:</b> проговори «1-и-а» и играй D-DU, ударяя на «1» и на «а».",app:{text:"Включи фон с качанием и играй поверх пентатонику — качание во вкладке «🎵 Песня».",tool:"song",btn:"🎵 Песня"}},{id:"l40",c:2,t:"Паузы и глушилка",x:"Пауза в бое — это НЕ молчание руки, а глушение: ладонь или пальцы левой кладутся на струны в момент удара. Ритм-машина продолжает качать.<br><b>Сделай:</b> бой D-DU, где первый удар каждого такта — глушёный «чок»."},{id:"l41",c:2,t:"Фингерстайл: базовые паттерны",x:"Пальцы правой: p (большой) — бас, i-m-a (указательный-средний-безымянный) — три верхние. Классика: p–i–m–a–m–i.<br><b>Сделай:</b> паттерн p-i-m-a на аккорде Em, медленно, без спешки."},{id:"l42",c:2,t:"Перебор 4-3-2-1",x:"Простой перебор: большой палец по 4-й струне (бас), дальше 3-2-1 по очереди. Держи ровность: каждая нота одинаковой длины.<br><b>Сделай:</b> Am, 4 круга перебора, бас меняется по аккорду."},{id:"l43",c:2,t:"Перебор с басом (Travis-лайт)",x:"Упрощённый Трэвис: бас чередуется между двумя нижними струнами, пальцы перебирают 3-2-1 поверх. Получается «качающийся» фон.<br><b>Сделай:</b> C: бас 5-4, пальцы 3-2-1 — медленно, по кругу."},{id:"l44",c:2,t:"Игра с метрономом",x:"Метроном — честный учитель: он не врёт про ровность. Начинай с 60 bpm, добавляй +5 только когда сыграл чисто три раза подряд.<br><b>Сделай:</b> включи метроном в «🧰 Инструментах» и пройди любимый бой 8 тактов.",app:{text:"Метроном с размерами — в Инструментах.",tool:"tools",btn:"🧰 Открыть"}},{id:"l45",c:2,t:"Игра с ▶ Фоном",x:"Фон (бэктрек) — это уже «живая» группа: аккорды по тактам, бит, бас. Играй поверх свой бой или перебор.<br><b>Сделай:</b> собери песню «✨ Сделай красиво» и включи «▶ Фон» прямо там.",app:{text:"Фон запускается из «✨ Сделай красиво» и «Лада дня».",sect:"prac",btn:"🏋 К практикам"}},{id:"l46",c:2,t:"Перкуссия корпусом",x:"Удар костяшками большого пальца по деке (X) или шлепок ладонью по струнам — перкуссия прямо на гитаре. Добавляет груву «хлопок».<br><b>Сделай:</b> бой Д-X-ДУ-Х: на X — костяшки по деке."},{id:"l47",c:3,t:"Хроматика — знакомство с грифом",x:"Хроматика — все 12 полутонов подряд. Играй 1-2-3-4 пальцами по каждой струне — рука учится ходить по грифу, ухо — слышать полутоны.<br><b>Сделай:</b> хроматика от 5-го лада, шестая струна → первая.",fret:[0,"chromatic"]},{id:"l48",c:3,t:"Мажор: боксы",x:"Мажорная гамма живёт в «боксах» — окнах из 4 ладов в одной позиции. Возьми до-мажор в открытой позиции и в 7-й — это одна и та же гамма.<br><b>Сделай:</b> до-мажор на грифе, сыграй вверх-вниз в двух позициях.",fret:[0,"major"]},{id:"l49",c:3,t:"Минорная пентатоника: бокс 1",x:"Пентатоника — 5 нот без «сложных» ступеней: на ней НЕЛЬЗЯ ошибиться, если играть по подсветке. Бокс 1 — самый ходовой на грифе.<br><b>Сделай:</b> ля-минорная пентатоника, бокс 1, сыграй вверх-вниз.",fret:[9,"pentaMin"]},{id:"l50",c:3,t:"Пентатоника: боксы 2–5",x:"Тот же набор нот — следующие окна по грифу. Бокс 2 начинается с 3-го лада после бокса 1, и так далее по цепочке.<br><b>Сделай:</b> переключи «Позицию» на грифе и пройди боксы 2–5 ля-минорной пентатоники.",fret:[9,"pentaMin"]},{id:"l51",c:3,t:"Связка боксов",x:"Играют не боксы, а ГРИФ: из конца бокса 1 шагай в начало бокса 2 без паузы. Стыки — самая ценная часть.<br><b>Сделай:</b> играй бокс 1 вверх, бокс 2 вверх, бокс 1 вниз — непрерывный маршрут."},{id:"l52",c:3,t:"Блюзовая гамма (+бенд на ♭5)",x:"Блюзовая = минорная пентатоника + ♭5 — «дьявольская» нота, которую тянут бендом. Она и делает грув блюзовым.<br><b>Сделай:</b> ми-блюзовая, найди ♭5 и подтяни её бендом на тон.",fret:[0,"blues"]},{id:"l53",c:3,t:"Натуральный минор",x:"Минор — тот же мажор, но с другим характером (иначе расставлены тоны/полутоны). Ля-минор = ноты до-мажора с центром в A.<br><b>Сделай:</b> ля-минор на грифе, сыграй вверх-вниз и сравни с пентатоникой.",fret:[9,"minor"]},{id:"l54",c:3,t:"Гармонический и мелодический минор",x:"Гармонический минор — минор с высокой VII (восточный вкус, «испанка»). Мелодический — подняты VI и VII вверх. Оба — для драматических мелодий.<br><b>Сделай:</b> ля-гармонический на грифе — найди «зияющий» шаг между VI и VII.",fret:[9,"harmonic"]},{id:"l55",c:3,t:"Дорийский лад",x:"Дорийский = минор со «светлой» VI — модный модальный вайб (фанк, рок). Ре-дорийский = все белые клавиши от D.<br><b>Сделай:</b> ре-дорийский на грифе, сыграй с дроном или фоном ре.",fret:[2,"dorian"]},{id:"l56",c:3,t:"Фригийский и локрийский",x:"Фригийский — минор с низкой II: «испанский» оттенок. Локрийский — самый «тёмный» лад с низкой V. Оба — для напряжения.<br><b>Сделай:</b> ми-фригийский на грифе, сравни с обычным ми-минором.",fret:[4,"phrygian"]},{id:"l57",c:3,t:"Лидийский и миксолидийский",x:"Лидийский — мажор с #IV (сказочность). Миксолидийский — мажор с ♭VII (рок-мажор). Оба — «мажор с сюрпризом».<br><b>Сделай:</b> соль-миксолидийский на грифе, сыграй с фоном G.",fret:[7,"mixolydian"]},{id:"l58",c:3,t:"Позиции и переезды",x:"Одна гамма — до 7 позиций по грифу. Переезд — смещение всей руки на несколько ладов без смены нот.<br><b>Сделай:</b> до-мажор в 1-й позиции и в 7-й (селект «Позиция» на грифе) — услышь разницу тембра.",fret:[0,"major"]},{id:"l59",c:3,t:"«Гамма дня» — ежедневная практика",x:"Лучший способ знать гриф — каждый день новая случайная гамма. Две минуты в день дают больше, чем два часа раз в месяц.<br><b>Сделай:</b> открой «🏋 Практики → 🎲 Гамма дня» и пройди сегодня.",app:{text:"Практика «Гамма дня» — в Школе.",sect:"prac",btn:"🏋 К практикам"}},{id:"l60",c:3,t:"Импровизация: фразы, повторы, дыхание",x:"Импровизация — не поток нот, а ФРАЗЫ, как речь: сказал — пауза. Повтор мотивов делает мелодию узнаваемой. Дыши на концах фраз.<br><b>Сделай:</b> 🎲 Фраза на грифе — проиграй её и повтори своими руками."},{id:"l61",c:3,t:"Импровизация под ▶ Фон",x:"Фон задаёт аккорды и ритм — твоя пентатоника всегда к месту. Играй просто: 2–3 ноты, ритм важнее количества.<br><b>Сделай:</b> включи «▶ Фон» в «Ладе дня» и импровизируй 8 тактов только на нотах гаммы.",app:{text:"Фон — в «🏋 Практики → Лад дня».",sect:"prac",btn:"🏋 К практикам"}},{id:"l62",c:3,t:"Таргет-ноты: попадай в аккорд",x:"Профессиональный секрет: на СИЛЬНЫЕ доли играй тоны текущего аккорда, на слабые — проходные. Мелодия сразу «ложится» на гармонику.<br><b>Сделай:</b> с фоном играй так: на 1-ю долю — тон или терция аккорда такта."},{id:"l63",c:4,t:"«Паучок» 1-2-3-4",x:"Хроматика пальцами 1-2-3-4 на каждой струне — базовая разминка: ровность, сила, независимость пальцев.<br><b>Сделай:</b> подход под щелчки в «🏋 Практики → Техника».",app:{text:"Щелчки с темпом — в «Практиках».",sect:"prac",btn:"🏋 К практикам"}},{id:"l64",c:4,t:"Альтернативный медиатор",x:"Всегда чередуй: вниз-вверх-вниз-вверх, даже на одном звуке. Это удваивает скорость почти бесплатно.<br><b>Сделай:</b> хроматика медиатором строго D-U-D-U — медленно, следи за рукой."},{id:"l65",c:4,t:"Хаммер-он и пулл-офф",x:"Хаммер-он: нота берётся ПАЛЬЦЕМ левой ударом по грифу (без правой руки). Пулл-офф: палец срывает струну, снимаясь. Вместе — легато, «текущие» ноты.<br><b>Сделай:</b> на 3-й струне: 5 → хаммер 7 → пулл 5."},{id:"l66",c:4,t:"Слайды",x:"Слайд — движение вдоль струны с прижатой нотой: звук «переезжает» между нотами. Берём ноту ЧИСТО, потом едем.<br><b>Сделай:</b> на 2-й струне 5 → слайд → 8 → слайд обратно."},{id:"l67",c:4,t:"Бенды",x:"Бенд — подтягивание струны пальцами до соседней ноты (полутон или тон). Кислота и экспрессия блюза. Тяни запястьем и локтем, не пальцами.<br><b>Сделай:</b> на 3-й струне 7-й лад — бенд на тон, сравни с реальной нотой на 9-м."},{id:"l68",c:4,t:"Вибрато",x:"Вибрато — живое покачивание ноты (смена высоты или громкости). Ритмичное, медленное в начале ноты, ускоряется к концу.<br><b>Сделай:</b> длинная нота на 2-й струне 10-го лада — подведи вибрато за 2 секунды."},{id:"l69",c:4,t:"Легато-лики в пентатонике",x:"Лик — короткая красивая фраза. В пентатонике делается хаммерами/пуллами: 2–3 ноты на один удар правой.<br><b>Сделай:</b> классический лик в ля-минорной пентатонике: 8-5-7-5 хаммерами на 1-й струне.",fret:[9,"pentaMin"]},{id:"l70",c:4,t:"Арпеджио по аккорду",x:"Арпеджио — ноты аккорда по одной: мелодия и гармония одновременно. Играй ноты аккорда снизу вверх и обратно.<br><b>Сделай:</b> арпеджио Cmaj на грифе — тоны аккорда подряд.",play:[0,"maj"]},{id:"l71",c:4,t:"Свипы (введение)",x:"Свип — медиатор «подметает» струны одним движением, левая глушит между нотами. Эффектно, но требует ровности.<br><b>Сделай:</b> трёхнотный свип на Em (верхние струны) — медленно, метроном 50."},{id:"l72",c:4,t:"Триоли и трипл-чувство",x:"Триоль — три ноты на время двух: «та-та-та» ровно. Считай «трип-л-ет» или «ко-фе-чай». Нужна для шаффла и блюза.<br><b>Сделай:</b> хроматика триолями под счёт «1-и-а»."},{id:"l73",c:4,t:"Динамика",x:"Громкость — инструмент выразительности: куплет тише, припев громче, кульминация — самая сильная атака. Играй осознанно тихо — это сложнее.<br><b>Сделай:</b> тот же бой в трёх громкостях: тихо-средне-громко."},{id:"l74",c:4,t:"Палм-мьют",x:"Палм-мьют — ребро ладони правой касается струн у бриджа: рокочущий приглушённый звук. Основа риффов панк/метал.<br><b>Сделай:</b> пауэр-аккорд E5 с палм-мьютом восьмыми — сравни с открытым."},{id:"l75",c:4,t:"Натуральные флажолеты",x:"Флажолет — касание струны НАД ладом (не прижимая) и удар: чистый «свистящий» тон. Магические точки: 12, 7 и 5 лады.<br><b>Сделай:</b> флажолеты над 12-м ладом на всех струнах."},{id:"l76",c:4,t:"Разогрев перед игрой",x:"Рутина 5 минут: паучок → слайды/бенды → любимый лик → песня. Рука «просыпается», шанс сорваться на скорости ниже.<br><b>Сделай:</b> пройди рутину перед следующей сессией целиком.",app:{text:"Щелчки для разогрева — в «Практиках».",sect:"prac",btn:"🏋 К практикам"}},{id:"l77",c:5,t:"Полутоны и тоны",x:"Полутон — 1 лад на грифе (самый маленький шаг), тон — 2 лада. На пианино: соседние клавиши — полутон, через одну — тон.<br><b>Сделай:</b> сыграй хроматику от E по 6-й струне — все 12 полутонов."},{id:"l78",c:5,t:"Строение мажора",x:"Мажор — формула Т-Т-П-Т-Т-Т-П (тон-тон-полутон-тон-тон-тон-полутон). От C: C-D-E-F-G-A-B-C. Меняем корень — формула та же.<br><b>Сделай:</b> построй G-мажор на 6-й струне по формуле.",fret:[0,"major"]},{id:"l79",c:5,t:"Строение минора",x:"Натуральный минор — Т-П-Т-Т-П-Т-Т. От A: A-B-C-D-E-F-G-A. Характер «грустный» из-за низкой III ступени.<br><b>Сделай:</b> построй ми-минор по формуле от E.",fret:[4,"minor"]},{id:"l80",c:5,t:"Интервалы",x:"Интервал — расстояние между нотами: прима (0), секунда (2), терция (4), кварта (5), квинта (7), секста (9), септима (11), октава (12) — в полутонах. Аккорды — стопки интервалов.<br><b>Сделай:</b> пощёлкай интерактив в разделе «🧭 Лады» — интервал от всех 12 нот.",app:{text:"Интерактив — в разделе «🧭 Лады».",sect:"modes",btn:"🧭 К ладам"}},{id:"l81",c:5,t:"Квинтовый круг",x:"Шаг по кругу = квинта (7 полутонов). По часовой — +1 диез, против — +1 бемоль. Соседи отличаются одной нотой. Тональность + 2 соседа + минорные напарники = 6 аккордов для песни. V → I — возвращение домой.<br><b>Сделай:</b> покрути интерактивный круг.",app:{text:"Интерактивный круг — вкладка «🎡 Круги».",tool:"circles",btn:"🎡 Круги"}},{id:"l82",c:5,t:"Тональности и знаки",x:"Каждая мажорная тональность имеет свой набор диезов/бемолей: G — 1♯, D — 2♯, A — 3♯… F — 1♭, B♭ — 2♭… Знаки идут по квинтовому кругу.<br><b>Сделай:</b> на вкладке «⏰ Круг» посмотри знак выбранной тональности (цифры по ободу)."},{id:"l83",c:5,t:"Диатонические аккорды лада",x:"На каждой ступени гаммы строится трезвучие: в мажоре — I ii iii IV V vi vii°. Это «палитра» тональности — аккорды, которые звучат вместе без случайностей.<br><b>Сделай:</b> во вкладке «🎵 Песня» посмотри палитру «Из тональности»."},{id:"l84",c:5,t:"Ступени: I, IV, V, vi",x:"I — дом, точка покоя. IV — уход «в сторону». V — главное напряжение, тянет в I. vi — «грустная ложная тоника». Остальные ступени — проходные.<br><b>Сделай:</b> сыграй I → IV → V → I — классический каденс."},{id:"l85",c:5,t:"Прогрессии I-IV-V и I-V-vi-IV",x:"I-IV-V — фундамент рок-н-ролла и кантри. I-V-vi-IV («поп-хит») — формула сотен хитов: эмоция в одном круге.<br><b>Сделай:</b> собери «поп-хит» в «✨ Сделай красиво» (стиль Поп) и послушай с фоном.",app:{text:"Пресет «Поп» — в «✨ Сделай красиво».",sect:"base",btn:"🎵 К песне"}},{id:"l86",c:5,t:"12-тактовый блюз",x:"Форма блюза: I7×4, IV7×2, I7×2, V7–IV7–I7–I7 — 12 тактов по кругу. Поверх — минорная пентатоника от тоники.<br><b>Сделай:</b> стиль «Блюз» в «✨ Сделай красиво» + «▶ Фон».",app:{text:"Стиль «Блюз» — в «✨ Сделай красиво».",sect:"base",btn:"🎵 К песне"}},{id:"l87",c:5,t:"Пентатоника от лада",x:"Какой пентатоникой импровизировать: от мажорных ладов — мажорная пентатоника тоники, от минорных — минорная. Это уже встроено в подсказки «Лада дня».<br><b>Сделай:</b> «Лад дня» — смотри строку «импровизируй: …».",app:{text:"Подсказка — в «Ладе дня».",sect:"prac",btn:"🏋 К практикам"}},{id:"l88",c:5,t:"Относительные мажор и минор",x:"Минорная тональность с теми же нотами, что мажор, живёт на VI ступени ниже (C-мажор ↔ ля-минор). Центр сместился — характер сместился.<br><b>Сделай:</b> на грифе сыграй до-мажор и ля-минор — ноты те же, тоника разная."},{id:"l89",c:5,t:"Транспонирование ±полутон",x:"Сдвинуть песню на полутон = сдвинуть ВСЕ аккорды на полутон (или передвинуть формы барре). Так песню подстраивают под голос.<br><b>Сделай:</b> возьми I-V-vi-IV от C и сыграй то же от C♯ — все аккорды на полтона выше.",app:{text:"Живые кнопки транспонирования — во вкладке «🎵 Песня» (♭ −1 / ♯ +1 в ряду «Твоя песня»).",tool:"song",btn:"🎵 Песня"}},{id:"l90",c:5,t:"Как определить тональность песни",x:"Признаки: первый/последний аккорд часто тоника; смотри, в чью палитру ложится больше аккордов. Программа сама подсказывает: «Похоже, тональность…».<br><b>Сделай:</b> собери аккорды в «🎵 Песня» и читай строку подсказки.",app:{text:"Подсказка — во вкладке «🎵 Песня».",tool:"song",btn:"🎵 Песня"}},{id:"l91",c:5,t:"Каподастр",x:"Каподастр на N-м ладу = все открытые аккорды звучат на N полутонов выше. Играй «удобные» формы — меняй тональность одним зажимом.<br><b>Сделай:</b> каподастр на 2-м ладу + формы G-C-Em-D = звучит A-D-F#m-E."},{id:"l92",c:5,t:"Строи: дропы и открытые",x:"Drop D (6-я струна в D) — риффы на двух нижних струнах одним пальцем. Open G — слайд-блюз и китары Кита Ричардса. Строй меняет саму логику грифа.<br><b>Сделай:</b> включи Drop D в Настройках и сравни.",app:{text:"Строи — в ⚙️ Настройках.",tool:"settings",btn:"⚙️ Настройки"}},{id:"l93",c:6,t:"Разбор песни из 2 аккордов",x:"Возьми любой двухаккордный хит (8 ударов на аккорд). Схема разбора: послушай оригинал → найди тоника/напарник → бой → слова поверх.<br><b>Сделай:</b> Em–Am, 8 кругов с боем восьмёрками."},{id:"l94",c:6,t:"Разбор песни из 3 аккордов",x:"Три аккорда = I-IV-V (или i-VI-VII). Схема: тоника-куплет → IV в припеве → V перед возвратом. 90% дворовых песен живут здесь.<br><b>Сделай:</b> A-D-E или Am-Dm-Em — бой на выбор."},{id:"l95",c:6,t:"12-тактовый блюз разучиваем",x:"Форма: 4 такта I7, 2 такта IV7, 2 такта I7, V7-IV7-I7-I7. Считай такты вслух — форма «проваливается» в руки после 3–4 кругов.<br><b>Сделай:</b> стиль «Блюз» + «▶ Фон» + минорная пентатоника сверху.",app:{text:"Блюз — в «✨ Сделай красиво».",sect:"base",btn:"🎵 К песне"}},{id:"l96",c:6,t:"Разобрать песню из «Сделай красиво»",x:"Выбери стиль, сгенерируй песню, включи фон и разбирай: какие ступени, где тоника, какой бой подходит. Готовая учебная задача.<br><b>Сделай:</b> любой стиль → «▶ Фон» → играй тоны аккордов.",app:{text:"Генератор — во вкладке «🎵 Песня».",tool:"song",btn:"🎵 Песня"}},{id:"l97",c:6,t:"Собери свою песню",x:"Своя песня: 4 аккорда, бой, структура куплет-припев. В конструкторе песен аккорды складываются кликами, играть можно сразу с фоном.<br><b>Сделай:</b> собери свою последовательность и сохрани (она остаётся в программе).",app:{text:"Конструктор — вкладка «🎵 Песня».",tool:"song",btn:"🎵 Песня"}},{id:"l98",c:6,t:"Запиши фразу в редакторе фраз",x:"Придумал мотив — запиши: на грифе кликай ноты в правом боксе «Фраза», ставь длительности и паузы, играй с темпом. Так копится личная библиотека ликов.<br><b>Сделай:</b> запиши фразу из 8 нот поверх своей песни.",app:{text:"Редактор фраз — на вкладке «Гриф», бокс «Фраза».",tool:"fret",btn:"🎼 Гриф"}},{id:"l99",c:6,t:"Игра по памяти",x:"Убери подсказки: играй песню, глядя только на руки (или закрой глаза). Память рук крепче зрения, если играть медленно и одинаково.<br><b>Сделай:</b> своя песня из «Песни» — 3 круга без подглядывания в чипы."},{id:"l100",c:6,t:"Мини-концерт: 3 песни подряд",x:"Финал курса: собери сет из 3 песен, настройся перед выходом, играй без остановок — паузы между песнями короткие и спокойные. Это уже настоящее выступление.<br><b>Сделай:</b> сыграй сет целиком для друга или камеры."},{id:"r01",c:2,t:"Пауэр-аккорды: два пальца — вся песня",x:"Пауэр-аккорд = корень + квинта на соседних струнах (барре «палец плашмя» на два лада). Он работает в ЛЮБОМ ладу — не ошибёшься. Формы E/A/D двигаются по грифу: один палец — один аккорд. Со строем Drop D корень на 6-й открытой — рифф вообще без левой руки. Кантри-роковая раскачка — пресет «Бумчак».<br><b>Сделай:</b> проведи форму E от 1-го лада к 8-му, держи ровно восьмёрками.",chord:[6,"5"]},{id:"r02",c:2,t:"Палм-мьют: «чанк»",x:"Прижми ребро ладони к струнам у бриджа — удар получается глухим и плотным (чанк). Основа хардкора, метала и регги-скэнка. Глушить и отпускать надо В РИТМ: прижал-ударил-отпустил. Глушёные «x» есть в пресетах «Бумчак» и «Фингерстайл».<br><b>Сделай:</b> восемь ударов: 4 глухих «чанк» + 4 открытых — чередуй под метроном.",app:{text:"Метроном — в Инструментах.",tool:"tools",btn:"🧰 К метроному"}},{id:"r03",c:2,t:"Гальоп: да-да-ДА",x:"Гальоп метала — восьмая + две шестнадцатых + восьмая: проговаривается «да-да-ДА». Считается на шестнадцатой сетке — без медленного разбора не берётся. Для тренировки счёта долей — пресеты «Вальс 3/4 (D-U-U)» и «Фингерстайл T-1-2-3» в метрономе.<br><b>Сделай:</b> включи метроном с делением «шестнадцатые» и 80 bpm, проговори ритм перед ударом.",app:{text:"Метроном с делением — в Инструментах.",tool:"tools",btn:"🧰 К метроному"}},{id:"s01",c:7,t:"Блюз: дедушка всех стилей",x:"Дельта Миссисипи, 20–30-е: рабочие песни под пальцы. 12-тактовая форма I7–IV7–V7 и «злая» ♭5 в пентатонике — от этого дедушки выросли рок, джаз и метала.<br><b>Сделай:</b> собери стиль «Блюз» ✨ и включи ▶ Фон.",app:{text:"Собери «Блюз» ✨ и включи ▶ Фон — импровизируй минорной пентатоникой.",tool:"song",btn:"🎵 Песня"}},{id:"s02",c:7,t:"Поп: сила четырёх аккордов",x:"I–V–vi–IV — четыре аккорда, на которых держатся десятилетия хитов (луп с 2000-х на их звуках собирался в шутку — и звучал как хит). Суть: знакомый путь «дом—уход—печаль—возврат».<br><b>Сделай:</b> собери «Поп» ✨ и играй поверх мажорной пентатоники.",app:{text:"Собери «Поп» ✨ и включи ▶ Фон.",tool:"song",btn:"🎵 Песня"}},{id:"s03",c:7,t:"Панк: три аккорда и правда",x:"Середина 70-х: скорость и честность вместо виртуозности. I–IV–V на пауэр-аккордах, 150–190 уд/мин, два пальца — и песня готова. Энергия важнее нот.<br><b>Сделай:</b> собери «Панк» ✨ и держи восьмёрки вниз.",app:{text:"Собери «Панк» ✨ и включи ▶ Фон.",tool:"song",btn:"🎵 Песня"}},{id:"s04",c:7,t:"Метал: тёмный фригийский и Drop D",x:"Метал взял фригийский лад (низкая II — «злая») и пауэр-аккорды i–♭II. Drop D (⚙️) — низкий рифф одной открытой струной: классика Sabbath-корней.<br><b>Сделай:</b> собери «Метал» ✨, поставь Drop D и бей вниз.",app:{text:"Собери «Метал» ✨ и включи ▶ Фон.",tool:"song",btn:"🎵 Песня"}},{id:"s05",c:7,t:"Хардкор: панк на максимуме",x:"Конец 70-х, Вашингтон: панк ускорился и озлился. 150–190 уд/мин, песни по минуте, короткая форма i–i–♭VI–♭VII. Всегда вниз, всегда палм-мьют.<br><b>Сделай:</b> собери «Хардкор» ✨ — форма на 4 такта, круги по кругу.",app:{text:"Собери «Хардкор» ✨ и включи ▶ Фон.",tool:"song",btn:"🎵 Песня"}},{id:"s06",c:7,t:"Трэш: гальопы и низкий строй",x:"Bay Area, 80-е: метал взял скорость у панков, риффы — галопами, строй — ниже (Drop C♯). Быстрый I–IV–V-мотор + тёмные ступени.<br><b>Сделай:</b> собери «Трэш» ✨; гальоп выучь в уроке r03.",app:{text:"Собери «Трэш» ✨ и включи ▶ Фон.",tool:"song",btn:"🎵 Песня"}},{id:"s07",c:7,t:"Дум/Сладж: медленно = тяжело",x:"Саббат-корни, замедленные до 50–80: аккорд висит два такта, и тишина между ударами — часть риффа. Сладж = дум с грязью. Drop C/B (⚙️) — стандарт жанра.<br><b>Сделай:</b> собери «Дум/Сладж» ✨ — там уже «2 такта на аккорд».",app:{text:"Собери «Дум/Сладж» ✨ и включи ▶ Фон.",tool:"song",btn:"🎵 Песня"}},{id:"s08",c:7,t:"Фламенко: огонь фригийского доминанта",x:"Андалусия: сокро-цикл i–♭VII–♭VI–V — «падение» туда-обратно на фригийском доминанте. Juan Martín называет этот ход сердцем фламенко; компас — ритмический круг — важнее нот.<br><b>Сделай:</b> поставь чипом «Фригийский доминант», собери «Фламенко» ✨.",fret:[0,"phrygDom"],app:{text:"Лад на грифе и песня — собери «Фламенко» ✨ и включи ▶ Фон.",tool:"song",btn:"🎵 Песня"}},{id:"s09",c:7,t:"Свинг/Мануш: Джанго и качание",x:"Цыганский джаз 30-х: Джанго Рейнхардт играл свинг на одной аккордовой позиции. Минорный вамп i–v с сильным качанием (70%) — качайся корпусом и арпеджируй аккорды.<br><b>Сделай:</b> собери «Свинг/Мануш» ✨ и играй по арпеджио чипов.",app:{text:"Собери «Свинг/Мануш» ✨ и включи ▶ Фон.",tool:"song",btn:"🎵 Песня"}},{id:"s10",c:7,t:"Регги: офбит скэнк",x:"Ямайка, 60-е: удар НЕ на долю, а между — «скэнк» глушёным (x). Медленный темп 70–90 и вамп i–i. Всё держится на том, чего НЕ играешь.<br><b>Сделай:</b> собери «Регги» ✨ — офбит подставится в фон сам.",app:{text:"Собери «Регги» ✨ и включи ▶ Фон — слушай офбит.",tool:"song",btn:"🎵 Песня"}},{id:"s11",c:7,t:"Лоуфай: пыль и maj7",x:"YouTube-эра 2010-х: мягкий бит 60–80, maj7-краска, виниловый шум. Суть — незаконченность: чуть отстающий бит и «тёплые» трезвучия.<br><b>Сделай:</b> собери «Лоуфай» ✨ и играй с качанием 30%.",app:{text:"Собери «Лоуфай» ✨ и включи ▶ Фон.",tool:"song",btn:"🎵 Песня"}},{id:"s12",c:7,t:"Акустический блюз: под пальцы",x:"Дельта-блюз для акустики: 12 тактов на септаккордах, качание 66%, мелодия рассыпается по струнам (фингерстайл/трэвис). Бас ведёт большой палец — мелодия сверху.<br><b>Сделай:</b> собери «Акуст. блюз» ✨; пальцевая фактура — потом, пока бей по басу.",app:{text:"Собери «Акуст. блюз» ✨ и включи ▶ Фон.",tool:"song",btn:"🎵 Песня"}}];let m=store.get("ga_school100",null);if(!m||"object"!=typeof m){m={};const e=store.get("ga_school",[]);Array.isArray(e)&&6===e.length&&[[0,"l02"],[1,"l05"],[1,"l06"],[2,"l11"],[3,"l49"],[4,"l13"],[5,"l61"]].forEach(([t,n]
