      '<br><span class="muted small">рядом: ' + near + '</span>' +
      '<br>играй: <b>' + esc(pcName(best.T) + pn) + '</b>, блюзовая' +
      '<div class="row" style="margin-top:6px">' +
        '<button class="btn small primary" id="yt-l-gamma">🎼 Гамму на гриф</button>' +
        '<button class="btn small" id="yt-l-song">Собрать песню в этом ладу</button>' +
      '</div>';
    const T = best.T;
    $('#yt-l-gamma').addEventListener('click', () => {
      showTool('fret');
      const s = currentSection();
      if (s._open) s._open(T, pentaK);
    });
    $('#yt-l-song').addEventListener('click', () => {
      showTool('song');
      const s = currentSection();
      if (s._genSong) s._genSong(T, best.md);
    });
  }
  function ytPump(){
    if (!ytListen) return;
    const s = ytListen;
    s.an.getFloatFrequencyData(s.buf);
    const sr = audio().sampleRate;
    const vec = new Array(12).fill(0);
    let energy = 0;
    for (let i = 2; i < s.buf.length; i++){
      const db = s.buf[i];
      if (db < -85) continue;
      const lin = Math.pow(10, db / 20);
      energy += lin;
      const f = i * sr / s.an.fftSize;
      if (f < 60 || f > 2000) continue;
      const midi = 69 + 12 * Math.log2(f / 440);
      vec[((Math.round(midi) % 12) + 12) % 12] += lin;
    }
    s.vec = s.vec ? s.vec.map((v, i) => v + vec[i]) : vec;
    s.env.push({ t: performance.now(), v: energy });
    s.raf = requestAnimationFrame(ytPump);
  }
  $('#yt-listen').addEventListener('click', async () => {
    if (ytListen){ ytStopListen(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
      $('#yt-listen-info').textContent = 'этот браузер не умеет отдавать звук вкладки (нужен Chrome/Edge)';
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true });
      if (!stream.getAudioTracks().length){
        stream.getTracks().forEach(t => t.stop());
        $('#yt-listen-out').innerHTML = '<span class="muted small">звука не было — выбери вкладку ютуба и поставь галочку «Поделиться звуком вкладки»</span>';
        return;
      }
      const ctx = audio();
      const src = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser();
      an.fftSize = 8192; an.smoothingTimeConstant = 0;
      src.connect(an);
      ytListen = { stream, src, an, buf: new Float32Array(an.frequencyBinCount), vec: null, env: [], seconds: 0, bpm: null, timer: 0, raf: 0 };
      $('#yt-listen').textContent = '■ Стоп';
      $('#yt-listen-info').textContent = 'слушаю… собрано 0 секунд';
      ytPump();
      ytListen.timer = setInterval(() => {
        if (!ytListen) return;
        ytListen.seconds++;
        $('#yt-listen-info').textContent = 'слушаю… собрано ' + ytListen.seconds + ' секунд';
        // примерный BPM по пульсации громкости (автокорреляция огибающей)
        const env = ytListen.env;
        if (env.length > 120 && !ytListen.bpm){
          const dt = env[env.length - 1].t - env[0].t;
          const n = env.length;
          let mean = 0;
          env.forEach(p => { mean += p.v; });
          mean /= n;
          let bestLag = 0, bestV = 0;
          for (let lag = Math.floor(n * 60 / 180); lag <= Math.floor(n * 60 / 60); lag++){
            let s2 = 0;
            for (let i = lag; i < n; i++) s2 += (env[i].v - mean) * (env[i - lag].v - mean);
            if (s2 > bestV){ bestV = s2; bestLag = lag; }
          }
          if (bestLag > 0 && dt > 0){
            const bpm = Math.round(60000 / (dt / (n - 1) * bestLag));
            if (bpm >= 60 && bpm <= 180) ytListen.bpm = bpm;
          }
        }
        if (ytListen.seconds >= 12) ytAnalyze();
      }, 1000);
    }catch(e){
      $('#yt-listen-out').innerHTML = '<span class="muted small">не вышло: ' + esc(e.message || e) + '</span>';
    }
  });
  function songScaleIv(chordRoot, chordQ){ // что играть поверх аккорда с учётом лада песни

    if (songView === 'scale' && SCALES[smName] && SCALES[smName].iv)
      return { iv: SCALES[smName].iv, label: SCALES[smName].name + ' от ' + pcName(chordRoot) };
    if (songView === 'penta'){
      if (sm === 'pentaMaj' || sm === 'pentaMin' || sm === 'blues')
        return { iv: SCALES[sm].iv, label: SCALES[sm].name + ' от ' + pcName(chordRoot) };
      return { iv: SCALES[chordQ === 'maj' ? 'pentaMaj' : 'pentaMin'].iv, label: 'пентатоника ' + pcName(chordRoot) };
    }
    return null; // тоны аккорда
  }

    let html = '<div class="row" style="justify-content:space-between; margin-bottom:8px">' +

        '<button class="chip' + (songShow ? ' on' : '') + '" id="f-songshow" title="Показывать аккорд на грифе">На грифе: ' + (songShow ? 'вкл' : 'выкл') + '</button>' +
        '<span class="row" id="f-songview" style="gap:4px">' +
          [['tones', 'Тоны'], ['penta', 'Пента'], ['scale', 'Гамма']].map(([v, t]) =>
            '<button class="chip' + (songView === v ? ' on' : '') + '" data-sv="' + v + '">' + t + '</button>').join('') +

    if (!song.length){
      html += '<div class="muted small">Песня пока пуста — собери её во вкладке «🎵 Песня», и аккорды появятся здесь с аппликатурой. Клик по аккорду — играть поверх него.</div>' +
        '<button class="btn small" data-gosong style="margin-top:8px">🎵 К песне</button>';
    } else {

        '<button class="btn small icon" data-sn="prev" title="Предыдущий аккорд — клавиша ,">◀</button>' +
        '<button class="btn small icon" data-sn="next" title="Следующий аккорд — клавиша .">▶</button>' +
        '<button class="btn small" data-sarp title="Арпеджио выбранного аккорда по струнам">♪ Арпеджио</button>' +
        '<span id="f-songhint" style="font-size:14px; font-weight:700; color:var(--accent)"></span>' +
      '</div>' +
      '<div class="songstrip-list">' + song.map((c, i) => {
        const vs = findVoicings(c.root, c.q);
        const v = vs.length ? vs[0] : null;
        return '<div class="song-card' + (songShow && songSel === i ? ' on' : '') + '" data-si="' + i + '" title="Клик — играть поверх этого аккорда">' +
          '<b>' + esc(chordName(c.root, c.q)) + '</b>' +
          '<span class="song-del" data-del="' + i + '" title="Удалить аккорд из песни">✕</span>' +
          (v ? '<div class="song-mini">' + chordDiagramSVG(v, c.root, c.q, { noTitle: true, fingers: deriveFingers(v) }) + '</div>'
             : '<div class="muted small">нет аппликатуры</div>') +
          '</div>';
      }).join('') + '</div>';
    }
    box.innerHTML = html;
    if (songShow && songSel >= 0 && songSel < song.length && lastScrolledSel !== songSel){ // скроллим только при СМЕНЕ аккорда (не на каждый draw)
      const cur = box.querySelectorAll('.song-card')[songSel];
      if (cur && cur.scrollIntoView) cur.scrollIntoView({ block:'nearest', inline:'nearest' });
      lastScrolledSel = songSel;
    }
    box.querySelectorAll('.song-card').forEach(c =>
      c.addEventListener('click', e => {
        if (e.target.dataset.del !== undefined) return; // удаление — отдельный клик
        songSel = +c.dataset.si;
        songShow = true;
        saveUI('fret', { songShow, songSel });
        songStrip(); draw();
      }));
    box.querySelectorAll('[data-del]').forEach(x =>
      x.addEventListener('click', e => {
        e.stopPropagation();
        const i = +x.dataset.del;
        const song = getSong();
        song.splice(i, 1);
        setSong(song);
        if (songSel >= song.length) songSel = song.length - 1;
        songStrip(); draw();
      }));
    box.querySelectorAll('[data-sv]').forEach(b =>
      b.addEventListener('click', () => { songView = b.dataset.sv; saveUI('fret', { songView }); draw(); }));
    const showBtn = box.querySelector('#f-songshow');
    if (showBtn) showBtn.addEventListener('click', () => {
      songShow = !songShow;
      saveUI('fret', { songShow });
      songStrip(); draw();
    });
    box.querySelectorAll('[data-sn]').forEach(b =>
      b.addEventListener('click', () => {
        if (!song.length) return;
        songSel = ((Math.max(0, songSel) + (b.dataset.sn === 'next' ? 1 : -1)) % song.length + song.length) % song.length;
        songShow = true;
        saveUI('fret', { songSel, songShow });
        songStrip(); draw();
      }));
    box.querySelectorAll('[data-sarp]').forEach(b =>
      b.addEventListener('click', () => {
        const song = getSong();
        if (songSel < 0 || songSel >= song.length) return;
        const c = song[songSel];
        const vs = findVoicings(c.root, c.q);
        if (vs.length) vs[0].f.forEach((f, i) => { if (f >= 0) pluck(midiFreq(tuningNotes()[i] + f), i * 0.13, 0.75); });
      }));
    box.querySelectorAll('[data-gosong]').forEach(b =>
      b.addEventListener('click', () => showTool('song')));
    const songOnLocal = songShow && songSel >= 0 && songSel < song.length;
    const songHint = box.querySelector('#f-songhint');
    if (songHint) songHint.textContent = songOnLocal
      ? 'на грифе: ' + (songView === 'tones' ? 'тоны ' + chordName(song[songSel].root, song[songSel].q)
          : songView === 'penta' ? 'пентатоника ' + pcName(song[songSel].root)
          : 'гамма ' + pcName(song[songSel].root)) + ' · аккорд ' + (songSel + 1) + ' из ' + song.length
      : (song.length ? 'Включи «На грифе» и кликни аккорд.' : '');
  }

  /* --- подсказки «что играть под эти аккорды» --- */
  function suggestStrip(){
    const box = $('#f-sug');
    if (!box) return;
    const song = getSong();
    if (!song.length){ box.style.display = 'none'; return; }
    const cand = [];
    for (let T = 0; T < 12; T++){
      ['maj','min','dorian','phrygian','lydian','mixolydian','locrian'].forEach(md => {
        const dia = diatonicTriads(T, md);
        let hit = 0;
        song.forEach(c => { if (dia.some(x => x.root === c.root && x.q === c.q)) hit++; });
        if (!hit) return;
        let bonus = 0; // как в detectKey: первый/последний аккорд песни — тоника кандидата
        const tonicQ = md === 'maj' ? 'maj' : 'min';
        if (song[0].root === T && song[0].q === tonicQ) bonus += 0.6;
        if (song[song.length - 1].root === T && song[song.length - 1].q === tonicQ) bonus += 0.6;
        cand.push({ T, md, hit, bonus });
      });
    }
    cand.sort((a, b) => b.hit - a.hit || b.bonus - a.bonus || a.T - b.T);
    const top = cand.slice(0, 8);
    const si = songInfo();
    let html = '<div class="row" style="justify-content:space-between; margin-bottom:6px">' +
      '<div class="side-title" style="margin:0; color:var(--accent)">🎓 ЧТО ИГРАТЬ ПОД АККОРДЫ</div>' +
      '<span class="muted small">клик по чипу — гамма сразу на грифе</span></div>';
    html += '<div class="row" style="gap:4px">' + top.map(r => {
      const myName = { maj:'major', min:'minor' }[r.md] || r.md;
      const on = r.T === key && myName === scaleKey;
      const nm = SONG_MODES.find(x => x[0] === r.md);
      return '<button class="chip' + (on ? ' on' : '') + '" data-k="' + r.T + '" data-m="' + r.md + '">' +
        pcName(r.T) + ' ' + esc(nm ? nm[1] : r.md) + ' · <b>' + r.hit + '</b> из ' + song.length + '</button>';
    }).join(' ') + '</div>';
    html += '<div class="row" style="margin-top:6px; gap:4px">' +
      '<span class="muted small" style="white-space:nowrap">для импровизации от ' + esc(pcName(si.key)) + ':</span>' +
      [['pentaMin', 'мин. пентатоника'], ['pentaMaj', 'маж. пентатоника'], ['blues', 'блюз']].map(p =>
        '<button class="chip' + (si.key === key && scaleKey === p[0] ? ' on' : '') + '" data-pk="' + p[0] + '">' + p[1] + '</button>').join(' ') +
      '</div>';
    box.innerHTML = html;
    box.querySelectorAll('[data-k]').forEach(b =>
      b.addEventListener('click', () => { // чип = сразу применить тональность на гриф
        key = +b.dataset.k;
        scaleKey = { maj:'major', min:'minor' }[b.dataset.m] || b.dataset.m;
        $('#f-key').value = String(key);
        $('#f-scale').value = scaleKey;
        songSel = -1; // показать чистую гамму, не поверх аккорда
        dronePitch(key);
        draw();
      }));
    box.querySelectorAll('[data-pk]').forEach(b =>
      b.addEventListener('click', () => { // пентатоника/блюз от тоники песни
        key = songInfo().key;
        scaleKey = b.dataset.pk;
        $('#f-key').value = String(key);
        $('#f-scale').value = scaleKey;
        songSel = -1;
        dronePitch(key);
        draw();
      }));
  }

  /* --- фраза (правый бокс): редактор с длительностями, паузами, удалением --- */
  function durSym(d){ return d.dur === 0.5 ? '♪' : d.dur === 2 ? '—' : '♩'; }
  function pickDur(){
    const r = Math.random();
    return r < 0.28 ? 0.5 : (r < 0.8 ? 1 : 2);
  }
  function phraseSource(){
    if (songShow && songSel >= 0){
      const song = getSong();
      if (songSel < song.length){
        const c = song[songSel];
        const m = songScaleIv(c.root, c.q);
        if (m) return { iv: m.iv, root: c.root, label: m.label + ' · ' + chordName(c.root, c.q) };
        return { iv: CHORD_INTERVALS[c.q], root: c.root, label: 'тоны ' + chordName(c.root, c.q) };
      }
    }
    return { iv: SCALES[scaleKey].iv || [0, 2, 4, 5, 7, 9, 11], root: key, label: SCALES[scaleKey].name + ' от ' + pcName(key) };
  }
  function rebuildDots(){ // уникальные позиции включённых нот (без пауз) — для дорожки
    const seen = new Set();
    phraseDotsCache = [];
    (phrase || []).forEach(d => {
      if (!d.on || d.rest) return;
      const k = d.row + ':' + d.f;
      if (!seen.has(k)){ seen.add(k); phraseDotsCache.push({ ...d }); }
    });
  }
  function genPhrase(){
    const src = phraseSource();
    const iv = src.iv;
    if (!iv || !iv.length){ phrase = null; phraseLabel = src.label; rebuildDots(); phraseSide(); draw(); return; }
    const lim = Math.min(12, nfrets);
    const tn = tuningNotes().slice().reverse();
    const collect = (f0, f1) => {
      const arr = [];
      tn.forEach((m, row) => {
        for (let f = f0; f <= f1; f++){
          const pc = ((m + f) % 12 + 12) % 12;
          if (iv.includes(((pc - src.root) % 12 + 12) % 12)) arr.push({ row, f, midi: m + f });
        }
      });
      return arr;
    };
    let start = Math.floor(Math.random() * Math.max(1, lim - 3));
    let dots = collect(start, Math.min(start + 3, lim));
    if (dots.length < 5) dots = collect(0, lim); // в окне мало нот — берём весь гриф
    if (dots.length < 5){ phrase = null; phraseLabel = src.label; rebuildDots(); phraseSide(); draw(); return; }
    const len = 8 + Math.floor(Math.random() * 3);
    // маршрут с ПОВТОРАМИ: повтор ноты — это и есть мелодия
    let cur = dots[Math.floor(Math.random() * dots.length)];
    const seq = [{ ...cur, dur: pickDur(), on: true }];
    for (let k = 1; k < len; k++){
      const nb = dots.filter(d =>
        (d.row === cur.row && Math.abs(d.f - cur.f) === 1) ||
        (Math.abs(d.row - cur.row) === 1 && Math.abs(d.f - cur.f) <= 2));
      const r = Math.random();
      let next;
      if (r < 0.24){ next = cur; } // повтор той же ноты
      else if (nb.length && r < 0.88){
        nb.sort((a, b) => Math.abs(a.midi - cur.midi) - Math.abs(b.midi - cur.midi));
        next = nb[Math.floor(Math.random() * Math.min(2, nb.length))];
      } else {
        next = dots[Math.floor(Math.random() * dots.length)];
      }
      seq.push({ ...next, dur: pickDur(), on: true });
      cur = next;
    }
    const rootDots = dots.filter(d => ((d.midi - src.root) % 12 + 12) % 12 === 0);
    if (rootDots.length){
      rootDots.sort((a, b) => Math.abs(a.midi - cur.midi) - Math.abs(b.midi - cur.midi));
      seq[seq.length - 1] = { ...rootDots[0], dur: 2, on: true };
    }
    phrase = seq;
    phraseLabel = src.label;
    rebuildDots();
    phraseSide();
    draw();
  }
  function addRest(){ // пауза после последней ноты
    if (!phrase) genPhrase();
    if (!phrase) return;
    phrase.push({ rest: true, dur: 1, on: true });
    rebuildDots();
    phraseSide();
    draw();
  }
  function adjustCount(delta){
    if (!phrase || !phrase.length){ genPhrase(); return; }
    if (delta > 0){
      const last = phrase[phrase.length - 1];
      if (last.rest){ phrase[phrase.length - 1] = { ...phrase[phrase.length - 2], dur: last.dur, on: true }; }
      else {
        const src = phraseSource();
        const tn = tuningNotes().slice().reverse();
        const cand = [];
        tn.forEach((m, row) => {
          for (const f of [last.f - 1, last.f, last.f + 1]){
            if (f < 0 || f > nfrets) continue;
            const pc = ((m + f) % 12 + 12) % 12;
            if (ivOf(pc, src.root, src.iv)) cand.push({ row, f, midi: m + f });
          }
        });
        const near = cand.filter(c => Math.abs(c.row - last.row) <= 1);
        const pick = (near.length ? near : cand)[Math.floor(Math.random() * (near.length ? near.length : cand.length))];
        phrase.push(pick ? { ...pick, dur: pickDur(), on: true } : { ...last, dur: pickDur(), on: true }); // иначе повтор
      }
    } else if (phrase.length > 4){
      phrase.pop();
    }
    rebuildDots();
    phraseSide();
    draw();
  }
  function ivOf(pc, root, iv){ return iv.includes(((pc - root) % 12 + 12) % 12); }
  function stopPhrase(){
    phraseTimers.forEach(clearTimeout); phraseTimers = [];
    if (phraseHitKey !== null){ phraseHitKey = null; draw(); }
  }
  function playPhrase(){
    stopPhrase();
    if (!phrase || !phrase.length) return;
    const seq = phrase.filter(d => d.on !== false);
    if (!seq.length) return;
    const step = 30000 / phraseBpm;
    let t = 0;
    const schedule = () => {
      seq.forEach(d => {
        phraseTimers.push(setTimeout(() => {
          if (!d.rest){
            pluck(midiFreq(d.midi), 0, 0.8);
            phraseHitKey = d.row + ':' + d.f;
            draw(); // перерисовка: играющая нота подсвечена на дорожке и на грифе
          }
        }, t));
        t += d.dur * step; // длительность ноты/паузы = пауза до следующей
      });
      phraseTimers.push(setTimeout(() => {
        phraseHitKey = null;
        draw();
        if (phraseLoop) schedule(); // 🔁 по кругу
      }, t + 120));
    };
    schedule();
  }
  function phraseSide(){
    const box = $('#f-right');
    if (!box) return;
    let html = '<div class="row" style="justify-content:space-between; margin-bottom:8px">' +
      '<div class="side-title" style="margin:0; color:' + PHRASE_COLOR + '">ФРАЗА</div>' +
      '<button class="chip' + (phraseShow ? ' on' : '') + '" id="f-phrase-show" title="Показать/скрыть дорожку фразы над грифом">' +
      (phraseShow ? '👁 вкл' : '👁 выкл') + '</button></div>';
    html += '<button class="btn primary small" id="f-phrase-gen" style="width:100%">🎲 Новая фраза</button>';
    html += '<div class="row" style="margin-top:8px; gap:6px">' +
      '<button class="btn small" data-rest title="Добавить паузу в конец фразы">+ Пауза</button>' +
      '<button class="btn small icon" data-pclear title="Убрать фразу">✕</button>' +
      '</div>';
    html += '<div class="side-list" style="margin-top:8px">' + (!phrase
      ? '<div class="muted small">Жми 🎲 Новая фраза — сгенерируем мелодию по текущей гамме или по аккорду песни.</div>'
      : phrase.length
      ? phrase.map((d, i) => {
          if (d.rest){
            return '<button class="side-chip" data-dur="' + i + '" title="Клик — длительность паузы (клик по ✕ — удалить)">' +
              '<span class="muted small">' + (i + 1) + '.</span> <b style="opacity:.7">ПАУЗА</b> <span class="muted small">' + durSym(d) + '</span>' +
              '<span data-del="' + i + '" style="float:right; opacity:.6" title="Удалить">✕</span></button>';
          }
          return '<button class="side-chip' + (d.on === false ? ' muted-note' : '') + '" data-pt="' + i + '" title="Клик — включить/выключить ноту">' +
            '<span class="muted small">' + (i + 1) + '.</span> <b style="' + (d.on === false ? 'text-decoration:line-through; opacity:.5' : '') + '">' +
            noteFull(d.midi) + '</b>' +
            '<span data-dur="' + i + '" style="padding:0 4px; color:' + PHRASE_COLOR + '; font-weight:700" title="Клик — длительность: ♪ короткая / ♩ обычная / — длинная">' + durSym(d) + '</span>' +
            '<span data-del="' + i + '" style="float:right; opacity:.6" title="Удалить">✕</span>' +
            '<span style="float:right; opacity:.5">' + (d.on === false ? '○' : '●') + '</span></button>';
        }).join('')
      : '<div class="muted small">В этой гамме мало нот в окне — смени тонику или гамму.</div>') + '</div>';
    html += '<div class="row" style="margin-top:8px; gap:6px">' +
      '<button class="btn small" data-play title="Сыграть фразу — играющая нота подсвечивается">▶</button>' +
      '<button class="chip' + (phraseLoop ? ' on' : '') + '" data-loop title="Проигрывать фразу по кругу">🔁 Зациклить</button>' +
      '</div>' +
      '<div class="row" style="margin-top:8px; gap:6px; align-items:center">' +
      '<span class="small muted">нот:</span>' +
      '<button class="btn small icon" data-cnt="-1" title="Убрать ноту">−</button>' +
      '<b id="f-phrase-count">' + (phrase ? phrase.filter(d => d.on).length : 0) + '</b>' +
      '<button class="btn small icon" data-cnt="1" title="Добавить ноту">+</button>' +
      '</div>' +
      '<label class="small muted" style="display:block; margin-top:8px">темп <b>' + phraseBpm + '</b> <input type="range" data-bpm min="70" max="200" value="' + phraseBpm + '" style="width:100%"></label>' +
      '<div class="muted small" style="margin-top:8px">Повторяй ноты смело — <b>повторение и делает мелодию</b>. Клик по имени — вкл/выкл ноту, по значку длительности — сменить её, ✕ — удалить, «+ Пауза» — тишина в мелодии.</div>';
    box.innerHTML = html;
    $('#f-phrase-show').addEventListener('click', () => {
      phraseShow = !phraseShow;
      saveUI('fret', { phraseShow });
      phraseSide(); draw();
    });
    $('#f-phrase-gen').addEventListener('click', genPhrase);
    box.querySelector('[data-rest]').addEventListener('click', addRest);
    box.querySelector('[data-pclear]').addEventListener('click', () => {
      stopPhrase(); phrase = null; rebuildDots(); phraseSide(); draw();
    });
    box.querySelectorAll('[data-pt]').forEach(b =>
      b.addEventListener('click', () => {
        const d = phrase[+b.dataset.pt];
        d.on = d.on === false ? true : false;
        rebuildDots();
        phraseSide(); draw();
      }));
    box.querySelectorAll('[data-dur]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        const d = phrase[+b.dataset.dur];
        d.dur = d.dur === 0.5 ? 1 : (d.dur === 1 ? 2 : 0.5); // ♪ → ♩ → — → ♪
        phraseSide(); draw();
      }));
    box.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        phrase.splice(+b.dataset.del, 1);
        rebuildDots();
        phraseSide(); draw();
      }));
    box.querySelectorAll('[data-cnt]').forEach(b =>
      b.addEventListener('click', () => adjustCount(+b.dataset.cnt)));
    box.querySelectorAll('[data-play]').forEach(b => b.addEventListener('click', playPhrase));
    box.querySelectorAll('[data-loop]').forEach(b => b.addEventListener('click', () => {
      phraseLoop = !phraseLoop;
      saveUI('fret', { phraseLoop });
      phraseSide();
      if (phraseLoop) playPhrase(); else stopPhrase();
    }));
    box.querySelector('[data-bpm]').addEventListener('input', e => {
      phraseBpm = +e.target.value;
      box.querySelector('[data-bpm]').previousElementSibling.querySelector('b').textContent = phraseBpm;
      saveUI('fret', { phraseBpm });
    });
  }

  /* --- «игровой режим»: глазки видимости блоков грифа --- */
  function renderVis(){ // ряд глазков «На экране:»
    const box = $('#f-vis');
    if (!box) return;
    const defs = [
      ['phrase', 'Фраза', 'Правый бокс с фразой', visPhrase],
      ['song', 'Аккорды песни', 'Стрип аккордов песни под грифом', songShow],
      ['yt', 'Ютуб', 'Блок ютуб-джема: что играть под бэктрек', visYt],
    ];
    box.innerHTML = '<span class="small muted" style="white-space:nowrap; margin-right:2px">На экране:</span>' +
      defs.map(d =>
        '<button class="chip' + (d[3] ? ' on' : '') + '" data-vis="' + d[0] + '" title="' + esc(d[2]) + ' — показать/скрыть">' +
        (d[3] ? '👁 ' : '🙈 ') + d[1] + '</button>').join(' ');
  }
  function syncVis(){ // скрытое исчезает совсем: без пустых мест
    const right = $('#f-right');
    if (right) right.style.display = visPhrase ? '' : 'none';
    const wrap = el.querySelector('.fret-wrap');
    if (wrap) wrap.classList.toggle('solo', !visPhrase);
    const strip = $('#f-songstrip');
    if (strip) strip.style.display = songShow ? '' : 'none';
    const flute = $('#f-flute');
    if (flute) flute.style.display = fluteShow ? '' : 'none';
    const sug = $('#f-sug');
    if (sug) sug.style.display = getSong().length ? '' : 'none'; // блок «что играть» — сам, когда в песне есть аккорды
    const yt = $('#f-yt');
    if (yt) yt.style.display = visYt ? '' : 'none';
    const strips = strip ? strip.parentElement : null; // .fret-strips: один видимый блок — на всю ширину
    if (strips && strips.classList.contains('fret-strips'))
      strips.classList.toggle('span1', strip.style.display === 'none' || sug.style.display === 'none');
  }
  $('#f-vis').addEventListener('click', e => {
    const b = e.target.closest('[data-vis]');
    if (!b) return;
    const v = b.dataset.vis;
    if (v === 'phrase'){ visPhrase = !visPhrase; saveUI('fret', { visPhrase }); }
    else if (v === 'song'){ songShow = !songShow; saveUI('fret', { songShow }); }
    else if (v === 'yt'){ visYt = !visYt; saveUI('fret', { visYt }); }
    draw();
  });

  /* проиграть вверх от тоники */
  function playScale(){
    if (songShow && songSel >= 0){
      const song = getSong();
      const c = song[songSel];
      if (!c) return;
      const iv = songView === 'penta' ? SCALES[c.q === 'maj' ? 'pentaMaj' : 'pentaMin'].iv
        : songView === 'scale' ? SCALES[c.q === 'maj' ? 'major' : 'minor'].iv
        : CHORD_INTERVALS[c.q];
      iv.forEach((off, i) => pluck(midiFreq(48 + c.root + off), i * 0.16, 0.7));
      pluck(midiFreq(48 + c.root + 12), iv.length * 0.16, 0.85);
      return;
    }
    const iv = SCALES[scaleKey].iv;
    if (!iv) return;
    iv.forEach((off, i) => pluck(midiFreq(48 + key + off), i * 0.16, 0.7));
    pluck(midiFreq(48 + key + 12), iv.length * 0.16, 0.85);
  }

  function fluteSource(){ // флейта звучит тем же, чем играешь на грифе: аккорд песни или гамма грифа
    const song = getSong();
    const songOn = songShow && songSel >= 0 && songSel < song.length;
    if (songOn){
      const c = song[songSel];
      const pos = ' · аккорд ' + (songSel + 1) + ' из ' + song.length;
      const m = songScaleIv(c.root, c.q);
      if (m) return { iv: m.iv, root: c.root, label: m.label + pos };
      return { iv: CHORD_INTERVALS[c.q] || [], root: c.root, label: 'тоны ' + chordName(c.root, c.q) + pos };
    }
    return { iv: SCALES[scaleKey].iv || [], root: key, label: (SCALES[scaleKey] ? SCALES[scaleKey].name : '') + ' от ' + pcName(key) };
  }
  function fluteStrip(){
    const box = $('#f-flute');
    if (!box) return;
    box.style.display = fluteShow ? '' : 'none';
    if (!fluteShow){ box.innerHTML = ''; return; }
    const d = getWindDef();
    const H = d.holes;
    const src = fluteSource(); // привязка к аккорду песни: ноты флейты меняются вместе с аккордом
    const entries = [];
    d.notes.forEach((midi, k) => {
      if (src.iv.includes(((midi - src.root) % 12 + 12) % 12)) entries.push({ k, midi });
    });
    let s = '<div class="side-title" style="color:#4dd0e1; margin-bottom:6px">🪈 ФЛЕЙТА — ' + esc(d.name.replace('🪈 ', '')) +
      ' · ' + esc(src.label) + '</div>';
    s += '<div class="songstrip-list">' + (entries.length ? entries.map(e => {
      const open = Math.min(e.k, H); // открыты нижние k отверстий
      let col = '<svg width="22" height="' + (H * 14 + 4) + '" viewBox="0 0 22 ' + (H * 14 + 4) + '">';
      for (let h = 0; h < H; h++){
        const closed = h < H - open;
        col += '<circle cx="11" cy="' + (7 + h * 14) + '" r="5" fill="' + (closed ? WIND_COLOR : 'none') + '" stroke="currentColor" stroke-opacity=".55"/>';
      }
      col += '</svg>';
      const isRoot = ((e.midi % 12) + 12) % 12 === ((src.root % 12) + 12) % 12; // тоника текущего набора — красным
      return '<div class="w-finger" data-wk="' + e.k + '" title="Клик — сыграть флейтой"><div class="w-fcol">' + col + '</div><div class="w-fname"' +
        (isRoot ? ' style="color:var(--bad); font-weight:800"' : '') + '>' + esc(pcName(e.midi)) + '</div></div>';
    }).join('') : '<span class="muted small">Ноты этого набора не попадают на отверстия инструмента — попробуй другой аккорд или тонику.</span>') + '</div>';
    box.innerHTML = s;
    box.querySelectorAll('.w-finger').forEach((w, i) => {
      w.style.cursor = 'pointer';
      w.addEventListener('click', () => windNote(entries[i].midi, 0.9));
    });
  }

  function draw(){
    const tSel = $('#f-tuning');
    if (tSel){
      if (!tSel.querySelector('option[value="' + settings.tuning + '"], optgroup option[value="' + settings.tuning + '"]'))
        tSel.innerHTML = tuningOptionsHTML();
      if (tSel.value !== settings.tuning) tSel.value = settings.tuning;
    }
    const tn = tuningNotes().slice().reverse();
    const song = getSong();
    const songOn = songShow && songSel >= 0 && songSel < song.length; // аккорд песни включён
    const songChord = songOn ? song[songSel] : null;
    let chordMode = !!chordOverlay, iv, rootPc, voicingKeys = null, modeLabel = '';
    if (songOn){
      rootPc = songChord.root;
      if (songView === 'tones'){
        iv = CHORD_INTERVALS[songChord.q];
        const vs = findVoicings(songChord.root, songChord.q);
        if (vs.length) voicingKeys = voicingKeySet(vs[0]);
        modeLabel = 'тоны аккорда';
      } else if (songView === 'penta'){
        const m = songScaleIv(songChord.root, songChord.q);
        iv = m.iv; modeLabel = m.label;
      } else {
        const m = songScaleIv(songChord.root, songChord.q);
        iv = m.iv; modeLabel = m.label;
      }
      chordMode = true;
    } else if (chordOverlay){
      iv = CHORD_INTERVALS[chordOverlay.q];
      rootPc = chordOverlay.root;
      const vs = findVoicings(chordOverlay.root, chordOverlay.q);
      if (vs.length) voicingKeys = voicingKeySet(vs[0]);
      chordMode = true;
    } else {
      iv = SCALES[scaleKey].iv;
      rootPc = key;
    }
    const inSet = pc => !iv || iv.includes(((pc - rootPc) % 12 + 12) % 12);
    const degOf = pc => iv ? iv.indexOf(((pc - rootPc) % 12 + 12) % 12) + 1 : 0;
    // тоны аккорда — оранжевым в любом режиме (в тон-режиме это весь набор)
    const chordQcur = songChord ? songChord.q : (chordOverlay ? chordOverlay.q : null);
    const chordRootPc = songChord ? songChord.root : (chordOverlay ? chordOverlay.root : null);
    const chordTonePcs = (chordMode && chordQcur && CHORD_INTERVALS[chordQcur]) ? CHORD_INTERVALS[chordQcur].map(o => (chordRootPc + o) % 12) : null;
    const ivLen = iv ? iv.length : 0;
    const posMax = (!chordMode && iv && ivLen === 7) ? 7
      : (!chordMode && iv && (ivLen === 5 || ivLen === 6)) ? 5 : 0;
    if (pos > posMax) pos = posMax;
    const posSel = $('#f-pos');
    if (posSel){
      posSel.innerHTML = '<option value="0">вся гамма</option>' +
        Array.from({length: posMax}, (_, i) =>
          '<option value="' + (i + 1) + '"' + (pos === i + 1 ? ' selected' : '') + '>' +
          (i + 1) + (posMax === 5 ? ' (бокс)' : ' (поз.)') + '</option>').join('');
      posSel.disabled = posMax === 0;
      if (posMax === 0) posSel.value = '0';
    }
    let wStart = -1, wEnd = -1;
    if (pos > 0 && posMax){
      const offs = posMax === 5 ? [0,2,4,7,9] : [0,1,2,3,4,5,6];
      wStart = (((rootPc - tn[tn.length - 1]) % 12) + 12) % 12 + offs[pos - 1];
      while (wStart > nfrets) wStart -= 12;
      wEnd = Math.min(wStart + 3, nfrets);
    }
    const posHint = $('#f-poshint');
    if (posHint){
      posHint.textContent = !chordMode && wStart >= 0 ? 'лады ' + wStart + '–' + wEnd : ''; // математику лада см. вкладка «Лады»
    }
    dronePitch(key);
    const descEl = $('#f-desc');
    if (descEl) descEl.textContent = !chordMode && SCALES[scaleKey].d ? SCALES[scaleKey].d : '';
    const ovBtn = $('#f-ovclear');
    if (ovBtn) ovBtn.style.display = chordOverlay ? '' : 'none';
    const chint = $('#f-chint');
    if (chint) chint.textContent = songOn
      ? '→ ' + modeLabel + ' для ' + chordName(songChord.root, songChord.q) + ' (аккорд ' + (songSel + 1) + ' из ' + song.length + ')' + (voicingKeys ? ' · обведена аппликатура' : '')
      : chordOverlay
        ? '→ показан аккорд ' + pcName(chordOverlay.root) + CHORD_SUFFIX[chordOverlay.q] + (voicingKeys ? ' · обведена аппликатура' : '')
        : '';

    // ширина лада: 24 лада должны влезать без прокрутки
    const wrapEl = document.getElementById('f-svg');
    const avail = Math.max(560, (wrapEl && wrapEl.clientWidth) || 0);
    let fw = (avail - 92) / nfrets;
    const compact = fw < 44; // много ладов — компактный режим
    fw = Math.max(18, compact ? fw : Math.min(fw, 64));
    const rNote = Math.max(6, Math.min(11, fw * 0.42));
    const rRoot = Math.max(7, Math.min(13, fw * 0.48));
    const rOpen = Math.max(5, Math.min(9, fw * 0.36));
    const fnt = Math.max(7, Math.min(11, fw * 0.42));
    const W = Math.round(54 + fw * nfrets + 24), H = tn.length * 34 + 48 + 40;
    let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" style="min-width:' + Math.min(W, avail) + 'px; width:100%">';
    s += '<rect width="' + W + '" height="' + H + '" fill="none"/>';
    const y0 = 28 + 40, rowH = 34, x0 = 54; // 40px — дорожка фразы над грифом
    for (let f = 0; f <= nfrets; f++){
      const x = x0 + f * fw;
      if (f === 0) s += '<rect x="' + (x - 3) + '" y="' + y0 + '" width="6" height="' + (tn.length * rowH) + '" fill="currentColor"/>';
      else s += '<line x1="' + x + '" y1="' + y0 + '" x2="' + x + '" y2="' + (y0 + tn.length * rowH) + '" stroke="currentColor" stroke-opacity=".3"/>';
      if (f > 0) s += '<text x="' + (x - fw / 2) + '" y="' + (y0 - 10) + '" text-anchor="middle" font-size="' + Math.max(8, Math.min(12, fw * 0.45)) + '" fill="currentColor" opacity=".55">' + f + '</text>';
    }
    [3,5,7,9,15,17,19,21].forEach(f => {
      if (f <= nfrets){
        const x = x0 + (f - 0.5) * fw;
        s += '<circle cx="' + x + '" cy="' + (y0 + tn.length * rowH / 2) + '" r="' + Math.min(8, fw * 0.3) + '" fill="currentColor" opacity=".1"/>';
      }
    });
    [12,24].forEach(f => {
      if (f <= nfrets){
        const x = x0 + (f - 0.5) * fw;
        s += '<circle cx="' + x + '" cy="' + (y0 + tn.length*rowH/2 - 10) + '" r="' + Math.min(8, fw * 0.3) + '" fill="currentColor" opacity=".1"/>' +
             '<circle cx="' + x + '" cy="' + (y0 + tn.length*rowH/2 + 10) + '" r="' + Math.min(8, fw * 0.3) + '" fill="currentColor" opacity=".1"/>';
      }
    });
    tn.forEach((m, row) => {
      const y = y0 + row * rowH + rowH / 2;
      s += '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="currentColor" stroke-opacity=".45"/>';
      s += '<text x="30" y="' + (y + 5) + '" text-anchor="end" font-size="' + Math.max(9, Math.min(12, fw * 0.45)) + '" fill="currentColor" opacity=".7">' + noteFull(m) + '</text>';
      for (let f = 0; f <= nfrets; f++){
        const pc = ((m + f) % 12 + 12) % 12;
        const cx = f === 0 ? x0 - 12 : x0 + (f - 0.5) * fw;
        const isRoot = inSet(pc) && ((pc - rootPc) % 12 + 12) % 12 === 0 && iv;
        const inScale = inSet(pc);
        { // рисуем ВСЕ ноты: гамма «кричит», посторонние — бледные
          const isVoicing = voicingKeys && voicingKeys.has(row + ':' + f);
          const isChordTone = chordTonePcs && chordTonePcs.includes(pc);
          const isPhraseHit = phraseHitKey === (row + ':' + f); // играющая нота фразы — подсветка прямо на грифе
          const r = f === 0 ? rOpen : (isPhraseHit || isRoot ? rRoot : (inScale ? rNote : rNote * 0.72));
          /* гамма «кричит»: тоника красная, ступени ярко-кремовые, посторонние — бледные */
          const fill = isPhraseHit ? PHRASE_COLOR
            : (isRoot ? TONIC_COLOR
            : (isChordTone ? 'var(--accent)'
            : (inScale ? 'var(--dot)'
            : 'currentColor')));
          const op = inScale ? 1 : 0.14;
          let cls = isRoot ? 'fb-root' : '';
          if (isVoicing) cls += (cls ? ' ' : '') + 'fb-voicing';
          if (isPhraseHit) cls += (cls ? ' ' : '') + 'fb-phrase-hit-note';
          const onColor = isPhraseHit ? '#141210' : (isRoot || isChordTone || inScale ? 'var(--dot-ink)' : 'currentColor');
          s += '<g data-midi="' + (m + f) + '" data-row="' + row + '" data-ff="' + f + '" style="cursor:pointer">' +
               '<circle' + (cls ? ' class="' + cls.trim() + '"' : '') + ' cx="' + cx + '" cy="' + y + '" r="' + r + '" fill="' + fill + '" stroke="currentColor" stroke-opacity=".4" stroke-width="' + (isVoicing ? '3' : '1') + '" opacity="' + op + '"/>';
          if (labels === 'notes' || (labels === 'deg' && isRoot) || isPhraseHit)
            s += '<text x="' + cx + '" y="' + (y + 4) + '" text-anchor="middle" font-size="' + fnt + '" font-weight="' + (isRoot || isChordTone || isPhraseHit ? 800 : 600) + '" fill="' + onColor + '" opacity="' + (inScale ? 1 : .55) + '" pointer-events="none">' + pcName(pc) + '</text>';
          else if (labels === 'deg')
            s += '<text x="' + cx + '" y="' + (y + 4) + '" text-anchor="middle" font-size="' + fnt + '" fill="currentColor" pointer-events="none">' + degOf(pc) + '</text>';
          s += '</g>';
        }
      }
    });
    // дорожка фразы НАД грифом (не перекрывает ноты); прячется вместе с боксом «Фраза»
    if (phraseShow && visPhrase && phraseDotsCache && phraseDotsCache.length){
      phraseDotsCache.forEach(d => {
        const cx = d.f === 0 ? x0 - 12 : x0 + (d.f - 0.5) * fw;
        const cyb = y0 - 40 / 2 + 2;
        const isHit = phraseHitKey === (d.row + ':' + d.f);
        const rb = Math.max(9, Math.min(12, fw * 0.45));
        s += '<circle class="fb-phrase' + (isHit ? ' fb-phrase-hit' : '') + '" data-key="' + d.row + ':' + d.f + '" cx="' + cx + '" cy="' + cyb + '" r="' + (isHit ? rb + 3 : rb) + '" fill="' + (isHit ? '#fff' : PHRASE_COLOR) + '" stroke="' + (isHit ? PHRASE_COLOR : 'none') + '" stroke-width="' + (isHit ? '3' : '0') + '"/>' +
             '<text x="' + cx + '" y="' + (cyb + 3.5) + '" text-anchor="middle" font-size="' + Math.max(7, Math.min(9.5, fw * 0.36)) + '" font-weight="800" fill="#141210" pointer-events="none">' + pcName(d.midi) + '</text>';
        if (isHit){
          const yDot = y0 + d.row * rowH + rowH / 2;
          s += '<line x1="' + cx + '" y1="' + (cyb + rb) + '" x2="' + cx + '" y2="' + (yDot - 12) + '" stroke="' + PHRASE_COLOR + '" stroke-width="3" stroke-dasharray="5 4" opacity=".9"/>';
          s += '<circle cx="' + cx + '" cy="' + yDot + '" r="14" fill="none" stroke="' + PHRASE_COLOR + '" stroke-width="3.5"/>';
        }
      });
    }
    s += '</svg>';
    const box = $('#f-svg');
    box.innerHTML = s;
    box.querySelectorAll('g[data-midi]').forEach(g =>
      g.addEventListener('click', () => {
        pluck(midiFreq(+g.dataset.midi));
      }));
    saveUI('fret', { key, scaleKey, nfrets, mode: labels, pos });
    songStrip();
    fluteStrip();
    suggestStrip();
    renderVis();
    syncVis();
    syncLinkUI();
  }

  $('#f-tuning').addEventListener('change', e => setTuning(e.target.value));
  $('#f-key').addEventListener('change', e => { key = +e.target.value; dronePitch(key); draw(); });
  $('#f-scale').addEventListener('change', e => { scaleKey = e.target.value; draw(); });
  $('#f-frets').addEventListener('change', e => { nfrets = +e.target.value; draw(); });
  $('#f-labels').addEventListener('change', e => { labels = e.target.value; draw(); });
  $('#f-flute-btn').addEventListener('click', () => { fluteShow = !fluteShow; saveUI('fret', { fluteShow }); syncFluteBtn(); draw(); });
  function syncFluteBtn(){
    const b = $('#f-flute-btn');
    if (b){ b.classList.toggle('on', fluteShow); b.textContent = '🪈 Флейта: ' + (fluteShow ? 'вкл' : 'выкл'); }
  }
  $('#f-ovclear').addEventListener('click', () => { chordOverlay = null; draw(); });
  $('.js-drone').addEventListener('click', () => droneToggle(key));
  $('#f-play').addEventListener('click', playScale);
  $('#f-key').value = String(key);
  $('#f-scale').value = scaleKey;
  $('#f-frets').value = String(nfrets);
  $('#f-labels').value = labels;
  syncFluteBtn();
  if (fretLink){ // привязка: если песню правили с последнего принятия — подтянуть тональность/лад
    const info = songInfo();
    if (Number.isInteger(info.chg) && info.chg !== adoptedChg) adoptFromSong();
  }
  if (songShow && songSel === -1 && getSong().length) songSel = 0; // сразу выбрать первый аккорд
  songStrip();
  phraseSide();
  draw();
  el._refresh = draw;
  el._onSong = () => { if (fretLink) adoptFromSong(); draw(); }; // песня изменилась → стрипы на грифе свежие, привязанный гриф перестраивается
  el._cleanup = () => { droneStop(); stopPhrase(); ytStopListen(); };
  el._hotkey = e => { // гитара в руках: минимум кликов
    switch (e.code){
      case 'Space': playScale(); return true;
      case 'KeyD': droneToggle(key); return true;
      case 'Comma': if (songShow && getSong().length){ songSel = ((Math.max(0, songSel) - 1) % getSong().length + getSong().length) % getSong().length; songStrip(); draw(); return true; } break;
      case 'Period': if (songShow && getSong().length){ songSel = ((Math.max(0, songSel) + 1) % getSong().length + getSong().length) % getSong().length; songStrip(); draw(); return true; } break;
      case 'ArrowLeft': case 'ArrowRight': {
        const dir = e.code === 'ArrowRight' ? 1 : -1;
        key = (key + dir + 12) % 12;
        if (chordOverlay) chordOverlay.root = key;
        $('#f-key').value = String(key);
        dronePitch(key); draw(); return true;
      }
      case 'Digit0': case 'Digit1': case 'Digit2': case 'Digit3':
      case 'Digit4': case 'Digit5': case 'Digit6': case 'Digit7':
        pos = +e.code.slice(-1); draw(); return true;
    }
    return false;
  };
  if (!el._onResize){ el._onResize = () => draw(); window.addEventListener('resize', el._onResize); }

  el._open = (k, sc) => { // из квинт/школы/ютуба: открыть гамму
    key = k; scaleKey = sc || 'major'; chordOverlay = null;
    $('#f-key').value = String(key); $('#f-scale').value = scaleKey; // селекты показывают то же, что играет гриф
    dronePitch(key);
    draw();
  };
  el._openChord = (p, q) => { // из прогрессий: показать аккорд
    chordOverlay = { root: ((p % 12) + 12) % 12, q: q || 'maj' }; key = chordOverlay.root;
    $('#f-key').value = String(key);
    dronePitch(key);
    draw();
  };
  el._showSongChord = i => { songShow = true; songSel = i; saveUI('fret', { songShow, songSel }); songStrip(); setSongChord(i); };
  function setSongChord(i){
    const song = getSong();
    if (!song.length || i < 0 || i >= song.length) return;
    songSel = i;
    key = song[i].root;
    dronePitch(key);
    draw();
  }
  el._newPhrase = genPhrase;
}
/* ================= ИНСТРУМЕНТ: КРУГ КВИНТ ================= */

const QUINT_MAJ = ['C','G','D','A','E','B','F♯/G♭','D♭','A♭','E♭','B♭','F'];
const QUINT_MIN = ['Am','Em','Bm','F♯m','C♯m','G♯m','E♭m','B♭m','Fm','Cm','Gm','Dm'];

function renderQuints(el){
  el.innerHTML =
    '<h3 style="margin-top:0">🔄 Квинты — круг тональностей</h3>' +
    '<div class="quint-wrap">' +
      '<div class="card" style="flex:0 0 auto">' +
        '<div class="row" id="q-keys" style="max-width:330px"></div>' +
        '<div id="q-svg" style="margin-top:10px"></div>' +
      '</div>' +
      '<div class="card grow" id="q-info"></div>' +
    '</div>';

  const uiQ = loadUI('quints');
  let sel = Number.isInteger(uiQ.sel) ? Math.max(0, Math.min(11, uiQ.sel)) : 0; // индекс позиции (0 = C, по часовой +квинта)
  const keysEl = el.querySelector('#q-keys'), svgEl = el.querySelector('#q-svg'), info = el.querySelector('#q-info');

  function drawSvg(){
    saveUI('quints', { sel });
    const R = 150, C = R + 10, S = 2 * R + 20;
    let s = '<svg width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '" style="width:100%;max-width:400px;height:auto">';
    s += '<circle cx="' + C + '" cy="' + C + '" r="' + (R - 6) + '" fill="none" stroke="currentColor" stroke-opacity=".25"/>';
    s += '<circle cx="' + C + '" cy="' + C + '" r="' + (R * 0.62) + '" fill="none" stroke="currentColor" stroke-opacity=".25"/>';
    s += '<circle cx="' + C + '" cy="' + C + '" r="4" fill="currentColor" opacity=".4"/>';
    for (let i = 0; i < 12; i++){
      const a = -Math.PI / 2 + i * Math.PI / 6;
      const on = i === sel;
      const mx = C + Math.cos(a) * R * 0.82, my = C + Math.sin(a) * R * 0.82;
      const nx = C + Math.cos(a) * R * 0.45, ny = C + Math.sin(a) * R * 0.45;
      const sig = i < 6 ? (i ? i + '♯' : '') : i === 6 ? '6♯/6♭' : (12 - i) + '♭';
      s += '<g data-i="' + i + '" style="cursor:pointer">' +
        '<circle cx="' + mx + '" cy="' + my + '" r="21" fill="' + (on ? 'var(--accent)' : 'var(--card2)') + '" stroke="currentColor" stroke-opacity=".3"/>' +
        '<text x="' + mx + '" y="' + (my + 5) + '" text-anchor="middle" font-size="14" font-weight="700" fill="' + (on ? 'var(--accent-ink)' : 'currentColor') + '">' + QUINT_MAJ[i] + '</text>' +
        '<circle cx="' + nx + '" cy="' + ny + '" r="16" fill="' + (on ? 'var(--accent)' : 'var(--card2)') + '" stroke="currentColor" stroke-opacity=".3" opacity=".85"/>' +
        '<text x="' + nx + '" y="' + (ny + 4) + '" text-anchor="middle" font-size="11" fill="' + (on ? 'var(--accent-ink)' : 'currentColor') + '">' + QUINT_MIN[i] + '</text>' +
        '<text x="' + (C + Math.cos(a) * (R + 2)) + '" y="' + (C + Math.sin(a) * (R + 2) + 4) + '" text-anchor="middle" font-size="10" fill="currentColor" opacity=".5">' + sig + '</text>' +
        '</g>';
    }
    // стрелки типичных переходов от тоники: → V (по часовой), → IV (против часовой), → vi (внутрь)
    // дуги идут по свободной полосе между кольцами (радиус 0.61R)
    function arcArrow(fromPos, toPos){
      const rB = R * 0.61;
      const a1 = -Math.PI / 2 + fromPos * Math.PI / 6, a2 = -Math.PI / 2 + toPos * Math.PI / 6;
      const x1 = C + Math.cos(a1) * rB, y1 = C + Math.sin(a1) * rB;
      const x2 = C + Math.cos(a2) * rB, y2 = C + Math.sin(a2) * rB;
      const cw = ((toPos - fromPos + 12) % 12) <= 6;
      const sweep = cw ? 1 : 0;
      const tx = cw ? -Math.sin(a2) : Math.sin(a2);
      const ty = cw ? Math.cos(a2) : -Math.cos(a2);
      const px = -ty, py = tx, w = 4.5;
      return '<path d="M ' + x1 + ' ' + y1 + ' A ' + rB + ' ' + rB + ' 0 0 ' + sweep + ' ' + x2 + ' ' + y2 + '" fill="none" stroke="var(--accent)" stroke-width="3.5" opacity=".9"/>' +
        '<polygon points="' + x2 + ',' + y2 + ' ' + (x2 - tx * 11 + px * w) + ',' + (y2 - ty * 11 + py * w) + ' ' + (x2 - tx * 11 - px * w) + ',' + (y2 - ty * 11 - py * w) + '" fill="var(--accent)"/>';
    }
    // короткая радиальная стрелка: от мажорной тоники внутрь — к параллельному минору
    function radialArrow(pos){
      const a = -Math.PI / 2 + pos * Math.PI / 6;
      const ux = -Math.cos(a), uy = -Math.sin(a);
      const px = -uy, py = ux, w = 4.5;
      const x1 = C + Math.cos(a) * 101, y1 = C + Math.sin(a) * 101;
      const x2 = C + Math.cos(a) * 95, y2 = C + Math.sin(a) * 95;
      const ax = C + Math.cos(a) * 85, ay = C + Math.sin(a) * 85;
      return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--accent)" stroke-width="3.5" opacity=".9"/>' +
        '<polygon points="' + ax + ',' + ay + ' ' + (ax - ux * 10 + px * w) + ',' + (ay - uy * 10 + py * w) + ' ' + (ax - ux * 10 - px * w) + ',' + (ay - uy * 10 - py * w) + '" fill="var(--accent)"/>';
    }
    s += arcArrow(sel, (sel + 1) % 12);   // → V (доминанта, по часовой)
    s += arcArrow(sel, (sel + 11) % 12);  // → IV (кварта вверх, против часовой)
    s += radialArrow(sel);                // → vi (параллельный минор, внутрь)
    s += '</svg>';
    svgEl.innerHTML = s;
    svgEl.querySelectorAll('g[data-i]').forEach(g =>
      g.addEventListener('click', () => { sel = +g.dataset.i; drawSvg(); drawKeys(); drawInfo(); }));
  }
  function drawKeys(){
    keysEl.innerHTML = QUINT_MAJ.map((m, i) =>
      '<button class="qkey' + (i === sel ? ' on' : '') + '" data-i="' + i + '"><b>' + m + '</b><span>' + QUINT_MIN[i] + '</span></button>').join(' ');
    keysEl.querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { sel = +b.dataset.i; drawSvg(); drawKeys(); drawInfo(); }));
  }
  function drawInfo(){
    const useFlats = sel >= 6;
    const majPc = (sel * 7) % 12;
    const minPc = (majPc + 9) % 12;
    const qMaj = ['maj','min','min','maj','maj','min','dim'];
    const rnMaj = ['I','ii','iii','IV','V','vi','vii°'];
    const scale = [0,2,4,5,7,9,11];
    let html = '<h3 style="margin-top:0">' + pcName(majPc, useFlats) + ' мажор · ' + pcName(minPc, useFlats) + ' минор</h3>';
    html += '<div class="muted small" style="margin-bottom:8px">Аккорды тональности — нажми, чтобы открыть аппликатуру:</div><div class="deg-list">';
    scale.forEach((iv, d) => {
      const rootPc = (majPc + iv) % 12;
      const nm = chordName(rootPc, qMaj[d], useFlats);
      html += '<button class="deg-chip" data-pc="' + rootPc + '" data-q="' + qMaj[d] + '"><b>' + esc(nm) + '</b><span class="rn">' + rnMaj[d] + '</span></button>';
    });
    html += '</div><h3 style="margin-bottom:6px">🎯 6 аккордов для песни</h3>' +
      '<div class="muted small" style="margin-bottom:8px">Тональность + 2 соседа + их минорные напарники — этого хватает для песни:</div><div class="deg-list">';
    [[(sel + 11) % 12, 'maj', 'IV', 0], [sel, 'maj', 'I', 0], [(sel + 1) % 12, 'maj', 'V', 0],
     [(sel + 11) % 12, 'min', 'ii', 9], [sel, 'min', 'vi', 9], [(sel + 1) % 12, 'min', 'iii', 9]].forEach(([pos, qq, deg, rel]) => {
      const pcv = (pos * 7 + rel) % 12; // минорный напарник = +9 полутонов (относительный минор)
      html += '<button class="deg-chip" data-pc="' + pcv + '" data-q="' + qq + '"><b>' + esc(chordName(pcv, qq, useFlats)) + '</b><span class="rn">' + deg + '</span></button>';
    });
    html += '</div><h3>Гамма на грифе</h3><div class="row">' +
      '<button class="btn small" id="q-fret-major">Мажор на грифе</button>' +
      '<button class="btn small" id="q-fret-minor">Минор на грифе</button></div>';
    html += '</div><h3>Прогрессии</h3><div class="muted small" style="margin-bottom:6px">Готовые последовательности — откроются на вкладке «Прогрессии» в этой тональности:</div><div class="row">' +
      PROGRESSIONS.map((p, i) =>
        '<button class="chip" data-prog="' + i + '" title="' + esc(p.degs.map(d => typeof d === 'object' ? ROMAN[d.d] : ROMAN[d]).join('–')) + '">' + esc(p.name) +
        ' <span class="muted small">' + (PROG_MODES[p.mode] ? PROG_MODES[p.mode].name.replace(/ \(.*\)/, '') : '') + '</span></button>').join('') + '</div>';
    html += '</div><h3>Стрелки на круге</h3><div class="muted small">Оранжевые стрелки от тоники — типичные переходы: ' +
      'по часовой → V (доминанта), против часовой → IV (кварта вверх), внутрь круга → параллельный минор (vi). ' +
      'Классическое разрешение — обратный ход V → I.</div>' +
      '<details class="hint" style="margin-top:10px"><summary style="cursor:pointer; font-weight:700">📌 Шпаргалка — вся правда о квинтовом круге</summary><div style="margin-top:10px">' +
      '<b>Шагаем по циферблату не на 1 час, а на 7 (квинта):</b> C → G → D → A → E → B → F♯ → D♭ → A♭ → E♭ → B♭ → F → C.<br>' +
      '<b>По часовой — +1 диез:</b> G (1♯), D (2♯), A (3♯), E (4♯)…<br>' +
      '<b>Против часовой — +1 бемоль:</b> F (1♭), B♭ (2♭), E♭ (3♭), A♭ (4♭)…<br>' +
      '<b>Главное:</b> тональность + 2 соседа + их минорные напарники = 6 аккордов для песни.<br>' +
      'Пример, ' + esc(pcName(majPc, useFlats)) + ' мажор: ' + esc(chordName(((sel + 11) % 12) * 7 % 12, 'maj', useFlats)) + ' · ' + esc(chordName(majPc, 'maj', useFlats)) + ' · ' +
      esc(chordName(((sel + 1) % 12) * 7 % 12, 'maj', useFlats)) + ' + ' + esc(chordName((((sel + 11) % 12) * 7 + 9) % 12, 'min', useFlats)) + ' · ' +
      esc(chordName((majPc + 9) % 12, 'min', useFlats)) + ' · ' + esc(chordName((((sel + 1) % 12) * 7 + 9) % 12, 'min', useFlats)) + '.<br>' +
      '<b>Соседи</b> на круге отличаются одной нотой — переход между ними почти незаметен.<br>' +
      '<b>' + esc(pcName(((sel + 1) % 12) * 7 % 12, useFlats)) + ' → ' + esc(pcName(majPc, useFlats)) + '</b> звучит как возвращение домой: так часто заканчивают куплет, припев или всю песню.' +
      '</div></details>';
    info.innerHTML = html;
    if (TOOLS.some(t => t.id === 'chords'))
      info.querySelectorAll('.deg-chip').forEach(b =>
        b.addEventListener('click', () => { showTool('chords'); const t = currentSection()._open; t && t(+b.dataset.pc, b.dataset.q); }));
    info.querySelector('#q-fret-major').addEventListener('click', () => { showTool('fret'); currentSection()._open && currentSection()._open(majPc, 'major'); });
    info.querySelector('#q-fret-minor').addEventListener('click', () => { showTool('fret'); currentSection()._open && currentSection()._open(minPc, 'minor'); });
    info.querySelectorAll('[data-prog]').forEach(b =>
      b.addEventListener('click', () => {
        const idx = +b.dataset.prog;
        const p = PROGRESSIONS[idx];
        showTool('prog');
        const sec = currentSection();
        sec._open && sec._open(p.mode === 'major' ? majPc : minPc, idx);
      }));
  }
  drawSvg(); drawKeys(); drawInfo();
}

/* ================= ИНСТРУМЕНТ: ХРОМАТИЧЕСКИЙ КРУГ =================
   12 нот = 12 часов циферблата, 1 час = полутон. Трезвучие = треугольник:
   мажор 4+3, минор 3+4, уменьшённый 3+3, увеличенный 4+4. */

const SOLF = ['до','до#','ре','ре#','ми','фа','фа#','соль','соль#','ля','ля#','си'];
/* все виды аккордов для хроматического круга: порядок — как в CHORD_TYPES */
const CHROMA_Q = {
  maj:  { name:'мажор',       formula:'4+3',     iv:[0,4,7],      color:'#ffb454' },
  min:  { name:'минор',       formula:'3+4',     iv:[0,3,7],      color:'#b18cff' },
  7:    { name:'септаккорд',  formula:'4+3+3',   iv:[0,4,7,10],   color:'#ff8a5c' },
  m7:   { name:'минор-септ',  formula:'3+4+3',   iv:[0,3,7,10],   color:'#c39bff' },
  maj7: { name:'мажор-септ',  formula:'4+3+4',   iv:[0,4,7,11],   color:'#ffd27a' },
  sus2: { name:'sus2',        formula:'2+5',     iv:[0,2,7],      color:'#d4b483' },
  sus4: { name:'sus4',        formula:'5+2',     iv:[0,5,7],      color:'#e0c097' },
  5:    { name:'пауэр-аккорд',formula:'7',       iv:[0,7],        color:'#b0a08a' },
  dim:  { name:'уменьшённый', formula:'3+3',     iv:[0,3,6],      color:'#7ee787' },
  m7b5: { name:'полууменьш.', formula:'3+3+4',   iv:[0,3,6,10],   color:'#8fd694' },
  aug:  { name:'увеличенный', formula:'4+4',     iv:[0,4,8],      color:'#5ec8f8' },
  6:    { name:'с секстой',   formula:'4+3+2',   iv:[0,4,7,9],    color:'#ffc46b' },
  add9: { name:'add9',        formula:'2+2+3+3', iv:[0,2,4,7],    color:'#ffe08a' },
};

function renderChroma(el){
  const $ = s => el.querySelector(s);
  const uiX = loadUI('chroma');
  let root = Number.isInteger(uiX.root) ? uiX.root : 0;
  let q = CHROMA_Q[uiX.q] ? uiX.q : 'maj';

  el.innerHTML =
    '<h3 style="margin-top:0">⏰ Хроматический круг — 12 часов, 1 час = полутон</h3>' +
    '<div class="card" style="text-align:center">' +
      '<div class="muted small">12 нот = 12 часов циферблата · 1 час = полутон. ' +
      'Клик по ноте — прозвучит, клик по имени аккорда в центре — сыграть всё трезвучие.</div>' +
      '<div class="row" style="justify-content:center; margin-top:10px" id="x-roots"></div>' +
      '<div class="row" style="justify-content:center; margin-top:8px" id="x-quals"></div>' +
      '<div id="x-svg" style="margin-top:4px"></div>' +
    '</div>' +
    '<div class="card"><h3 style="margin-top:0">📌 Шпаргалка — вся правда о трезвучиях</h3>' +
      '<div id="x-cheat"></div>' +
    '</div>';

  function drawRoots(){
    $('#x-roots').innerHTML = NOTE_SHARP.map((n, i) =>
      '<button class="chip' + (i === root ? ' on' : '') + '" data-r="' + i + '">' + n + '</button>').join(' ');
    $('#x-roots').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { root = +b.dataset.r; saveUI('chroma', { root, q }); drawRoots(); drawCheat(); drawSvg(); }));
  }
  function drawQuals(){
    $('#x-quals').innerHTML = CHORD_TYPES.map(k =>
      '<button class="chip' + (k === q ? ' on' : '') + '" data-q="' + k + '" title="' +
      esc(CHROMA_Q[k].name + ' · шаги: ' + CHROMA_Q[k].formula) + '" style="' +
      (k === q ? 'background:' + CHROMA_Q[k].color + '; border-color:' + CHROMA_Q[k].color + '; color:#141210; font-weight:700;' : '') + '">' +
      esc(CHROMA_Q[k].name) + '</button>').join(' ');
    $('#x-quals').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { q = b.dataset.q; saveUI('chroma', { root, q }); drawQuals(); drawCheat(); drawSvg(); }));
  }
  function drawCheat(){
    $('#x-cheat').innerHTML = ['maj', 'min', 'dim', 'aug'].map(k => {
      const c = CHROMA_Q[k];
      const names = c.iv.map(o => pcName((root + o) % 12)).join(' · ');
      return '<button class="chip" data-c="' + k + '" style="margin:0 6px 6px 0; border-color:' + c.color + '">' +
        '<b style="color:' + c.color + '">' + c.name + '</b> — ' + c.formula + ' (' + esc(names) + ')</button>';
    }).join('') +
    '<div class="muted small" style="margin-top:8px">Считай часы от тоники: первый шаг — терция аккорда, второй — квинта, ' +
    'третья сторона всегда замыкает круг до тоники. Клик по формуле — показать на круге. Остальные виды аккордов — чипами над кругом: ' +
    'у септаккордов контур четырёхугольный, стрелки ведут через каждую ступень.</div>';
    $('#x-cheat').querySelectorAll('[data-c]').forEach(b =>
      b.addEventListener('click', () => { q = b.dataset.c; saveUI('chroma', { root, q }); drawQuals(); drawCheat(); drawSvg(); }));
  }

  function drawSvg(){
    const Q = CHROMA_Q[q];
    const iv = Q.iv;
    const S = 460, C = S / 2, cy = C + 6, R = 160;
    const angOf = pc => (-90 + pc * 30) * Math.PI / 180;
    const pt = (pc, r) => [C + Math.cos(angOf(pc)) * r, cy + Math.sin(angOf(pc)) * r];
    const chordTones = iv.map(o => (root + o) % 12);
    const tp = chordTones.map(pc => pt(pc, R - 6));
    let s = '<svg width="' + S + '" height="' + (S + 10) + '" viewBox="0 0 ' + S + ' ' + (S + 10) + '" style="max-width:460px;width:100%;height:auto">';
    s += '<circle cx="' + C + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="currentColor" stroke-opacity=".18"/>';
    // контур аккорда: треугольник / четырёхугольник / отрезок (пауэр-аккорд)
    if (tp.length > 2)
      s += '<polygon points="' + tp.map(p => p[0] + ',' + p[1]).join(' ') + '" fill="' + Q.color + '" fill-opacity=".09" stroke="' + Q.color + '" stroke-width="3.5" stroke-linejoin="round" style="filter:drop-shadow(0 0 10px ' + Q.color + ')"/>';
    else
      s += '<line x1="' + tp[0][0] + '" y1="' + tp[0][1] + '" x2="' + tp[1][0] + '" y2="' + tp[1][1] + '" stroke="' + Q.color + '" stroke-width="4" style="filter:drop-shadow(0 0 10px ' + Q.color + ')"/>';
    // стрелки по ободу: куда идти по часам от ноты к ноте (тон → терция → квинта → тоника)
    const seq = chordTones.concat([chordTones[0]]);
    for (let k = 0; k < seq.length - 1; k++){
      let semi = ((seq[k + 1] - seq[k]) % 12 + 12) % 12;
      if (semi === 0) semi = 12;
      const a1 = angOf(seq[k]) + 24 / R;
      const a2 = angOf(seq[k] + semi) - 20 / R;
      const large = semi > 6 ? 1 : 0;
      const x1 = C + Math.cos(a1) * R, y1 = cy + Math.sin(a1) * R;
      const x2 = C + Math.cos(a2) * R, y2 = cy + Math.sin(a2) * R;
      s += '<path d="M ' + x1 + ' ' + y1 + ' A ' + R + ' ' + R + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 + '" fill="none" stroke="' + Q.color + '" stroke-width="3" opacity=".95"/>';
      const tx = -Math.sin(a2), ty = Math.cos(a2), px = -ty, py = tx;
      s += '<polygon points="' + (x2 + tx * 10) + ',' + (y2 + ty * 10) + ' ' + (x2 - tx * 4 + px * 5) + ',' + (y2 - ty * 4 + py * 5) + ' ' + (x2 - tx * 4 - px * 5) + ',' + (y2 - ty * 4 - py * 5) + '" fill="' + Q.color + '"/>';
      const am = angOf(seq[k]) + (semi / 2) * Math.PI / 6;
      const pr = R + 38;
      const mx = C + Math.cos(am) * pr, my = cy + Math.sin(am) * pr;
      s += '<rect x="' + (mx - 26) + '" y="' + (my - 15) + '" width="52" height="30" rx="15" fill="var(--bg)" stroke="' + Q.color + '" stroke-opacity=".85"/>' +
           '<text x="' + mx + '" y="' + (my + 6) + '" text-anchor="middle" font-size="15" font-weight="700" fill="' + Q.color + '">+' + semi + '</text>';
    }
    // 12 нот циферблата — кругляшки активные: клик делает ноту тоникой
    NOTE_SHARP.forEach((n, i) => {
      const [x, y] = pt(i, R);
      const on = chordTones.includes(i);
      const isRootDot = i === root;
      const gStyle = 'cursor:pointer' + (on ? ';filter:drop-shadow(0 0 9px ' + Q.color + ')' : '');
      s += '<g data-n="' + i + '" style="' + gStyle + '" title="Клик — сделать ноту тоникой и сыграть">' +
        '<circle cx="' + x + '" cy="' + y + '" r="23" fill="' + (on ? Q.color : 'var(--card2)') + '" stroke="' + (isRootDot ? 'var(--text)' : Q.color) + '" stroke-opacity="' + (on ? '1' : '.35') + '" stroke-width="' + (isRootDot ? '2.5' : '1') + '"/>' +
        '<text x="' + x + '" y="' + (y + 1) + '" text-anchor="middle" font-size="15" font-weight="800" fill="' + (on ? '#141210' : 'currentColor') + '">' + n + '</text>' +
        '<text x="' + x + '" y="' + (y + 16) + '" text-anchor="middle" font-size="9.5" fill="' + (on ? '#141210' : 'currentColor') + '" opacity="' + (on ? '.85' : '.6') + '">' + SOLF[i] + '</text>' +
        '</g>';
    });
    // центр — имя аккорда
    s += '<g style="cursor:pointer" id="x-center">' +
      '<text x="' + C + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="46" font-weight="900" fill="' + Q.color + '" style="filter:drop-shadow(0 0 12px ' + Q.color + ')">' + esc(chordName(root, q)) + '</text>' +
      '<text x="' + C + '" y="' + (cy + 26) + '" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" opacity=".9">' + Q.name + ' · ' + Q.formula + '</text>' +
      '<text x="' + C + '" y="' + (cy + 48) + '" text-anchor="middle" font-size="12" fill="currentColor" opacity=".5">клик — сыграть аккорд ▶</text>' +
      '</g>';
    s += '</svg>';
    const box = $('#x-svg');
    box.innerHTML = s;
    box.querySelectorAll('g[data-n]').forEach(g => g.addEventListener('click', () => {
      root = +g.dataset.n; // кругляшка активна: клик — новая тоника
      pluck(midiFreq(60 + root));
      saveUI('chroma', { root, q });
      drawRoots(); drawCheat(); drawSvg();
    }));
    box.querySelector('#x-center').addEventListener('click', () => {
      chordTones.forEach((pc, k) => pluck(midiFreq(60 + pc), k * 0.14, 0.85));
    });
  }

  drawRoots(); drawQuals(); drawCheat(); drawSvg();
}

/* ================= ИНСТРУМЕНТ: НАСТРОЙКИ ================= */

function renderSettings(el){
  el.innerHTML =
    '<h2>⚙️ Настройки</h2>' +
    '<div class="card">' +

      'и функцию <code>renderMy(el){…}</code>. Появится новая вкладка. Примеры смотри у соседей по массиву.</div>' +
    '</div>' +
    '<div class="card"><h3 style="margin-top:0">История версий</h3><ul class="ver-list">' +
      '<li><b>3.8.0</b> — 🎬 Суфлёр на вкладке «Песня»: кнопка рядом с «Играть песню» включает крупную строку-подсказку над «Твоей песней» — «сейчас: аккорд» огромным шрифтом (видно с дивана) + «дальше: C · G · Em» — очередь играет песню с начала в темпе песни, аккорды сменяются в ритм, строка плавно обновляется, список автопрокручивается за текущим аккордом (мягко, без рывков). «■» или конец песни — суфлёр выключается и сворачивается; повторное «🎬» — сначала списка. Клик по аккорду в списке при включённом суфлёре — продолжить с него. «▶ Играть песню» без суфлёра работает как раньше (в темпе песни).</li>' +
      '<li><b>3.7.0</b> — транспонирование песни ±полутон: в ряду «Твоя песня» кнопки «♭ −1» и «♯ +1» — одно нажатие сдвигает ВСЮ песню на полутон (каждый аккорд меняет тонику, тип сохраняется; тональность песни едет вместе с аккордами, лад не меняется — ступени I-IV-V не «поехали»); после сдвига сообщение «Песня теперь в …», а для песни из «✨ Сделай красиво» — к сводке дописывается «транспонирована в …»; при пустой песне кнопки серые; жми сколько нужно — циклично по 12 нотам. Гриф и «что играть» подхватывают сами (привязка «→ из песни»). В уроке «Транспонирование ±полутон» — шаг «в приложении» с переходом на кнопки.</li>' +
      '<li><b>3.6.0</b> — метроном ↔ песня: у песни ЕДИНЫЙ темп — ползунок «Темп» переехал в карточку «🎵 Твоя песня» (виден всегда); фон, «▶ Играть песню», «Арпеджио песни» и подсказки играют в темпе песни; «✨ Сделай красиво» приносит темп стиля в этот же ползунок. В метрономе: «⇩ Взять темп песни» (активна, когда песня не пуста) и тумблер «🔗 Автоматом» — включил, и метроном сам следует за темпом песни (поменял ползунок или стиль — метроном перестроился); под bpm — ярлык «темп песни: N», в «Песне» рядом с ползунком — «в метрономе: N» или «= метроном» при связи. Направление «метроном → песня» — только по кнопке. Всё сохраняется; петли нет — метроном песню молча не переписывает.</li>' +
      '<li><b>3.5.0</b> — бой/ритм-рисунки «D-DU-UDU» в метроном и фон: в метрономе под размером и делением — строка «Бой:» с чипами пресетов (Ровно, Четверти D-D-D-D-, Восьмёрки D-U, Универсальный D-DU-UDU, Регги-скип, Шаффл, Баллада-шестёрка — наборы сверены с курсом «Ритм и бой») и полем «Свой бой» из символов D/U/x/- (валидация, позиция = восьмая такта, бой циклится по длине такта); клетки такта с буквами подсвечиваются при игре; при бое деление долей отключается. У «▶ Фон» в «Песне» — выбор «Бой: как в метрономе / Ровно / пресеты»: щелчки и штрихи аккорда по паттерну (D — громкий штрих, U — лёгкий), бас на первой сильной доле; «Ровно» — фон как раньше. Всё сохраняется; без боя метроном и фон звучат как раньше.</li>' +
      '<li><b>3.4.0</b> — фиксы читаемости и слияние кругов: названия аккордов в «Твоей песне» теперь явным светлым цветом (читаемо в обеих темах); в стрипе «АККОРДЫ ПЕСНИ» на Грифе текущая карточка подсвечена оранжевой рамкой и подложкой + автопрокрутка к ней (в длинных песнях карточка больше не «за краем»); блок «лучшие для песни» не показывает «0 из N» — если аккорд не лежит ни в одной из тональностей песни, честно написано «заёмный» и показаны тональности самого аккорда; строка подсказки переименована в «Тональность твоей песни (по аккордам): …»; вкладки «Круг» и «Квинты» слиты в одну «🎡 Круги» (в доке 8 кнопок, всё внутри работает как работало).</li>' +
      '<li><b>3.3.0</b> — «Полный проход»: вылизаны все вкладки — Инструменты перестроены в 2 колонки на широком экране (тюнер+метроном / определитель+слушай меня); при смене вкладок скролл сбрасывается наверх (раньше за глазами тянулась позиция длинной вкладки — попадался «пустой экран»); проверены работоспособность всех кнопок/звуков, «всё в одном экране», дубли, подписи и согласованность с токенами v2.9.0 — остальное здорово, переделок не требовало.</li>' +
      '<li><b>3.2.0</b> — «🎧 Ютуб-джем» на Грифе (глазок «Ютуб», свёрнут в строку): играешь бэктрек с ютуба — программа подсказывает, ЧТО играть. Путь 1 «Вставь название» (офлайн): «E minor blues backing track 90 bpm» → «Ми минор → играй: ми-минорная пентатоника, блюзовая» + кнопки «Гамму на гриф» и «Собрать песню в этом ладу» (тональность и лад подставляются в «Сделай красиво»). Путь 2 «Вставь ссылку» — тягает название/описание через бесплатный ключ YouTube API (поле в ⚙️ Настройках; ключ хранится только в браузере и не попадает в бэкап/репозиторий). Путь 3 «🎧 Слушать вкладку» (Chrome/Edge) — звук вкладки ютуба анализируется: хромограмма → профиль Крумхансл → «Судя по звуку — Ля минор» + топ-3 рядом, пентатоника «на гриф», примерный BPM по пульсации громкости; индикация «слушаю… собрано N секунд». Честная подпись: ноты по одной из микса не выделяем — определяем тональность.</li>' +
      '<li><b>3.1.0</b> — ШКОЛА-100: раздел «База» вырос в библиотеку из 100 уроков по 7 курсам — «С нуля» (14), «Аккорды» (18), «Ритм и бой» (14), «Гаммы и лады» (16), «Техника» (14), «Теория» (16), «Песни и джем» (8). Уроки — данные (новый урок = одна строка справочника), список курса компактный (номер + название + ✓), раскрытие по клику; у нужных уроков кнопки «Показать на грифе» / «Послушать аккорд» / шаг «в приложении» с переходом. Прогресс: чипы курсов со счётчиками, полоса по курсу, общий «X из 100», первый непройденный — метка «→ следующий». Старая шестёрка уроков мигрировала в новые id. Практики/Лады/Теория не тронуты.</li>' +
      '<li><b>3.0.0</b> — ШКОЛА 2.0: вкладка «Лады» переехала в «Школу» (в доке 8 кнопок), внутри — четыре раздела чипами: «📘 База» (уроки для начинающих, прогресс сохранён), «🏋 Практики» — пять взрослых практик: «🎲 Гамма дня» (случайная тональность+гамма, «Открыть на грифе», счёт), «🎲 Лад дня» (случайный лад с его прогрессией, «▶ Фон» — бэктрек для импровизации + подсказка какой пентатоникой играть), «🕷 Техника» (хроматика 1-2-3-4 «паучок» под щелчки, темп настраивается), «👂 Слух» (угадай тип аккорда из 4 вариантов, счёт верных подряд и рекорд), «🔁 Смена аккордов» (случайная пара со схемами + метроном — переключайся в такт); «🧭 Лады» (таблица семи ладов с прослушиванием и «На гриф» + интервалы от всех 12 нот); «📖 Теория» — шпаргалки на человеческом: строение мажора/минора (Т-Т-П…), вся правда о квинтовом круге (как в видео-сериале) с кнопкой «Покрутить круг», характеры семи ладов, отсылка к интервалам. Практики и счёты сохраняются; вкладка-«Тренажёр» не возрождается — практики лёгкие и внутри Школы.</li>' +
      '<li><b>2.9.0</b> — визуальный релиз «Стройная» (по РЕВИЗИЯ-ВИЗУАЛА.md): каркас — контейнер 1680px (пустых полос по бокам нет), CSS-токены плотности и режим «Компакт/Обычный» в Настройках (по умолчанию Компакт), кнопки S/M/L, единые капс-заголовки блоков, нижний док — пилюля по ширине контента; Гриф — 3 компактные полосы вместо 4, гамма «кричит» (ступени яркие, посторонние бледные, тоника красная), «АККОРДЫ ПЕСНИ» + «ЧТО ИГРАТЬ» в две колонки; Песня — «Твоя песня» поднята, стена чипов заменена на топ тональностей с покрытием + свёрнутые «все варианты», «Какой взять дальше» свёрнуто, карточки аккордов компактнее; Школа — уроки в 2 колонки, тихий чип «✓ Пройдено», полоса прогресса; Духовые — «⚙️ СВОЙ СТРОЙ» свёрнут в строку-заголовок (раскрывается по клику и при клике по отверстию), схемы уже горизонтальным рядом.</li>' +
      '<li><b>2.8.0</b> — PWA: приложение можно установить на телефон/планшет как настоящее (иконка 🎸 на рабочий стол, работает офлайн). Подготовлена папка pwa/ — манифест, иконки 192/512 (512 ещё и maskable), service worker (HTML — network-first: новая версия доезжает на телефон; иконки/манифест — cache-first; имя кэша с версией), инструкция публикации RELEASE.md. Регистрация worker только по https — запуск двойным кликом (file://) не изменился ни на йоту. В ⚙️ Настройках подсказка: бэкап «мои-данные.json» так же переносит всё на телефон. Публикация в публичный репозиторий — по команде «публикуй» (RELEASE.md описывает шаги).</li>' +
      '<li><b>2.7.0</b> — «👂 Слушай меня» на вкладке «Инструменты» (после определителя): жми «▶ Слушать», играй по одной ноте перебором — крупно видно «сейчас слышу: A», каждая устойчивая нота (держится ~200 мс) сама добавляется в чипы и сразу попадает в определитель — перебрал струны, и он показал аккорд; клик по чипу — убрать ноту, «Сброс» — убрать все. Анти-дребезг: ловится одна самая громкая нота, шум и переходы не считаются, тишина — разделитель (ту же ноту можно услышать заново). Селект «Вход:» — выбор микрофона браузера (заполняется после первого разрешения; выбрал MiniFuse — гитара из него), выбор запоминается. Тюнер и «Слушай меня» делят ОДИН поток микрофона (оба могут быть включены сразу); уход со вкладки «Инструменты» глушит микрофон всегда (общий cleanup на корне вкладки — починено: раньше тюнер не глушался).</li>' +
      '<li><b>2.6.0</b> — «✨ Сделай красиво» на вкладке «Песня»: выбираешь стиль — программа сама собирает ВСЮ песню (случайная тональность, лад, прогрессия по ступеням, типы аккордов, темп); 10 стилей — Блюз (12-тактовая форма на септаккордах), Рок-н-ролл, Панк (пауэр-аккорды), Метал (фригийский i–♭II + подсказка про Drop D), Рэп (луп i–VI), Кантри, Поп (I–V–vi–IV), Фанк (вамп I7–IV7), Джаз (ii7–V7–Imaj7), Рок (i–♭VII–IV); после генерации — сводка «Ля минор · панк · i–VI · темп 170 · импровизируй: ля-минорная пентатоника», тональность и лад песни обновляются — гриф и блок «что играть» подхватывают сами; «🎲» пересобирает в другой тональности. «▶ Фон» — встроенный бэктрек: аккорды по тактам + бит щелчками + бас качает корень восьмыми; фон продолжает играть на вкладке «Гриф» (глобальный плеер), глушится кнопкой «■ Стоп фона» или новым «Сделай красиво». Стиль и темп сохраняются.</li>' +
      '<li><b>2.5.0</b> — новая вкладка «🧰 Инструменты» (вместо выключенных модулей-заготовок): ТЮНЕР (микрофон, автокорреляция, отклонение в центах — как был) и МЕТРОНОМ с честными размерами 2/4, 3/4, 4/4, 5/4, 6/8, 7/8, 9/8, 12/8 — первая доля сильная, начала групп средние, остальные тихие (6/8, 9/8, 12/8 — акценты группами по три, 7/8 — 2+2+3, 5/4 — на выбор 3+2 или 2+3); деление доли — четверти/восьмые/триоли/шестнадцатые (тихим щелчком); темп, размер, группировка и деление сохраняются. ОПРЕДЕЛИТЕЛЬ АККОРДОВ переехал из «Грифа» в «Инструменты»: свой мини-гриф (6 струн × 12 ладов, глобальный строй), клик по ноте — добавить/убрать, жёлтая заливка, «Это …» + альтернативы, ▶ Разом, ‡ Барре, Сброс; выбранные ноты сохраняются; с «Грифа» определитель убран совсем — гриф снова всегда показывает гамму/аккорд песни.</li>' +
      '<li><b>2.4.0</b> — флейта на грифе привязана к аккордам песни: выбрал аккорд — ноты на флейте перестроились под него (пентатоника/гамма/тоны этого аккорда, как на грифе), больше не «постоянно одни и те же ноты»; ряд управления песней (◀ ▶ ♪ Арпеджио + «на грифе: …») перенесён НАД аккорды и стал крупнее/читаемее.</li>' +
      '<li><b>2.3.2</b> — играющая нота фразы подсвечивается ПРЯМО на грифе: точка становится бирюзовой с лёгкой пульсацией (а не только кружок в дорожке сверху) — сразу видно, за какую ноту тянуться.</li>' +

  function renderRows(){

      editId = 'c' + Date.now();
      list.push({ id: editId, name, notes: [...editNotes] });
      settings.tuning = editId;
    }
    saveCustomTunings(list); saveSettings();
    $('#st-cust-edit').style.display = 'none';
    drawCustoms();
    const st = $('#st-tuning');
    st.innerHTML = tuningOptionsHTML(); st.value = settings.tuning;
    setTuning(settings.tuning);

  drawCustoms();

  const a4 = el.querySelector('#st-a4');
  a4.addEventListener('input', () => {
    settings.a4 = +a4.value;
    el.querySelector('#st-a4v').textContent = settings.a4;
    saveSettings();
  });
  el.querySelectorAll('[data-th]').forEach(b => b.addEventListener('click', () => {
    settings.theme = b.dataset.th; saveSettings();
    el.querySelectorAll('[data-th]').forEach(x => x.classList.toggle('on', x === b));
  }));
  el.querySelectorAll('[data-dn]').forEach(b => b.addEventListener('click', () => {
    settings.density = b.dataset.dn; saveSettings();
    el.querySelectorAll('[data-dn]').forEach(x => x.classList.toggle('on', x === b));
  }));
  const ytKeyInput = el.querySelector('#st-ytkey');
  if (ytKeyInput) ytKeyInput.addEventListener('change', () => {
    settings.youtubeKey = ytKeyInput.value.trim();

    el.querySelector('#st-ytkey-msg').textContent = settings.youtubeKey ? 'ключ сохранён (только в этом браузере)' : 'ключ удалён';
  });
  /* --- резервная копия данных: один JSON-файл, едет через git на все ПК --- */
  const DATA_KEYS = ['ga_settings', 'ga_custom_tunings'];
  function dataSnapshot(){
    const d = { _app: 'гитара-помощник', _ver: APP_VERSION };
    DATA_KEYS.forEach(k => { const v = store.get(k); if (v !== null && v !== undefined) d[k] = v; });
    if (d.ga_settings){ // секреты в бэкап не едем (правило Git №6): ключ YouTube остаётся только в браузере
      const s = Object.assign({}, d.ga_settings);
      delete s.youtubeKey;
      d.ga_settings = s;

  $('#st-export').addEventListener('click', () => {

    const a = document.createElement('a');

    a.download = 'мои-данные.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    $('#st-data-msg').innerHTML = 'Файл скачан (обычно в «Загрузки»). Перенеси его в папку проекта <code>проекты\\гитара-помощник\\</code> — автосейв закоммитит его в git, и на втором ПК он восстановится оттуда же.';
  });
  $('#st-import').addEventListener('click', () => {
    if (confirm('Восстановить из файла? Текущие настройки, строи и статистика будут заменены данными из файла.'))
      $('#st-import-file').click();
  });
  $('#st-import-file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';

    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        let n = 0;
        DATA_KEYS.forEach(k => { if (d[k] !== undefined){ store.set(k, d[k]); n++; } });
        if (!n) throw new Error('в файле нет данных приложения');
        $('#st-data-msg').textContent = 'Восстановлено блоков: ' + n + ' — обновляю страницу…';
        setTimeout(() => location.reload(), 800);
      } catch(err){
        $('#st-data-msg').textContent = 'Не получилось: ' + (err.message || err);

    };
    r.onerror = () => { $('#st-data-msg').textContent = 'Файл не прочитался.'; };
    r.readAsText(f);
  });

  el.querySelector('#st-clear-all').addEventListener('click', () => {
