nsole.cloud.google.com → create a project → APIs & Services → Library → YouTube Data API v3 → Enable → Credentials → API key. The key stays ONLY in this browser: it never enters backups or the repository.",uk:"Потрібен лише для кнопки «🌐 Тягнути назву» за посиланням (шлях 2 у блоці «🎧 Ютуб-джем» на Грифі). Безкоштовний ключ: console.cloud.google.com → створити проєкт → APIs & Services → Library → YouTube Data API v3 → Enable → Credentials → API key. Ключ зберігається ЛИШЕ у цьому браузері: у бекап і репозиторій він не потрапляє."},"set.customs.title":{ru:"Свои строи",en:"Custom tunings",uk:"Власні строї"},"set.customs.empty":{ru:"Пока нет своих строёв.",en:"No custom tunings yet.",uk:"Поки немає власних строїв."},"set.customs.name":{ru:"Название",en:"Name",uk:"Назва"},"set.customs.strings":{ru:"Струн",en:"Strings",uk:"Струн"},"set.customs.save":{ru:"Сохранить строй",en:"Save tuning",uk:"Зберегти стрій"},"set.customs.cancel":{ru:"Отмена",en:"Cancel",uk:"Скасувати"},"set.customs.new":{ru:"＋ Новый строй",en:"＋ New tuning",uk:"＋ Новий стрій"},"set.customs.hint":{ru:"Свой строй появится в списке на вкладке «Гриф» — и гриф сразу перестроится под него.",en:"Your tuning appears in the list on the Fretboard tab — and the fretboard re-tunes instantly.",uk:"Власний стрій з’явиться у списку на вкладці «Гриф» — і гриф одразу перебудується під нього."},"set.data.title":{ru:"Данные",en:"Data",uk:"Дані"},"set.data.hint":{ru:"Настройки, свои строи и статистика живут в браузере этого устройства. Резервная копия — один файл: положи «мои-данные.json» в папку проекта — автосейв утащит его в git, и на втором ПК «Восстановить» подхватит те же данные. Так же переносится всё на телефон/планшет: скачай копию здесь, открой приложение там и нажми «Восстановить».",en:"Settings, custom tunings and stats live in this device’s browser. The backup is one file: put «my-data.json» into the project folder — autosave commits it to git, and the other PC’s «Restore» picks it up. Same for phone/tablet: download a copy here, open the app there, press «Restore».",uk:"Налаштування, власні строї і статистика живуть у браузері цього пристрою. Резервна копія — один файл: поклади «мої-дані.json» у папку проєкту — автозбереження затягне його в git, а на другому ПК «Відновити» підтягне ті самі дані. Так само переноситься все на телефон/планшет: скачай копію тут, відкрий застосунок там і натисни «Відновити»."},"set.data.export":{ru:"💾 Скачать копию",en:"💾 Download copy",uk:"💾 Завантажити копію"},"set.data.import":{ru:"📂 Восстановить…",en:"📂 Restore…",uk:"📂 Відновити…"},"set.data.clear":{ru:"Сбросить всё",en:"Reset all",uk:"Скинути все"},"set.data.msg":{ru:"Файл скачан (обычно в «Загрузки»). Положи его в папку проекта рядом с этим HTML-файлом — автосейв закоммитит его в git, и на втором ПК он восстановится оттуда же.",en:"File downloaded (usually to «Downloads»). Put it into the project folder next to this HTML file — autosave commits it to git and the other PC restores it from there.",uk:"Файл завантажено (зазвичай у «Завантаження»). Поклади його в папку проєкту поруч із цим HTML-файлом — автозбереження закомітить його в git, і на другому ПК він відновиться звідти ж."},"set.dev.title":{ru:"Свой инструмент — как добавить",en:"Custom tool — how to add",uk:"Власний інструмент — як додати"},"set.dev.hint":{ru:"Открой этот файл в редакторе, найди массив TOOLS в конце скрипта и добавь строку: { id:'my', icon:'✨', title:'Моё', render:renderMy } — и функцию renderMy(el){…}. Появится новая вкладка. Примеры смотри у соседей по массиву.",en:"Open this file in an editor, find the TOOLS array at the end of the script and add a line: { id:'my', icon:'✨', title:'Mine', render:renderMy } — plus a renderMy(el){…} function. A new tab appears. See the neighbours in the array for examples.",uk:"Відкрий цей файл у редакторі, знайди масив TOOLS наприкінці скрипта й додай рядок: { id:'my', icon:'✨', title:'Моє', render:renderMy } — і функцію renderMy(el){…}. З’явиться нова вкладка. Приклади — у сусідів по масиву."},"news.title":{ru:"Что нового",en:"What's new",uk:"Що нового"},"news.git":{ru:"Полная история версий — в git (ПЛАН.md и коммиты).",en:"Full version history — in git (ПЛАН.md and commits).",uk:"Повна історія версій — у git (ПЛАН.md і коміти)."},"news.3290":{ru:"«Что нового» теперь только последние 5 версий одной строкой; полная история — в git.",en:"«What’s new» now keeps only the last 5 versions, one line each; the full history is in git.",uk:"«Що нового» тепер лише останні 5 версій одним рядком; повна історія — у git."},"news.3310":{ru:"каркас локализации RU/EN/UK: переключатель «Язык» в Настройках — шапка, «Что нового» и Настройки переводятся живьём (данные — позже по блокам).",en:"RU/EN/UK localisation skeleton: a «Language» switch in Settings — header, «What’s new» and Settings translate live (content — later in blocks).",uk:"каркас локалізації RU/EN/UK: перемикач «Мова» в Налаштуваннях — шапка, «Що нового» і Налаштування перекладаються живцем (дані — пізніше по блоках)."},"news.3320":{ru:"вкладка «Гриф» переведена на каркас локализации (управление, глазки, ютуб-джем, запись, стрипы, фраза) — RU/EN/UK живьём.",en:"the Fretboard tab is localised (controls, eye-toggles, YouTube jam, recording, strips, phrase) — RU/EN/UK live.",uk:"вкладка «Гриф» переведена на каркас локалізації (керування, «очі», ютуб-джем, запис, стріпи, фраза) — RU/EN/UK живцем."},"news.3330":{ru:"вкладка «Песня» переведена на каркас локализации: «Сделай красиво» (кнопки/сводка/происхождение), «Твоя песня», транспонирование, суфлёр, карточки лада; tips стилей — RU/EN/UK.",en:"the Song tab is localised: «Make it pretty» (buttons/summary/origin), «Your song», transpose, prompter, key cards; style tips — RU/EN/UK.",uk:"вкладка «Пісня» переведена на каркас локалізації: «Зроби гарно» (кнопки/зведення/походження), «Твоя пісня», транспонування, суфлер, картки ладу; tips стилів — RU/EN/UK."},"news.3340":{ru:"вкладка «Инструменты» переведена: тюнер, метроном (размер/группировка/деление/т на; дані і LESSONS — окремі етапи."},"news.3380":{ru:"переведены все 115 уроков Школы на EN и UK (LESSONS_L10N — отдельный словарь с fallback на RU): названия, тексты и шаги «в приложении» — Школа теперь полностью RU/EN/UK.",en:"all 115 School lessons are translated into EN and UK (LESSONS_L10N — a separate dictionary with RU fallback): titles, texts and in-app steps — the School is now fully RU/EN/UK.",uk:"перекладено всі 115 уроків Школи на EN і UK (LESSONS_L10N — окремий словник із fallback на RU): назви, тексти й кроки «у застосунку» — Школа тепер повністю RU/EN/UK."},"news.3390":{ru:"словарь музыканта и типовые формы песни в Теории переведены на EN и UK (GLOSSARY_L10N/SONG_FORMS_L10N, fallback RU) — при смене языка переводится всё.",en:"the musician’s glossary and the song forms in Theory are translated into EN and UK (GLOSSARY_L10N/SONG_FORMS_L10N, RU fallback) — switching the language now translates everything.",uk:"словник музиканта й типові форми пісні в Теорії перекладено на EN і UK (GLOSSARY_L10N/SONG_FORMS_L10N, fallback RU) — під час зміни мови перекладається все."},"news.3400":{ru:"названия вкладок и кнопка ⚙️ переводятся при смене языка (nav перестраивается), Настройки дочищены: чипы темы/плотности/звука, редактор своего строя, ключ ютуба, бэкап (confirm/сообщения/имя файла) — всё через T.",en:"tab names and the ⚙️ button now follow the language (nav rebuilds), Settings finished: theme/density/sound chips, custom-tuning editor, YouTube key, backup (confirm/messages/file name) — all via T.",uk:"назви вкладок і кнопка ⚙️ перекладаються під час зміни мови (nav перебудовується), Налаштування довершено: чіпи теми/щільності/звуку, редактор власного строю, ключ ютуба, бекап (confirm/повідомлення/імʼя файла) — все через T."},"news.3410":{ru:"данные Инструментов переведены: строи (группы и имена, «Мои строи»), пресеты боя, названия типов аккордов (определитель/конструктор/прогрессии/хроматический круг), сольфеджио на круге и в сводке (EN — C/D/E, UK — до/ре/мі d unavailable in this browser — «Classic» enabled",uk:"Реалістичний звук недоступний у цьому браузері — увімкнено «Класику»"},"tab.fret":{ru:"Гриф",en:"Fretboard",uk:"Гриф"},"tab.circles":{ru:"Круги",en:"Circles",uk:"Круги"},"tab.prog":{ru:"Прогрессии",en:"Progressions",uk:"Прогресії"},"tab.chords":{ru:"Аккорды",en:"Chords",uk:"Аккорди"},"tab.song":{ru:"Песня",en:"Song",uk:"Пісня"},"tab.school":{ru:"Школа",en:"School",uk:"Школа"},"tab.wind":{ru:"Духовые",en:"Winds",uk:"Духові"},"tab.tools":{ru:"Инструменты",en:"Tools",uk:"Інструменти"},"hdr.settings":{ru:"Настройки",en:"Settings",uk:"Налаштування"},"fret.title":{ru:"🎼 Гриф и гаммы",en:"🎼 Fretboard & scales",uk:"🎼 Гриф і гами"},"fret.tuning":{ru:"Строй",en:"Tuning",uk:"Стрій"},"fret.frets":{ru:"Ладов",en:"Frets",uk:"Ладів"},"fret.labels":{ru:"Подписи",en:"Labels",uk:"Підписи"},"fret.labels.notes":{ru:"ноты",en:"notes",uk:"ноти"},"fret.labels.deg":{ru:"ступени",en:"degrees",uk:"ступені"},"fret.labels.none":{ru:"без",en:"none",uk:"без"},"fret.ovclear":{ru:"✕ аккорд",en:"✕ chord",uk:"✕ акорд"},"fret.ovclear.title":{ru:"Убрать аккорд с грифа",en:"Remove chord from fretboard",uk:"Прибрати акорд з грифа"},"fret.tonic":{ru:"Тоника",en:"Tonic",uk:"Тоніка"},"fret.scale":{ru:"Гамма",en:"Scale",uk:"Гама"},"fret.scale.grpWorld":{ru:"Мировые и бибоп",en:"World & bebop",uk:"Світові та бібоп"},"fret.pos":{ru:"Позиция",en:"Position",uk:"Позиція"},"fret.pos.all":{ru:"вся гамма",en:"whole scale",uk:"вся гама"},"fret.pos.fret":{ru:" (поз.)",en:" (pos.)",uk:" (поз.)"},"fret.pos.box":{ru:" (бокс)",en:" (box)",uk:" (бокс)"},"fret.drone":{ru:"🔊 Фон-тоника",en:"🔊 Tonic drone",uk:"🔊 Фон-тоніка"},"fret.drone.title":{ru:"Зацикленный фон-тон: нота тоника звучит без конца — играй поверх гамму. Так тренируют импровизацию. Клавиша D",en:"Looped tonic drone: the note rings endlessly — jam the scale over it. That’s how improvisation is trained. Key D",uk:"Зациклений фон-тон: нота тоніка звучить без кінця — грай поверх гаму. Так тренують імпровізацію. Клавіша D"},"fret.play":{ru:"▶ Проиграть",en:"▶ Play up",uk:"▶ Програти"},"fret.play.title":{ru:"Проиграть вверх от тоники — клавиша Пробел",en:"Play up from the tonic — Space",uk:"Програти вгору від тоніки — Пробіл"},"fret.link.adopt":{ru:"⛓ Привязать",en:"⛓ Link",uk:"⛓ Прив’язати"},"fret.link.adopt.title":{ru:"Привязать гриф к песне: тональность и лад будут приходить от неё",en:"Link the fretboard to the song: key and mode will come from it",uk:"Прив’язати гриф до пісні: тональність і лад приходитимуть від неї"},"fret.link.unlink":{ru:"🔗 Отвязать",en:"🔗 Unlink",uk:"🔗 Відв’язати"},"fret.link.unlink.title":{ru:"Отвязать гриф от песни — гамма на грифе станет независимой",en:"Unlink the fretboard — the scale becomes independent",uk:"Відв’язати гриф від пісні — гама на грифі стане незалежною"},"fret.link.from":{ru:"→ из песни: ",en:"→ from song: ",uk:"→ з пісні: "},"fret.flute":{ru:"🪈 Флейта: ",en:"🪈 Flute: ",uk:"🪈 Флейта: "},"fret.flute.title":{ru:"Показать флейту с гаммой от тоники и лада грифа",en:"Show the flute with the scale of the fretboard’s tonic and mode",uk:"Показати флейту з гамою від тоніки і ладу грифа"},"fret.on":{ru:"вкл",en:"on",uk:"увімк"},"fret.off":{ru:"выкл",en:"off",uk:"вимк"},"fret.poshint":{ru:"лады {a}–{b}",en:"frets {a}–{b}",uk:"лади {a}–{b}"},"fret.hints.title":{ru:"Подсказки и горячие клавиши",en:"Hints & hotkeys",uk:"Підказки та гарячі клавіші"},"fret.hints.body":{ru:'Клик по ноте — она прозвучит. <b style="color:var(--bad)">Красная точка</b> — тоника (главная нота), оранжевые — ноты аккорда, бирюзовая дорожка сверху — фраза.<br><b>🔊 Фон-тоника (дрон)</b> — зацикленная тоника: нота тянется без конца, играешь поверх гамму. Так тренируют импровизацию.<br><b>Определитель аккордов</b> переехал во вкладку «🧰 Инструменты» — там свой мини-гриф, кликай ноты там.<br><b>Фраза</b> (правый бокс): клик по ноте — вкл/выкл, клик по значку длительности — изменить её (♪ ♩ —), ✕ — удалить, «+ Пауза» — пауза в мелодии, 🔁 — по кругу.<br>Горячие клавиши: <b>Пробел</b> — проиграть, <b>D</b> — фон-тоника, <b>←/→</b> — тоника, <b>, / .</b> — аккорды песни, <b>1–7</b> — позиция. Свои строи — в ⚙️ Настройках.',en:'Click a note to hear it. <b style="color:var(--bad)">The red dot</b> is the tonic (the home note), orange are chord tones, the teal track on top is the phrase.<br><b>🔊 Tonic drone</b> — the tonic loops forever; jam the scale over it. That’s how improvisation is trained.<br><b>The chord detector</b> moved to the «🧰 Tools» tab — it has its own mini-fretboard there.<br><b>Phrase</b> (right panel): click a note to mute it, the duration icon to change it (♪ ♩ —), ✕ to delete, «+ Rest» for a pause, 🔁 to loop.<br>Hotkeys: <b>Space</b> play, <b>D</b> drone, <b>←/→</b> tonic, <b>, / .</b> song chords, <b>1–7</b> position. Custom tunings — in ⚙️ Settings.',uk:'Клік по ноті — вона прозвучить. <b style="color:var(--bad)">Червона точка</b> — тоніка (головна нота), оранжеві — ноти акорду, бірюзова доріжка зверху — фраза.<br><b>🔊 Фон-тоніка (дрон)</b> — зациклена тоніка: нота тягнеться без кінця, грай поверх гаму. Так тренують імпровізацію.<br><b>Визначник акордів</b> переїхав у вкладку «🧰 Інструменти» — там свій міні-гриф, клікай ноти там.<br><b>Фраза</b> (правий бокс): клік по ноті — увімк/викл, клік по іконці тривалості — змінити її (♪ ♩ —), ✕ — видалити, «+ Пауза» — пауза в мелодії, 🔁 — по колу.<br>Гарячі клавіші: <b>Пробіл</b> — програти, <b>D</b> — фон-тоніка, <b>←/→</b> — тоніка, <b>, / .</b> — акорди пісні, <b>1–7</b> — позиція. Власні строї — в ⚙️ Налаштуваннях.'},"yt.title":{ru:"🎧 ЮТУБ-ДЖЕМ — узнаю, что играть под бэктрек с ютуба",en:"🎧 YOUTUBE JAM — what to play over a YouTube backing track",uk:"🎧 ЮТУБ-ДЖЕМ — що грати під бектрек з ютуба"},"yt.p1":{ru:"<b>Путь 1 — вставь название текстом</b> (работает всегда и офлайн):",en:"<b>Path 1 — paste the title as text</b> (works always, offline):",uk:"<b>Шлях 1 — встав назву текстом</b> (працює завжди і офлайн):"},"yt.p1.ph":{ru:"Например: E minor blues backing track 90 bpm",en:"e.g. E minor blues backing track 90 bpm",uk:"Наприклад: E minor blues backing track 90 bpm"},"yt.parse":{ru:"🎯 Разобрать",en:"🎯 Parse",uk:"🎯 Розібрати"},"yt.p2":{ru:"<b>Путь 2 — вставь ссылку</b> (нужен бесплатный ключ YouTube API — в ⚙️ Настройках):",en:"<b>Path 2 — paste a link</b> (needs a free YouTube API key — in ⚙️ Settings):",uk:"<b>Шлях 2 — встав посилання</b> (потрібен безкоштовний ключ YouTube API — у ⚙️ Налаштуваннях):"},"yt.p2.ph":{ru:"Ссылка на видео с ютуба",en:"YouTube video link",uk:"Посилання на відео з ютуба"},"yt.fetch":{ru:"🌐 Тянуть название",en:"🌐 Fetch title",uk:"🌐 Тягнути назву"},"yt.p3":{ru:"<b>Путь 3 — 🎧 слушать вкладку</b> (Chrome/Edge): выбери вкладку ютуба С ЗВУКОМ — определю тональность по звуку:",en:"<b>Path 3 — 🎧 listen to a tab</b> (Chrome/Edge): pick the YouTube tab WITH SOUND — I’ll detect the key by ear:",uk:"<b>Шлях 3 — 🎧 слухати вкладку</b> (Chrome/Edge): обери вкладку ютуба З ЗВУКОМ — визначу тональність по звуку:"},"yt.listen":{ru:"🎧 Слушать вкладку",en:"🎧 Listen to tab",uk:"🎧 Слухати вкладку"},"yt.stop":{ru:"■ Стоп",en:"■ Stop",uk:"■ Стоп"},"yt.honest":{ru:"Честно: ноты по одной из целого микса не выделяем — определяем тональность (и примерный темп) и подбираем, что играть.",en:"Honest: we don’t pick single notes out of the mix — we detect the key (and rough tempo) and suggest what to play.",uk:"Чесно: ноти по одній з цілого міксу не виділяємо — визначаємо тональність (і прикладний темп) і підбираємо, що грати."},"yt.fail.parse":{ru:"не разобрал — укажи тональность словами, например «E minor blues backing track 90 bpm»",en:"couldn’t parse — name the key in words, e.g. «E minor blues backing track 90 bpm»",uk:"не розібрав — вкажи тональність словами, наприклад «E minor blues backing track 90 bpm»"},"yt.needkey":{ru:"нужен бесплатный ключ YouTube API — возьми в ⚙️ Настройках (там короткая инструкция)",en:"needs a free YouTube API key — grab one in ⚙️ Settings (short instructions there)",uk:"потрібен безкоштовний ключ YouTube A :"⏱️ Metronome",uk:"⏱️ Метроном"},"metro.bpm":{ru:"уд./мин",en:"bpm",uk:"уд./хв"},"metro.tap":{ru:"Tap-темп",en:"Tap tempo",uk:"Тап-темп"},"metro.take":{ru:"⇩ Взять темп песни",en:"⇩ Take song tempo",uk:"⇩ Взяти темп пісні"},"metro.take.title":{ru:"Взять темп песни в метроном",en:"Copy the song tempo into the metronome",uk:"Взяти темп пісні в метроном"},"metro.auto":{ru:"🔗 Автоматом",en:"🔗 Auto",uk:"🔗 Автоматично"},"metro.auto.title":{ru:"Метроном сам следует за темпом песни",en:"The metronome follows the song tempo by itself",uk:"Метроном сам слідує за темпом пісні"},"metro.size":{ru:"Размер ",en:"Meter ",uk:"Розмір "},"metro.group":{ru:"Группировка ",en:"Grouping ",uk:"Групування "},"metro.sub":{ru:"Деление ",en:"Subdivision ",uk:"Поділ "},"metro.sub.q":{ru:"четверти",en:"quarters",uk:"чверті"},"metro.sub.e":{ru:"восьмые",en:"eighths",uk:"восьмі"},"metro.sub.t":{ru:"триоли",en:"triplets",uk:"тріолі"},"metro.sub.s":{ru:"шестнадцатые",en:"sixteenths",uk:"шістнадцяті"},"metro.bars":{ru:"Тактов ",en:"Bars ",uk:"Тактів "},"metro.bars.title":{ru:"Играть N тактов и остановиться (для разминки/упражнения)",en:"Play N bars and stop (for warm-ups)",uk:"Грати N тактів і зупинитися (для розминки)"},"metro.strum":{ru:"Бой:",en:"Strum:",uk:"Бій:"},"metro.strum.ph":{ru:"Свой: D-DU-UDU",en:"Custom: D-DU-UDU",uk:"Свій: D-DU-UDU"},"metro.strum.title":{ru:"Символы: D — вниз (громко), U — вверх (тише), x — глушёный, - — пауза. Один символ = восьмая такта, бой циклится по длине такта.",en:"Symbols: D — down (loud), U — up (soft), x — muted, - — rest. One symbol = an eighth of the bar; the pattern loops over the bar length.",uk:"Символи: D — вниз (гучно), U — вгору (тихіше), x — приглушений, - — пауза. Один символ = восьма такту, бій циклиться за довжиною такту."},"metro.start":{ru:"▶ Старт",en:"▶ Start",uk:"▶ Старт"},"metro.stop":{ru:"■ Стоп",en:"■ Stop",uk:"■ Стоп"},"metro.bar":{ru:"такт <b>{a}{b}</b>",en:"bar <b>{a}{b}</b>",uk:"такт <b>{a}{b}</b>"},"metro.songbpm":{ru:"темп песни: {b}",en:"song tempo: {b}",uk:"темп пісні: {b}"},"metro.hint":{ru:"Первая доля такта — сильный акцент, начала групп — средние, остальные — тихие. Размер — ЕДИНЫЙ: от него играют метроном, фон, проигрыш песни/суфлёр, генераторы и практики (в 6/8 счёт «1-2-3-ЧЕТЫРЕ-5-6» — две большие доли по три). «Тактов: N» — играть N тактов и остановиться (для разминки). Бой превращает щелчки в ритм-рисунок: D — вниз (громко), U — вверх (тише), x — глушёный, «-» — пауза; позиция символа = восьмая такта, бой циклится по длине такта (деление долей при бое не работает). Набирай темп кнопкой «Tap-темп» в ритме песни.",en:"The first beat of the bar is the strong accent, group starts are medium, the rest are soft. The meter is SINGLE: metronome, backing, song playback/prompter, generators and practices all follow it (in 6/8 the count is «1-2-3-FOUR-5-6» — two big beats of three). «Bars: N» — play N bars and stop. The strum turns clicks into a rhythm pattern: D — down (loud), U — up (soft), x — muted, «-» — rest; a symbol = an eighth of the bar, the pattern loops over the bar length (subdivision doesn’t work during strum). Build tempo with «Tap tempo».",uk:"Перша частка такту — сильний акцент, початки груп — середні, решта — тихі. Розмір — ЄДИНИЙ: від нього грають метроном, фон, програвання пісні/суфлер, генератори і практики (у 6/8 рахунок «1-2-3-ЧОТИРИ-5-6» — дві великі частки по три). «Тактів: N» — грати N тактів і зупинитися (для розминки). Бій перетворює клацання в ритм-малюнок: D — вниз (гучно), U — вгору (тихіше), x — приглушений, «-» — пауза; позиція символа = восьма такту, бій циклиться за довжиною такту (поділ часток при бою не працює). Набирай темп кнопкою «Тап-темп» в ритмі пісні."},"metro.slot":{ru:"Слот {n}",en:"Slot {n}",uk:"Слот {n}"},"metro.beat":{ru:"Доля {n}",en:"Beat {n}",uk:"Частка {n}"},"det.title":{ru:"🎼 Определитель аккордов",en:"🎼 Chord detector",uk:"🎼 Визначник акордів"},"det.hint":{ru:"Кликай ноты на мини-грифе (строй — глобальный, из ⚙️ Настройках): программа пока рати всі почуті ноти з визначника"},"lis.input":{ru:"Вход: ",en:"Input: ",uk:"Вхід: "},"lis.input.def":{ru:"— микрофон по умолчанию —",en:"— default microphone —",uk:"— мікрофон за замовчуванням —"},"lis.input.entry":{ru:"вход {n}",en:"input {n}",uk:"вхід {n}"},"lis.now":{ru:"сейчас слышу:",en:"now hearing:",uk:"зараз чую:"},"lis.empty":{ru:"пока ничего не услышал — включи «▶ Слушать» и сыграй ноту",en:"nothing heard yet — turn on «▶ Listen» and play a note",uk:"поки нічого не почув — увімкни «▶ Слухати» і зіграй ноту"},"lis.chip.title":{ru:"Клик — убрать из определителя",en:"Click — remove from the detector",uk:"Клік — прибрати з визначника"},"lis.hint":{ru:"играй по одной ноте — перебором; весь аккорд разом слушалка научится позже.<br>Услышанные ноты сразу попадают в определитель выше — перебрал струны, и он показал аккорд.",en:"play one note at a time — full chords at once come later.<br>Heard notes go straight into the detector above — pick the strings and it shows the chord.",uk:"грай по одній ноті — перебором; весь акорд разом слухалка навчиться пізніше.<br>Почуті ноти одразу потрапляють у визначник вище — перебрав струни, і він показав акорд."},"lis.dest":{ru:"🎧 слышанные ноты складывать:",en:"🎧 put heard notes into:",uk:"🎧 почуті ноти складати:"},"lis.dest.det":{ru:"в определитель",en:"the detector",uk:"у визначник"},"lis.dest.phrase":{ru:"во фразу (на грифе)",en:"the phrase (on the fretboard)",uk:"у фразу (на грифі)"},"lis.dest.both":{ru:"в оба",en:"both",uk:"в обидва"},"lis.nomicro":{ru:"микрофон недоступен: ",en:"microphone unavailable: ",uk:"мікрофон недоступний: "},"qt.title":{ru:"🔄 Квинты — круг тональностей",en:"🔄 Fifths — the key circle",uk:"🔄 Квінти — круг тональностей"},"qt.keys.maj":{ru:" мажор · ",en:" major · ",uk:" мажор · "},"qt.keys.min":{ru:" минор",en:" minor",uk:" мінор"},"qt.chords.hint":{ru:"Аккорды тональности — нажми, чтобы открыть аппликатуру:",en:"Key chords — click to open a fingering:",uk:"Акорди тональності — натисни, щоб відкрити аплікатуру:"},"qt.six.title":{ru:"🎯 6 аккордов для песни",en:"🎯 6 chords for a song",uk:"🎯 6 акордів для пісні"},"qt.six.hint":{ru:"Тональность + 2 соседа + их минорные напарники — этого хватает для песни:",en:"The key + 2 neighbours + their minor partners — enough for a song:",uk:"Тональність + 2 сусіди + їхні мінорні партнери — цього вистачає для пісні:"},"qt.scale.title":{ru:"Гамма на грифе",en:"Scale on the fretboard",uk:"Гама на грифі"},"qt.scale.maj":{ru:"Мажор на грифе",en:"Major on fretboard",uk:"Мажор на грифі"},"qt.scale.min":{ru:"Минор на грифе",en:"Minor on fretboard",uk:"Мінор на грифі"},"qt.prog.title":{ru:"Прогрессии",en:"Progressions",uk:"Прогресії"},"qt.prog.hint":{ru:"Готовые последовательности — откроются на вкладке «Прогрессии» в этой тональности:",en:"Ready-made sequences — they open on the Progressions tab in this key:",uk:"Готові послідовності — відкриються на вкладці «Прогресії» в цій тональності:"},"qt.arrows.title":{ru:"Стрелки на круге",en:"Arrows on the circle",uk:"Стрілки на крузі"},"qt.arrows.hint":{ru:"Оранжевые стрелки от тоники — типичные переходы: по часовой → V (доминанта), против часовой → IV (кварта вверх), внутрь круга → параллельный минор (vi). Классическое разрешение — обратный ход V → I.",en:"Orange arrows from the tonic — typical moves: clockwise → V (dominant), counter-clockwise → IV (fourth up), into the circle → parallel minor (vi). The classic resolution is the reverse V → I.",uk:"Помаранчеві стрілки від тоніки — типові переходи: за годинниковою → V (домінанта), проти годинникової → IV (кварта вгору), всередину круга → паралельний мінор (vi). Класичне вирішення — зворотний хід V → I."},"qt.cheat.title":{ru:"📌 Шпаргалка — вся правда о квинтовом круге",en:"📌 Cheat sheet — the whole truth about the circle of fifths",uk:"📌 Шпаргалка — вся правда про квінтовий круг"},"qt.cheat.step":{ru:"<b>Шагаем по циферблату не на 1 час, а на 7 (квинта):</b> C → G → D → A → E → B → F♯ → D♭ → A♭ → E♭ → B♭ → F → C.<br>",en:"<b>Step around the dial not by 1 hour but by 7 (a fifth):</b> C → G → D → A → E → B → F♯ → D♭ → A♭ → E♭ → B♭ → F → C.<br>",uk:"<b>Крокуємо за циферблатом не на 1 годину, а на 7 (квінта):</b> C → G → D → A → E → B → F♯ → D♭ → A♭ → E♭ → B♭ → F → C.<br>"},"qt.cheat.sharp":{ru:"<b>По часовой — +1 диез:</b> G (1♯), D (2♯), A (3♯), E (4♯)…<br>",en:"<b>Clockwise — +1 sharp:</b> G (1♯), D (2♯), A (3♯), E (4♯)…<br>",uk:"<b>За годинниковою — +1 дієз:</b> G (1♯), D (2♯), A (3♯), E (4♯)…<br>"},"qt.cheat.flat":{ru:"<b>Против часовой — +1 бемоль:</b> F (1♭), B♭ (2♭), E♭ (3♭), A♭ (4♭)…<br>",en:"<b>Counter-clockwise — +1 flat:</b> F (1♭), B♭ (2♭), E♭ (3♭), A♭ (4♭)…<br>",uk:"<b>Проти годинникової — +1 бемоль:</b> F (1♭), B♭ (2♭), E♭ (3♭), A♭ (4♭)…<br>"},"qt.cheat.main":{ru:"<b>Главное:</b> тональность + 2 соседа + их минорные напарники = 6 аккордов для песни.<br>",en:"<b>The main thing:</b> a key + 2 neighbours + their minor partners = 6 chords for a song.<br>",uk:"<b>Головне:</b> тональність + 2 сусіди + їхні мінорні партнери = 6 акордів для пісні.<br>"},"qt.cheat.ex":{ru:"Пример, {k} мажор: {chords}.<br>",en:"Example, {k} major: {chords}.<br>",uk:"Приклад, {k} мажор: {chords}.<br>"},"qt.cheat.neigh":{ru:"<b>Соседи</b> на круге отличаются одной нотой — переход между ними почти незаметен.<br>",en:"<b>Neighbours</b> on the circle differ by one note — the move between them is almost invisible.<br>",uk:"<b>Сусіди</b> на крузі відрізняються однією нотою — перехід між ними майже непомітний.<br>"},"qt.cheat.home":{ru:"<b>{a} → {b}</b> звучит как возвращение домой: так часто заканчивают куплет, припев или всю песню.",en:"<b>{a} → {b}</b> sounds like coming home: that’s how verses, choruses and whole songs often end.",uk:"<b>{a} → {b}</b> звучить як повернення додому: так часто закінчують куплет, приспів або всю пісню."},"chroma.title":{ru:"⏰ Хроматический круг — 12 часов, 1 час = полутон",en:"⏰ Chromatic circle — 12 hours, 1 hour = a semitone",uk:"⏰ Хроматичний круг — 12 годин, 1 година = півтон"},"chroma.hint":{ru:"12 нот = 12 часов циферблата · 1 час = полутон. Клик по ноте — прозвучит, клик по имени аккорда в центре — сыграть всё трезвучие.",en:"12 notes = 12 clock hours · 1 hour = a semitone. Click a note to hear it, click the chord name in the centre to play the whole triad.",uk:"12 нот = 12 годин циферблата · 1 година = півтон. Клік по ноті — прозвучить, клік по імені акорда в центрі — зіграти все тризвук."},"chroma.cheat.title":{ru:"📌 Шпаргалка — вся правда о трезвучиях",en:"📌 Cheat sheet — the whole truth about triads",uk:"📌 Шпаргалка — вся правда про тризвуки"},"chroma.steps":{ru:"Считай часы от тоники: первый шаг — терция аккорда, второй — квинта, третья сторона всегда замыкает круг до тоники. Клик по формуле — показать на круге. Остальные виды аккордов — чипами над кругом: у септаккордов контур четырёхугольный, стрелки ведут через каждую ступень.",en:"Count hours from the tonic: the first step is the chord’s third, the second is the fifth, the third side always closes the circle back to the tonic. Click a formula to show it on the circle. Other chord types — via the chips above the circle: sevenths have a four-sided outline with arrows through every degree.",uk:"Рахуй години від тоніки: перший крок — терція акорда, другий — квінта, третя сторона завжди замикає круг до тоніки. Клік по формулі — показати на крузі. Інші види акордів — чіпами над кругом: у септакордів контур чотирикутний, стрілки ведуть через кожен ступінь."},"prog.title":{ru:"🎶 Прогрессии аккордов",en:"🎶 Chord progressions",uk:"🎶 Прогресії акордів"},"prog.presets":{ru:"Пресеты — все лады сразу, кликни любой",en:"Presets — all modes at once, click any",uk:"Пресети — всі лади одразу, клікни будь-який"},"prog.hint":{ru:"Нажми на аккорд в последовательности — прозвучит. «▶ Играть» — последовательность (удар по аккорду каждые 0,9 c). «На грифе» — показать тоны аккорда на грифе в режиме тоны. ✚ — добавить аккорд в песню (или «✚ Прогрессия в песню» — все аккорды разом, во вкладке «🎵 Песня»).",en:"Click a chord in the sequence to hear it. «▶ Play» — the sequence (a chord hit every 0.9 s). «On fretboard» — show the chord tones on the fretboard in tones mode. ✚ — add a chord to the song (or «✚ Progression to song» — all chords at once, on the «🎵 Song» tab).",uk:"Натисни на акорд у послідовності — прозвучить. «▶ Грати» — послідовність (удар по акорду кожні 0,9 с). «На грифі» — показати тони акорда на грифі в режимі тони. ✚ — додати акорд у пісню (або «✚ Прогресія в пісню» — всі акорди разом, у вкладці «🎵 Пісня»)."},"prog.play":{ru:"▶ Играть последовательность",en:"▶ Play sequence",uk:"▶ Грати послідовність"},"prog.stop":{ru:"⏹ Стоп",en:"⏹ Stop",uk:"⏹ Стоп"},"prog.tosong":{ru:"✚ Прогрессия в песню",en:"✚ Progression to song",uk:"✚ Прогресія в пісню"},"prog.tosong.title":{ru:"Добавить ВСЕ аккорды прогрессии в песню (вкладка «Песня»)",en:"Add ALL progression chords to the song («Song» tab)",uk:"Додати ВСІ акорди прогресії в пісню (вкладка «Пісня»)"},"prog.add.title":{ru:"Добавить аккорд в песню",en:"Add the chord to the song",uk:"Додати акорд у пісню"},"prog.added":{ru:"Добавил в песню: {n}",en:"Added to the song: {n}",uk:"Додав у пісню: {n}"},"prog.onfret":{ru:"На грифе",en:"On fretboard",uk:"На грифі"},"prog.hear.title":{ru:"Нажми — прозвучит",en:"Click to hear it",uk:"Натисни — прозвучить"},"ch.title":{ru:"🎸 Аккорды",en:"🎸 Chords",uk:"🎸 Акорди"},"ch.overview":{ru:"Обзор:",en:"Overview:",uk:"Огляд:"},"ch.view.types":{ru:"все типы от ноты",en:"all types of a note",uk:"усі типи від ноти"},"ch.view.roots":{ru:"все ноты одного типа",en:"all notes of one type",uk:"усі ноти одного типу"},"ch.view.one":{ru:"по одному",en:"one by one",uk:"по одному"},"ch.type":{ru:"Тип ",en:"Type ",uk:"Тип "},"ch.hint.types":{ru:"Выше все типы выбранной ноты — кликни любую, она прозвучит. Ноту меняют чипы или ←/→.",en:"Above — all types of the selected note; click any to hear it. Change the note with the chips or ←/→.",uk:"Вище всі типи вибраної ноти — клікни будь-яку, вона прозвучить. Ноту змінюють чіпи або ←/→."},"ch.hint.roots":{ru:"Все 12 нот выбранного типа. Тип меняется ↑/↓ или селектом… ой, он скрыт — переключись на «по одному» или жми ↑/↓.",en:"All 12 notes of the selected type. Change the type with ↑/↓ or the select… oops, it’s hidden — switch to «one by one» or use ↑/↓.",uk:"Усі 12 нот вибраного типу. Тип змінюється ↑/↓ або селектом… ой, він схований — переключись на «по одному» або тисни ↑/↓."},"ch.hint.one":{ru:"Классический вид: одна нота, один тип, все варианты аппликатуры.",en:"The classic view: one note, one type, all fingering variants.",uk:"Класичний вигляд: одна нота, один тип, усі варіанти аплікатури."},"ch.keys":{ru:"Цифры на точках — пальцы (барре = 1). Горячие клавиши: <b>←/→</b> — нота, <b>↑/↓</b> — тип (в режиме «по одному»), <b>Пробел</b> — арпеджио первой схемы.",en:"The digits on dots are fingers (barre = 1). Hotkeys: <b>←/→</b> — note, <b>↑/↓</b> — type (in «one by one»), <b>Space</b> — arpeggio of the first shape.",uk:"Цифри на точках — пальці (баре = 1). Гарячі клавіші: <b>←/→</b> — нота, <b>↑/↓</b> — тип (у режимі «по одному»), <b>Пробіл</b> — арпедджіо першої схеми."},"ch.none":{ru:"Для «{c}» нет готовой аппликатуры в этой версии. Найди её на вкладке «Гриф» или возьми близкий тип аккорда.",en:"No ready fingering for «{c}» in this version. Find it on the Fretboard tab or use a close chord type.",uk:"Для «{c}» немає готової аплікатури в цій версії. Знайди її на вкладці «Гриф» або візьми близький тип акорда."},"ch.hear.title":{ru:"Нажми, чтобы сыграть",en:"Click to play",uk:"Натисни, щоб зіграти"},"ch.arp":{ru:"▶ Арп",en:"▶ Arp",uk:"▶ Арп"},"ch.src.barre":{ru:"барре, ",en:"barre, ",uk:"баре, "},"ch.src.open":{ru:"открытый",en:"open",uk:"відкритий"},"wind.title":{ru:"🪈 Духовые",en:"🪈 Winds",uk:"🪈 Духові"},"wind.tonic":{ru:"Тоника ",en:"Tonic ",uk:"Тоніка "},"wind.scale":{ru:"Гамма ",en:"Scale ",uk:"Гама "},"wind.play.scale":{ru:"▶ Проиграть гамму",en:"▶ Play the scale",uk:"▶ Програти гаму"},"wind.play.scale.title":{ru:"П k” that pulls back into minor."},"Ду-воп «50-е»":{n:"Doo-wop “50s”",d:"I–vi–IV–V: four bars — four circles, the “doo-wop” of the 50s vocal groups. The same loop — forever."},"Минорный ii–V–i":{n:"Minor ii–V–i",d:"the jazz cadence in minor: ii7 prepares, V7 pulls, i7 calms. Learning jazz — learn to play it in all 12 keys."},"Малый":{n:"Small Andalusian",d:"i–♭VI–♭III–♭VII — the “small” Andalusian cadence: the same Spanish descent, but without the major dominant — softer."},"Блюз 8 тактов":{n:"8-bar blues",d:"the 12-bar’s short brother: I×2, IV, I, V, IV, I–V. The Key to the Highway classic — faster and tighter."},"Блюз 16 тактов":{n:"16-bar blues",d:"the extended form: the first half is doubled — longer on the tonic, longer telling the story."}},uk:{"Поп-хит":{n:"Поп-хіт",d:"формула тисяч хітів (I–V–vi–IV): дім → напруга → смуток → повернення додому. Співають усі — звучить упізнавано з першої секунди."},"Сентиментальный":{n:"Сентиментальний",d:"той самий «поп-хіт», але починається зі смутку (vi) і світлішає до кінця — туга з гарним фіналом."},"Канон":{n:"Канон",d:"хід із Канона Пахельбеля: щаблі спускаються гамою — урочисто і спокійно."},"Джаз ii–V–I":{n:"Джаз ii–V–I",d:"головний джазовий каданс: ii готує V, V тягне в I. Вчиш джаз — учиш спершу його."},"Блюз 12 тактов":{n:"Блюз 12 тактів",d:"скелет усього блюзу: 4 такти тоніки, відхід у IV і назад, «ривок» через V. Септими дають той самий хрип."},"Андалузская":{n:"Андалузька",d:"спуск i–VII–VI–V (униз по щаблях!) — фламенко та іспанські балади. Фінальний мажорний V — гостра домінанта."},"Грустная":{n:"Сумна",d:"мінорний «поп-хіт навпаки»: тоніка, «світло», блукання й м’яке повернення."},"Эпичная":{n:"Епічна",d:"мінор + підйом угору по кругу квінт — кіношна грандіозність (саундтреки обожнюють)."},"Дорийский грув":{n:"Дорійський грув",d:"гойдалки i–IV у дорійському — фанк-грув (Oye Como Va). IV в мінорі звучить «просвітлено»."},"Фригийский ход":{n:"Фригійський хід",d:"i–II з низькою II — іспанська напруга (Misirlou із ими шагами — восточный колорит в мажорном плаще."},harmonicMaj:{name:"Гармонический мажор",iv:[0,2,4,5,7,8,11],d:"мажор с минорной VI — то самое «смуглое» звучание у классиков."},neapolitanMin:{name:"Неаполитанский минор",iv:[0,1,3,5,7,8,11],d:"минор с низкой II — оперная драма неаполитанской школы."},neapolitanMaj:{name:"Неаполитанский мажор",iv:[0,1,3,5,7,9,11],d:"редкий, «оперный» мажор с низкой II."},enigmaticMin:{name:"Энигма-минор",iv:[0,1,3,6,7,10,11],d:"тёмная загадка с двумя полутоновыми стенами — на грани диссонанса."},enigmatic:{name:"Энигма",iv:[0,1,4,6,7,10,11],d:"загадочная — не зря Enigma: непривычные шаги почти на каждой ступени."},composite2:{name:"Композит II",iv:[0,1,3,6,7,8,11],d:"составная гамма из двух ладов — гибрид гармонического минора."},ionianB5:{name:"Ионийский ♭5",iv:[0,2,4,5,6,9,11],d:"мажор с «провалившейся» квинтой — зыбкое, сюрреалистичное звучание."},locrianS7:{name:"Локрийский ♯7",iv:[0,1,3,5,6,8,11],d:"локрийский, но VII поднята — тоника уже не «падает», а тянет."},persian:{name:"Персидская",iv:[0,1,4,5,6,8,11],d:"восточная гамма с шагом «1+3» — персидский колорит."},phrygDom:{name:"Фригийский доминантовый",iv:[0,1,4,5,7,8,10],d:"фригийский с «правильной» III для доминанты — фламенко и метал."},dblHarm:{name:"Двойной гармонический",iv:[0,1,4,5,7,8,11],d:"византийский восток: две острые пары «полутон+терция» — Miserlou начинается с шага «1+3»."},ukrainianDorian:{name:"Украинский дорийский (дорийский ♯4)",iv:[0,2,3,6,7,9,10],d:"минор с высокой ♯4 — клезмер и «Гоголь-центр» звучания: скрипучий, танцевальный восток."},mixolydianB6:{name:"Миксолидийский ♭6",iv:[0,2,4,5,6,9,10],d:"мажор с блюзовой ♭7 и «тёмной» ♭6 — джазовый лад для доминант с уклоном в минор."},locrianN2:{name:"Локрийский ♮2",iv:[0,2,3,5,6,8,10],d:"локрийский, но II как в мажоре — jazz-минор без самого «спотыкающегося» шага."},lydDom:{name:"Лидийский доминантовый",iv:[0,2,4,6,7,9,10],d:"лидийский с «блюзовой» VII — джазовый лад для доминантовых аккордов."},bibopDom:{name:"Бибоп доминантовый",iv:[0,2,4,5,6,7,9,10],d:"8 нот — доминантовый мажор с проходной хроматикой между ♭6 и 7: беглые джазовые фразы ложатся как по рельсам."},hirajoshi:{name:"Хирадзёси",iv:[0,1,5,7,8],d:"японская пентатоника: напряжённые полутона и «дыры» — жанровые кагура-бэки и самурайская меланхолия."},insen:{name:"Ин-сен",iv:[0,1,5,7,10],d:"японская пентатоника с большой септимой в «дыре» — медитативная и острая одновременно (музыка для сякухати)."},superLoc:{name:"Супер-локрийский (ALT)",iv:[0,1,3,4,6,8,10],d:"альтерированная гамма — весь арсенал напряжений для V7 в джазе."},lydAug:{name:"Лидийский увеличенный",iv:[0,2,4,6,8,9,11],d:"лидийский с тремя целыми шагами подряд — «стеклянное», сновое звучание."},dorianB2:{name:"Дорийский ♭2",iv:[0,1,3,5,7,9,10],d:"дорийский с низкой II — синим фламенко-налётом (Santana любит)."}},SCALES_L10N={en:{major:{n:"Natural major",d:"bright and “proper” — the basis of almost all pop music. The major between degrees I and III — that’s where the joyful colour comes from."},minor:{n:"Natural minor",d:"the sad classic of rock and blues. Degree III is a semitone lower than in major — hence the minor sorrow."},harmonic:{n:"Harmonic minor",d:"minor with an “eastern” VII (+1 semitone) — drama, classical, heavy metal. The VII→I step has become sharp and alluring."},melodic:{n:"Melodic minor",d:"minor with a “bright” VI — jazz and fusion. Dark bottom, light top — that’s how the classics play it."},pentaMaj:{n:"Major pentatonic",d:"5 notes without “arguable” degrees — country, country-rock. Solos almost can’t go wrong: the notes always fit."},pentaMin:{n:"Minor pentatonic",d:"the base of rock and blues. 5 notes, zero conflicts — improvisation scale #1."},blues:{n:"Blues (minor)",d:"pentatonic + the “angry” ♭5. That addition creates the blues “wail” — the whole genre stands on it."},dorian:{n:"Dorian",d:"minor with a “bright” VI — funk, jazz, Celtic. A minor that sounds upbeat, not mournful."},phrygian:{n:"Phrygian",d:"the dark “Spanish” minor: the low II brings flamenco flavour and metal."},lydian:{n:"Lydian",d:"major with a “magical” ♯4 — soundtracks and dreaminess (Simpsons, dream-pop)."},mixolydian:{n:"Mixolydian",d:"major with a “bluesy” ♭VII — rock anthems (Sweet Home Alabama). The major that doesn’t want to “end”."},locrian:{n:"Locrian",d:"the most unstable scale: the tonic sounds “stumbling”. Almost never met in live music."},chromatic:{n:"Chromatic (all notes)",d:"all 12 notes in a row — for passing runs and chromatic moves between positions."},all:{n:"All notes on the neck",d:"the neck without a filter — just the whole map of notes."},hungarianMin:{n:"Hungarian minor",d:"minor with two “gypsy” augments — the flavour of Hungarian and Romani melodies."},hungarianMaj:{n:"Hungarian major",d:"major with exotic steps — an eastern flavour in a major cloak."},harmonicMaj:{n:"Harmonic major",d:"major with a minor VI — that very “smoky” sound of the classics."},neapolitanMin:{n:"Neapolitan minor",d:"minor with a low II — the operatic drama of the Neapolitan school."},neapolitanMaj:{n:"Neapolitan major",d:"a rare, “operatic” major with a low II."},enigmaticMin:{n:"Enigma minor",d:"a dark riddle with two semitone walls — on the edge of dissonance."},enigmatic:{n:"Enigma",d:"mysterious — no wonder Enigma: unusual steps on almost every degree."},composite2:{n:"Composite II",d:"a composite scale of two modes — a hybrid of the harmonic minor."},ionianB5:{n:"Ionian ♭5",d:"major with a “collapsed” fifth — an unstable, surreal sound."},locrianS7:{n:"Locrian ♯7",d:"Locrian, but with the VII raised — the tonic no longer “falls”, it pulls."},persian:{n:"Persian",d:"an eastern scale with a “1+3” step — Persian flavour."},phrygDom:{n:"Phrygian dominant",d:"Phrygian with the “right” III for the dominant — flamenco and metal."},dblHarm:{n:"Double harmonic",d:"the Byzantine east: two sharp “semitone+third” pairs — Miserlou starts with a “1+3” step."},ukrainianDorian:{n:"Ukrainian Dorian (Dorian ♯4)",d:"minor with a raised ♯4 — klezmer and “Gogol-centre” sounds: a creaky, dancing east."},mixolydianB6:{n:"Mixolydian ♭6",d:"major with a bluesy ♭7 and a “dark” ♭6 — a jazz mode for dominants leaning into minor."},locrianN2:{n:"Locrian ♮2",d:"Locrian, but II as in major — a jazz minor without the most “stumbling” step."},lydDom:{n:"Lydian dominant",d:"Lydian with a “bluesy” VII — a jazz mode for dominant chords."},bibopDom:{n:"Bebop dominant",d:"8 notes — a dominant major with a passing chromatic between ♭6 and 7: fluent jazz phrases fall right on rails."},hirajoshi:{n:"Hirajoshi",d:"a Japanese pentatonic: tense semitones and “holes” — kagura-becki genres and samurai melancholy."},insen:{n:"In-sen",d:"a Japanese pentatonic with a major seventh in the “hole” — meditative and sharp at once (shakuhachi music)."},superLoc:{n:"Super-Locrian (ALT)",d:"the altered scale — the whole arsenal of tensions for V7 in jazz."},lydAug:{n:"Lydian augmented",d:"Lydian with three whole steps in a row — a “glassy”, dream-like sound."},dorianB2:{n:"Dorian ♭2",d:"Dorian with a low II — with a blue flamenco tint (Santana loves it)."}},uk:{major:{n:"Натуральний мажор",d:"світла й «правильна» — основа майже всієї поп-музики. Мажор між I та III щаблем — звідси радісне забарвлення."},minor:{n:"Натуральний мінор",d:"сумна класика року й блюзу. III щабель на пів тону нижча, ніж у мажорі — звідси мінорний смуток."},harmonic:{n:"Гармонічний мінор",d:"мінор зі «східною» VII (+1 півтон) — драма, класика, важкий метал. Крок VII→I став гострим і привабливим."},melodic:{n:"Мелодичний мінор",d:"мінор зі «світлою» VI — джаз і ф’южн. Темний низ, світлий верх — так його грають класики."},pentaMaj:{n:"Пентатоніка мажор",d:"5 нот без «спірних» щаблів — кантрі, country-рок. Соло майже не помиляються: ноти завжди до місця."},pentaMin:{n:"Пентатоніка мінор",d:"база року й блюзу. 5 нот, нуль конфліктів — гама №1 для імпровізації."},blues:{n:"Блюзова (мін.)",d:"пентатоніка + «зла» ♭5. Саме ця добавка створює блюзове «виття» — на ній тримається весь жанр."},dorian:{n:"Дорійський",d:"мінор зі «світлою» VI — фанк, джаз, кельтика. Мінор, який звучить не тоскливо, а бадьоро."},phrygian:{n:"Фригійський",d:"темний «іспанський» мінор: низька II дає фламенко-колорит і метал."},lydian:{n:"Лідійський",d:"мажор із «чарівною» ♯4 — саундтреки та мрійливість (Simpsons, dream-pop)."},mixolydian:{n:"Міксолідійський",d:"мажор із «блюзовою» ♭VII — рок-гімни (Sweet Home Alabama). Мажор, який не хоче «закінчуватися»."},locrian:{n:"Локрійський",d:"найнестійкіша гама: тоніка звучить «запинаючись». У живій музиці майже не трапляється."},chromatic:{n:"Хроматична (усі ноти)",d:"усі 12 нот підряд — для проходів і хроматичних ходів між позиціями."},all:{n:"Усі ноти на грифі",d:"гриф без фільтра — просто вся карта нот."},hungarianMin:{n:"Угорський мінор",d:"мінор із двома «циганськими» прирощеннями — колорит угорських і циганських мелодій."},hungarianMaj:{n:"Угорський мажор",d:"мажор з екзотичними кроками — східний колорит у мажорному плащі."},harmonicMaj:{n:"Гармонічний мажор",d:"мажор із мінорною VI — те саме «смугляве» звучання в класиків."},neapolitanMin:{n:"Неаполітанський мінор",d:"мінор із низькою II — оперна драма неаполітанської школи."},neapolitanMaj:{n:"Неаполітанський мажор",d:"рідкісний, «оперний» мажор із низькою II."},enigmaticMin:{n:"Енігма-мінор",d:"темна загадка з двома півтоновими стінами — на межі дисонансу."},enigmatic:{n:"Енігма",d:"загадкова — недарма Enigma: незвичні кроки майже на кожному щаблі."},composite2:{n:"Композит II",d:"складена гама з двох ладів — гібрид гармонічного мінору."},ionianB5:{n:"Іонійський ♭5",d:"мажор із «провалившоюся» квінтою — хитке, сюрреалістичне звучання."},locrianS7:{n:"Локрійський ♯7",d:"локрійський, але VII піднята — тоніка вже не «падає», а тягне."},persian:{n:"Персидська",d:"східна гама з кроком «1+3» — перський колорит."},phrygDom:{n:"Фригійський домінантовий",d:"фригійський із «правильною» III для домінанти — фламенко й метал."},dblHarm:{n:"Подвійний гармон а/метала; глушить и отпускать — в ритм."],["Офбит","удар МЕЖДУ долями (на слабую восьмую). Регги живёт на офбите («скэнк» глушёным) — в пресете боя Регги-скип."],["Компас (фламенко)","ритмический круг фламенко: 12 ударов с особыми акцентами. Компас важнее нот — он «держит» фламенко, как метроном держит рок."],["Оверблоу","приём духовых: дуть сильнее и получить ноту ВЫШЕ обычной (на тин-вистле — вторая октава). В «Духовых» помечается ▲."],["Барре","указательный палец плашмя прижимает 5–6 струн — «передвижной порожек»: одна форма = 12 аккордов по грифу."],["Арпеджио","аккорд, разобранный по нотам — ноты по очереди, а не вместе. «♫ Арпеджио» в программе разбирает аккорды песни по струнам."]],SONG_FORMS=[["12-тактовый блюз","I·I·I·I — IV·IV — I·I — V·IV — I·V","скелет всего блюза: 4 такта тоники, уход в IV, возврат, «рывок» через V. Септ-аккорды — тот самый хрип; стиль «Блюз» в программе собирает ровно её."],["8-тактовый блюз","I·I — IV — I — V — IV — I — V","короткий брат 12-тактового: быстрее и теснее, рассказывает историю без раскачки (Key to the Highway)."],["16-тактовый блюз","I×8 — IV·IV — I·I — V·IV — I·V","12-тактовый с удвоенной первой половиной: дольше гуляем на тонике — дольше рассказываешь историю перед «рывком»."],["Куплет–припев–мост","V — C — V — C — B — C","формула поп-рокa: куплет рассказывает, припев «взлетает», мост (B) перезаводит перед финалом. Мост часто строится на другой прогрессии."],["AABA (32 такта)","A — A — B — A (по 8 тактов)","стандарт джаза и свинга: A — тема, B — «мост» из другой тональности, потом снова тема. Джазовые музыканты импровизируют ИМЕННО по этой форме."],["Ду-воп I–vi–IV–V","I — vi — IV — V (на такт каждый)","четыре такта — четыре «кружка» вокальных групп 50-х: один и тот же круг бесконечно, под «оо-и» подпевки."]],GLOSSARY_L10N={en:{"Тоника":{t:"Tonic",x:"The song’s “home”: the first and main chord — everything starts from it and returns to it. On the Fretboard it’s always the red dot. Formally, it’s degree I."},"Доминанта":{t:"Dominant",x:"Degree V — the “spring” that pulls back to the tonic. V → I is that very “coming home” that ends a verse and the whole song."},"Субдоминанта":{t:"Subdominant",x:"Degree IV — the “step aside”: it gives the movement direction. The classic journey: home (I) → road (IV) → spring (V) → home."},"Каденция":{t:"Cadence",x:"A phrase’s “landing”: a settled two-chord move into the end of the phrase. The classics: V → I (authentic) and IV → I (plagal, “church-like”)."},"Прогрессия":{t:"Progression",x:"A chain of chords the song walks around in. The base of almost everything is 4–8 chords; other styles change the “steps”, not the principle."},"Вамп":{t:"Vamp",x:"A looped short turn (1–2 chords) that the whole music “stands on” — it leaves room for improvisation and conversations between the instruments."},"Качание (свинг)":{t:"Swing",x:"Eighth notes are played unevenly: the first one long, the second short (like a triplet with a rest). The program’s backings have the “Swing” slider — 66% ≈ the classic 2:1."},"Гальоп":{t:"Gallop",x:"The metal rhythm: an eighth + two sixteenths + an eighth (“da-da-DUM”). It can’t be honestly played on the eighth grid — it counts in sixteenths (the metronome can do it)."},"Палм-мьют":{t:"Palm mute",x:"Rest the edge of your palm on the strings near the bridge — the strike turns dull and dense (“chug”). The core of hardcore/metal; mute and release — in rhythm."},"Офбит":{t:"Offbeat",x:"A strike BETWEEN the beats (on the weak eighth). Reggae lives on the offbeat (a muted “skank”) — see the Reggae skip strum preset."},"Компас (фламенко)":{t:"Compás (flamenco)",x:"Flamenco’s rhythmic cycle: 12 beats with special accents. Compás matters more than notes — it “holds” flamenco the way a metronome holds rock."},"Оверблоу":{t:"Overblow",x:"A wind-player’s trick: blow harder and get a note HIGHER than usual (on a tin whistle — the second octave). Marked with ▲ in “Winds”."},"Барре":{t:"Barre",x:"The index finger lies flat across 5–6 strings — a “movable nut”: one shape = 12 chords all over the neck."},"Арпеджио":{t:"Arpeggio",x:"A chord taken apart note by note — the notes in turn, not together. “♪ Arpeggio” in the program breaks the song’s chords into single strings."}},uk:{"Тоника":{t:"Тоніка",x:"«Дім» пісні: перший і головний акорд — з нього все починається і до нього все повертається. На Грифі завжди червона точка. Формально це I щабель."},"Доминанта":{t:"Домінанта",x:"V щабель — «пружина», що тягне назад до тоніки. V → I — те саме «повернення додому», яким завершують куплет і всю пісню."},"Субдоминанта":{t:"Субдомінанта",x:"IV щабель — «відхід убік»: надає рухові напрям. Класична подорож: дім (I) → дорога (IV) → пружина (V) → дім."},"Каденция":{t:"Каденція",x:"фраза-«приземлення»: усталений хід із двох акордів у кінець фрази. Класика: V → I (повна) і IV → I (плагальна, «церковна»)."},"Прогрессия":{t:"Прогресія",x:"ланцюжок акордів, яким пісня ходить колами. База майже всього — 4–8 акордів; інші стилі змінюють «кроки», а не принцип."},"Вамп":{t:"Вамп",x:"зациклений малий хід (1–2 акорди), на якому «стоїть» вся музика — лишає місце для імпровізації й розмов між інструментами."},"Качание (свинг)":{t:"Гойдалка (свінг)",x:"восьмі граються нерівно: перша довга, друга коротка (як триоль із паузою). У фонах програми — повзунок «Гойдалка», 66% ≈ класика 2:1."},"Гальоп":{t:"Гальоп",x:"ритм металу: восьма + дві шістнадцяті + восьма («та-та-ТА»). На восьмій сітці чесно не виражається — рахується на шістнадцятих (метроном уміє)."},"Палм-мьют":{t:"Пальм-м’ют",x:"притиснути ребро долоні до струн біля бріджа — удар глухий і щільний («чанк»). Основа хардкору/металу; глушити й відпускати — в ритм."},"Офбит":{t:"Офбет",x:"удар МІЖ частками (на слабку восьму). Реггі живе на офбеті (глухий «скенк») — пресет бою «Реггі-скіп»."},"Компас (фламенко)":{t:"Компас (фламенко)",x:"ритмічний круг фламенко: 12 ударів з особливими акцентами. Компас важливіший за ноти — він «тримає» фламенко, як метроном тримає рок."},"Оверблоу":{t:"Оверблоу",x:"прийом духових: дути сильніше й отримати ноту ВИЩЕ звичайної (на тін-вістлі — друга октава). У «Духових» позначається ▲."},"Барре":{t:"Баре",x:"вказівний палець плашмя притискає 5–6 струн — «пересувний порожок»: одна форма = 12 акордів по грифу."},"Арпеджио":{t:"Арпедджіо",x:"акорд, розібраний на ноти — ноти по черзі, а не разом. «♫ Арпедджіо» в програмі розбирає акорди пісні по струнах."}}},SONG_FORMS_L10N={en:{"12-тактовый блюз":{t:"12-bar blues",x:"The skeleton of all blues: 4 bars of the tonic, a move to IV and back, the “yank” through V. Seventh chords give that very rasp — the «Blues» style in the program builds exactly this form."},"8-тактовый блюз":{t:"8-bar blues",x:"The 12-bar’s shorter brother: faster and tighter, tells the story without winding up (Key to the Highway)."},"16-тактовый блюз":{t:"16-bar blues",x:"The 12-bar with a doubled first half: you wander on the tonic longer — more story before the “yank”."},"Куплет–припев–мост":{t:"Verse–chorus–bridge",x:"The pop-rock formula: the verse tells the story, the chorus “takes off”, the bridge (B) re-winds before the finale. The bridge is often built on a different progression."},"AABA (32 такта)":{t:"AABA (32 bars)",x:"The jazz and swing standard: A is the theme, B is a “bridge” in another key, then the theme again. Jazz musicians improvise over EXACTLY this form."},"Ду-воп I–vi–IV–V":{t:"Doo-wop I–vi–IV–V",x:"Four bars — the four “circles” of the 50s vocal groups: the same loop over and over, with “ooo-oh” backing vocals."}},uk:{"12-тактовый блюз":{t:"12-тактовий блюз",x:"скелет усього блюзу: 4 такти тоніки, відхід у IV і назад, «ривок» через V. Септакорди дають той самий хрип; стиль «Блюз» у програмі збирає рівно її."},"8-тактовый блюз":{t:"8-тактовий блюз",x:"коротший брат 12-тактового: швидший і тісніший, розповідає історію без розкачки (Key to the Highway)."},"16-тактовый блюз":{t:"16-тактовий блюз",x:"12-тактовий із подвоєною першою половиною: довше гуляєш на тоніці — довше розповідаєш історію перед «ривком»."},"Куплет–припев–мост":{t:"Куплет–приспів–брідж",x:"формула поп-року: куплет розповідає, приспів «злітає», брідж (B) перезаводить перед фіналом. Брідж часто будується на іншій прогресії."},"AABA (32 такта)":{t:"AABA (32 такти)",x:"стандарт джазу й свінгу: A — тема, B — «брідж» з іншої тональності, потім знову тема. Джазові музиканти імпровізують САМЕ за цією формою."},"Ду-воп I–vi–IV–V":{t:"Ду-воп I–vi–IV–V",x:"чотири такти — чотири «кружечки» вокальних гуртів 50-х: той самий круг безкінечно, під «оо-і» підспіви."}}},LESSONS_L10N={l01:{en:{t:"Posture & holding the guitar",x:"Sit on the edge of the chair, back free, no slouching. The guitar body rests on the right thigh (for right-handed players), neck pointing up at ~45°. Three contact points: both feet and the right forearm.<br><b>Do:</b> sit down and run the checklist — nothing should dangle or be tense."},uk:{t:"Посадка і тримання гітари",x:"Сідай на край стільця, спина вільна, без завалювання. Гітара ізгибом корпусу лежить на правій нозі (для правші), гриф дивиться вгору під ~45°. Три точки опори: дві ноги і праве передпліччя.<br><b>Зроби:</b> сядь і пройди чек-лист — нічого не повинно висіти або бути напруженим."}},l02:{en:{t:"String names & tuning",x:"Strings from bottom to top: <b>E A D G B E</b>. Mnemonic: “Every Adult Dog Grows Big Ears”. Tune with the tuner before EVERY session: an out-of-tune guitar trains your ear wrong.",app:{text:"String references and the tuner — in Tools.",tool:"tools",btn:"🧰 Open"}},uk:{t:"Назви струн і налаштування",x:"Струни знизу вгору: <b>E A D G B E</b>. Запам’ятовка: «Кожен Вечір Достає Гітару — Брат Грає». Налаштовуй тюнером перед КОЖНОЮ грою: розстроєна гітара вчить слух неправильно.",app:{text:"Еталони струн і тюнер — в Інструментах.",tool:"tools",btn:"🧰 Відкрити"}}},l03:{en:{t:"First touch: pick and fingers",x:"Hold the pick between thumb and index, 3–5 mm sticking out. Downstroke glides along the string — don’t dig in at an angle. Finger picking: pluck and rest on the next string.<br><b>Do:</b> 8 downstrokes on each open string — even sound, no “clicks”."},uk:{t:"Перший дотик: медіатор і пальці",x:"Тримай медіатор великим і вказівним, назовні 3–5 мм кінчика. Удар вниз — ковзання вздовж струни, не «втик» під кутом. Пальцями — щипок апояндо: защипнув і опустив на сусідню струну.<br><b>Зроби:</b> по 8 ударів вниз на кожній відкритій струні — звук рівний, без «клацань»."}},l04:{en:{t:"How to read tabs",x:"Tabs are six lines: the thinnest string (1st) on top, thickest (6th) at the bottom. A number on a line = the fret, 0 = open. Read left to right like text.<br><b>Do:</b> play 0–1–3–0 on the 1st string — that’s already a melody."},uk:{t:"Як читати таби",x:"Таби — шість ліній: зверху найтонша струна (1-а), знизу товста (6-а). Цифра на лінії = номер ладу, 0 = відкрита. Читай зліва направо, як текст.<br><b>Зроби:</b> зіграй на 1-й струні 0–1–3–0 — це вже мелодія."}},l05:{en:{t:"First chord: Em",x:"Em (E minor) — just two fingers: 2nd finger on the 2nd fret of the 5th string, 3rd on the 2nd fret of the 4th. The rest are open, strum all six.<br><b>Do:</b> take the chord and check the strings ONE BY ONE — each must ring clean.",chord:[4,"min"]},uk:{t:"Перший акорд: Em",x:"Em (мі-мінор) — усього два пальці: 2-й на 2-й лад 5-ї струни, 3-й — на 2-й лад 4-ї. Решта відкриті, бий усі шість.<br><b>Зроби:</b> візьми акорд і перевір струни ПО ОДНІЙ — кожна має дзвеніти чисто.",chord:[4,"min"]}},l06:{en:{t:"Am chord",x:"Am: 1st finger — 1st fret 2nd string, 2nd — 2nd fret 4th, 3rd — 2nd fret 3rd. Same shape as Em plus one finger.<br><b>Do:</b> Em → Am → Em — find the movement where fingers don’t fly off.",chord:[9,"min"]},uk:{t:"Акорд Am",x:"Am: 1-й палець — 1-й лад 2-ї струни, 2-й — 2-й лад 4-ї, 3-й — 2-й лад 3-ї. Форма як в Em плюс один палець.<br><b>Зроби:</b> Em → Am → Em — знайди варіант руху, де пальці не злітають з ладів.",chord:[9,"min"]}},l07:{en:{t:"D chord",x:"D: three fingers in a row on the 2nd fret — strings 4, 3 and 2 (fingers 1-2-3). Strum from the 4th string down — no bass strings.<br><b>Do:</b> check every string rings, then 4 slow strums.",chord:[2,"maj"]},uk:{t:"Акорд D",x:"D: три пальці в ряд на 2-му ладу — на 4-й, 3-й і 2-й струнах (пальці 1-2-3). Бий від 4-ї струни вниз — басові не граємо.<br><b>Зроби:</b> перевір дзвінкість кожної струни, потім повільно 4 удари.",chord:[2,"maj"]}},l08:{en:{t:"C and G chords",x:"C: 3rd finger — 3rd fret 5th string, 2nd — 2nd fret 4th, 1st — 1st fret 2nd. For G choose one of the two comfortable shapes and stick with it.<br><b>Do:</b> 4 strums each on C and G.",chord:[0,"maj"]},uk:{t:"Акорди C і G",x:"C: 3-й палець — 3-й лад 5-ї струни, 2-й — 2-й лад 4-ї, 1-й — 1-й лад 2-ї. G — вибери з двох зручних варіантів і тримайся одного.<br><b>Зроби:</b> C і G по 4 удари.",chord:[0,"maj"]}},l09:{en:{t:"Switching between two chords",x:"The secret of fast changes — move fingers TOGETHER along the shortest arc, and never lift shared points. Look at the target, not the hand.<br><b>Do:</b> Em↔Am — 8 changes of 4 strums at tempo 60 without pauses."},uk:{t:"Переходи між двома акордами",x:"Секрет швидких змін — рухати пальці РАЗОМ, по найкоротшій дузі, не відриваючи спільні точки. Дивись на ціль, не на руку.<br><b>Зроби:</b> Em↔Am — 8 змін по 4 удари в темпі 60 без пауз."}},l10:{en:{t:"First 4 chords together",x:"Em, Am, C, G — hundreds of songs live on them. Cycle: Em → Am → C → G → Em.<br><b>Do:</b> 4 strums per chord, tempo 60–70, three full cycles without stopping."},uk:{t:"Перші 4 акорди разом",x:"Em, Am, C, G — на них уже є сотні пісень. Круг: Em → Am → C → G → Em.<br><b>Зроби:</b> 4 удари на акорд, темп 60–70, три круги без зупинки."}},l11:{en:{t:"Downstroke on quarters",x:"Count out loud “1-2-3-4” and strike down on each count. The pick returns ABOVE the strings without touching them.<br><b>Do:</b> Em, 8 bars of 4 downstrokes — even and equally loud."},uk:{t:"Бій «вниз» на чвертях",x:"Рахуй уголос «раз-два-три-чотири» і бий вниз на кожен рахунок. Медіатор повертається вверх НАД струнами, не задаючи їх.<br><b>Зроби:</b> Em, 8 тактів по 4 удари — рівно й однаково гучно."}},l12:{en:{t:"Eighths: down-up",x:"Eighths — two strikes per count: “1-AND”. Down on the count, up on the “AND” — softer. The hand swings like a metronome, never stopping.<br><b>Do:</b> same Em, count out loud, 8 bars."},uk:{t:"Восьмі: вниз-вверх",x:"Восьмі — два удари на рахунок: «раз-І». Вниз на рахунок, вверх на «І» — вверх м’якше. Рука гойдається маятником без зупинки, як метроном.<br><b>Зроби:</b> та ж Em, рахунок уголос, 8 тактів."}},l13:{en:{t:"A 2-chord song",x:"Em and Am, 8 strums each — that’s already a song (the genre classic “Horse With No Name”). Change the chord on the FIRST beat of the bar.<br><b>Do:</b> four cycles of 8 strums."},uk:{t:"Пісня з 2 акордів",x:"Em і Am по 8 ударів кожен — уже пісня (класика жанру — «Horse With No Name»). Змінюй акорд на ПЕРШОМУ ударі такту.<br><b>Зроби:</b> чотири круги по 8 ударів."}},l14:{en:{t:"A 4-chord song",x:"Am – C – G – Em, 4 strums each with eighths — a ready verse. If you stumble — halve the speed; clean beats fast.<br><b>Do:</b> play 4 cycles; build the same progression in the builder.",app:{text:"Build it on the «🎵 Song» tab.",tool:"song",btn:"🎵 Song"}},uk:{t:"Пісня з 4 акордів",x:"Am – C – G – Em по 4 удари восьмими — готовий куплет. Якщо сбоїш — уповільни вдвічі, чистота важливіша за швидкість.<br><b>Зроби:</b> грай 4 круги; зібери цю ж прогресію в конструкторі.",app:{text:"Зібери її у вкладці «🎵 Пісня».",tool:"song",btn:"🎵 Пісня"}}},l15:{en:{t:"The A and E families",x:"A, A7, Am, Am7 and E, E7, Em — “anchor” shapes at frets 1–2: base fingers + additions. They get along with neighbouring chords through shared fingers.<br><b>Do:</b> A → A7 → A and E → E7 → E, 4 strums each — hear the character change.",chord:[9,"maj"]},uk:{t:"Сімейства A і E",x:"A, A7, Am, Am7 і E, E7, Em — «якірні» форми на 1–2 ладах: базові пальці + доповнення. Вони дружать із сусідніми акордами по спільних пальцях.<br><b>Зроби:</b> A → A7 → A і E → E7 → E по 4 удари — почуєш, як змінюється характер.",chord:[9,"maj"]}},l16:{en:{t:"F without barre (simplified)",x:"“Small F”: xx3211 — the 1st finger flattens across the 1st AND 2nd strings (a mini-barre), other fingers 2, 3, 4. Skip the low E.<br><b>Do:</b> F → C → F — teach the finger to lie flat, not on its edge.",chord:[5,"maj"]},uk:{t:"F без баре (спрощений)",x:"«Маленький F»: xx3211 — 1-й палець плашмя притискає 1-й І 2-й струни на 1-му ладі (міні-баре), інші пальці — 2, 3, 4. Басову E не граємо.<br><b>Зроби:</b> F → C → F — привчай палець лежати плашмя, а не на ребрі.",chord:[5,"maj"]}},l17:{en:{t:"What a barre is and why",x:"A barre — the index finger flattens across 5–6 strings at one fret. A movable “nut”: one shape = 12 chords across the fretboard. Strengthen the hand with the small F first.<br><b>Do:</b> a barre at the 5th fret — pluck the strings one by one, all must ring."},uk:{t:"Що таке баре і навіщо",x:"Баре — вказівний палець плашмя притискає 5–6 струн на одному ладі. Це пересувний «порожек»: одна форма = 12 акордів по грифу. Спочатку зміцни руку маленьким F.<br><b>Зроби:</b> баре на 5-му ладу — пощипай струни по одній, всі мають дзвеніти."}},l18:{en:{t:"Full F barre",x:"Full F: a barre at the 1st fret + an E shape at frets 2–3 (133211). Cramped near the nut? Take it at the 3rd — easier, same class of sound.<br><b>Do:</b> F → C → G → F, 2 strums each — press the barre only at the moment of the strike.",chord:[5,"maj"]},uk:{t:"Баре F (повне)",x:"Повне F: баре на 1-му ладу + форма E на 2–3 ладах (133211). Тісно біля порожка? Візьми на 3-му — легше, звук той самий клас.<br><b>Зроби:</b> F → C → G → F по 2 удари — баре тисне тільки в момент удару.",chord:[5,"maj"]}},l19:{en:{t:"Power chords (5)",x:"A power chord — root and fifth only: two-three fingers, works in any key, sounds fat with distortion. Shape: root on the 6th string + a fifth a string up.<br><b>Do:</b> E5 → G5 → A5, chugging 4 strums each.",chord:[4,"5"]},uk:{t:"Пауер-акорди (5)",x:"Пауер-акорд — тільки корінь і квінта: два-три пальці, працює в будь-якій тональності, з дисторшном звучить жирно. Форма: корінь на 6-й струні + квінта через струну вище.<br><b>Зроби:</b> E5 → G5 → A5 чеканкою по 4 удари.",chord:[4,"5"]}},l20:{en:{t:"Barre shapes across the neck: E and A",x:"The E shape (barre + E) — root on the 6th string; the A shape (barre + A) — root on the 5th. Together they cover the whole neck.<br><b>Do:</b> B♭ at the 6th fret (E shape) and B♭ at the 1st (A shape) — it’s the same chord.",chord:[10,"maj"]},uk:{t:"Баре-форми по грифу: E і A",x:"E-форма (баре + E) — корінь на 6-й струні; A-форма (баре + A) — корінь на 5-й. Разом вони покривають весь гриф.<br><b>Зроби:</b> B♭ на 6-му ладу (E-форма) і B♭ на 1-му (A-форма) — це один і той самий акорд.",chord:[10,"maj"]}},l21:{en:{t:"Sevenths: 7, m7, maj7",x:"7 (dominant) — a major with a “question”, pulls to the tonic: blues and rock. m7 — a soft minor (soul). maj7 — “fairy-tale” jazz. The difference is one fret.<br><b>Do:</b> Cmaj7 → C → C7 → Cm7 — hear the mood change.",chord:[0,"maj7"]},uk:{t:"Септакорди: 7, m7, maj7",x:"7 (домінант) — мажор із «питанням», тягне в тоніку: блюз і рок. m7 — м’який мінор (соул). maj7 — «казковий» джаз. Різниця — один лад.<br><b>Зроби:</b> Cmaj7 → C → C7 → Cm7 — почуй, як змінюється настрій.",chord:[0,"maj7"]}},l22:{en:{t:"sus2 and sus4",x:"Sus chords are “suspended”: the third is replaced by a second or a fourth — the tension hangs in the air. Classic: D → Dsus4 → D (finger lands and lifts).<br><b>Do:</b> D → Dsus4 → D → Dsus2.",chord:[2,"sus4"]},uk:{t:"sus2 і sus4",x:"Sus-акорди «підвішені»: терція замінена секундою або кварткою — напруга висить у повітрі. Класика: D → Dsus4 → D (палець ставиться і знімається).<br><b>Зроби:</b> D → Dsus4 → D → Dsus2.",chord:[2,"sus4"]}},l23:{en:{t:"add9 and 6 — pop colour",x:"add9 and 6 add colour without changing the chord’s function — a favourite of pop ballads. Cadd9 is even easier than C for changes.<br><b>Do:</b> C → Cadd9 → C6 → C — the colour changes, the song stays.",chord:[0,"add9"]},uk:{t:"add9 і 6 — поп-фарба",x:"add9 і 6 додають колір, не змінюючи функцію акорда — улюблений прийом поп-балад. Cadd9 ще й зручніший за C для змін.<br><b>Зроби:</b> C → Cadd9 → C6 → C — колір змінюється, пісня та ж.",chord:[0,"add9"]}},l24:{en:{t:"dim, aug, m7♭5 — what they’re for",x:"Diminished (dim) — anxious passing chords, augmented (aug) — “glassy”, m7♭5 — jazzy sadness before the dominant. In songs they’re rare guests for 1–2 strums.<br><b>Do:</b> C → Ddim → G — hear the pull toward G.",chord:[2,"dim"]},uk:{t:"dim, aug, m7♭5 — навіщо вони",x:"Зменшені (dim) — тривожно-прохідні, збільшені (aug) — «скляні», m7♭5 — джазовий смуток перед домінантою. У піснях — рідкі гості на 1–2 удари.<br><b>Зроби:</b> C → Ddim → G — почуй тяжіння в G.",chord:[2,"dim"]}},l25:{en:{t:"Big barre at frets 5–7",x:"Higher up the neck the frets are closer and pressing is easier — train the barre at frets 5–7, then descend to the 1st. That’s the honest way to strengthen the hand.<br><b>Do:</b> a major barre at the 5th fret, sliding down by semitones to the 1st."},uk:{t:"Велике баре на 5–7 ладах",x:"Вище по грифу лади ближче і тиснути легше — тренуй баре на 5–7 ладах, потім спускайся до 1-го. Це чесний спосіб зміцнити руку.<br><b>Зроби:</b> баре-мажор на 5-му ладу, зсувай вниз по півтонах до 1-го."}},l26:{en:{t:"Open alternatives",x:"Cadd9, four-finger G, Em7 — the “comfortable” shapes of pop music: the Cadd9↔G change is just two fingers, the ring stays.<br><b>Do:</b> G → Cadd9 → Em7 → D — the link of half of modern songs.",chord:[0,"add9"]},uk:{t:"Відкриті альтернативи",x:"Cadd9, G із чотирма пальцями, Em7 — «зручні» форми поп-музики: зміна Cadd9↔G — усього два пальці, дзвін залишається.<br><b>Зроби:</b> G → Cadd9 → Em7 → D — зв’язка половини сучасних пісень.",chord:[0,"add9"]}},l27:{en:{t:"Jazz shapes",x:"Jazz m7/maj7/7 are taken as barre shapes rooted on the 6th or 5th string — the same E/A shapes with a seventh inside.<br><b>Do:</b> Dm7 → G7 → Cmaj7 — that’s ii–V–I, THE jazz move.",chord:[2,"m7"]},uk:{t:"Джазові форми",x:"Джазові m7/maj7/7 беруться баре-формами з коренем на 6-й або 5-й струні — ті самі E/A-форми, але з септимою всередині.<br><b>Зроби:</b> Dm7 → G7 → Cmaj7 — це ii–V–I, головний джазовий хід.",chord:[2,"m7"]}},l28:{en:{t:"Triads up the neck",x:"Any chord can be assembled from the top three strings in different places — that’s how “thin” second-guitar parts and arrangements are born.<br><b>Do:</b> find a C triad at the 3rd and at frets 8–10 (top 3 strings)."},uk:{t:"Трезвучия вверх по грифу",x:"Будь-який акорд можна зібрати з трьох верхніх струн у різних місцях грифу — так народжуються «тонкі» партії другої гітари й аранжування.<br><b>Зроби:</b> знайди трезвучие C на 3-му і на 8–10-му ладах (перші 3 струни)."}},l29:{en:{t:"Colour shapes: drop chords",x:"Drop2 chords — four-voice shapes on 4 strings: the bass is “dropped” an octave down. The standard of funk/jazz accompaniment.<br><b>Do:</b> take any m7 and slide it up the neck keeping the shape."},uk:{t:"Кольорові форми: дроп-акорди",x:"Дроп-акорди (drop2) — чотириголосі форми на 4 струнах: бас «скинутий» на октаву вниз. Стандарт фанк/джаз-акомпанемента.<br><b>Зроби:</b> візьми будь-який m7 і проїдь його вгору по грифу, зберігаючи форму."}},l30:{en:{t:"Changes with shared fingers",x:"Look for fingers shared by neighbouring chords — do NOT lift them. Am→C (the 1st finger stays), C→G7, Em→G.<br><b>Do:</b> 8 changes of each pair — the hand memorises the minimal movement."},uk:{t:"Переходи зі спільними пальцями",x:"Дивись, які пальці спільні в сусідніх акордів, — їх НЕ відривай. Am→C (1-й палець живе), C→G7, Em→G.<br><b>Зроби:</b> по 8 змін кожної пари — рука запам’ятовує мінімум руху."}},l31:{en:{t:"Fast changes: pair training",x:"The “60 seconds” challenge: how many CLEAN changes between two chords per minute. Scheme: slow → clean → fast. A great daily practice.<br><b>Do:</b> three rounds on any pair.",app:{text:"The pair trainer with a metronome — here in School.",sect:"prac",btn:"🏋 To practices"}},uk:{t:"Швидкі зміни: тренування пар",x:"Челендж «60 секунд»: скільки ЧИСТИХ змін між двома акордами за хвилину. Схема: повільно → чисто → швидко. Чудова щоденна практика.<br><b>Зроби:</b> три раунди на будь-якій парі.",app:{text:"Тренажер пар із метрономом — тут, у Школі.",sect:"prac",btn:"🏋 До практик"}}},l33:{en:{t:"Counting: 1-and-2-and",x:"The eighth grid counts “1-AND, 2-AND, 3-AND, 4-AND”. Say it out loud with an even pendulum of the hand — this is the foundation of all strums.<br><b>Do:</b> 8 bars of counting out loud, hand moving without a strike — the hand already holds the rhythm."},uk:{t:"Рахунок: раз-і-два-і",x:"Восьма сітка рахується «раз-І, два-І, три-І, чотири-І». Промовляй уголос із рівним маятником руки — це фундамент усіх боїв.<br><b>Зроби:</b> 8 тактів рахунку уголос із рухом руки без удару — рука вже тримає ритм."}},l34:{en:{t:"Quarter-note strum",x:"One downstroke per count; eighths pass silently. Even sound, like a metronome.<br><b>Do:</b> Em, 8 bars of 4 downstrokes."},uk:{t:"Чвертний бій",x:"Один удар вниз на кожен рахунок, восьмі рука проходить мовчки. Звук рівний, як метроном.<br><b>Зроби:</b> Em, 8 тактів по 4 удари вниз."}},l35:{en:{t:"Eighths: D-DU",x:"Down on the count, up on the “AND”. All strikes equally loud, the pendulum never stops.<br><b>Do:</b> 8 bars of D-DU on Em counting out loud."},uk:{t:"Восьмі: D-DU",x:"На рахунок — вниз, на «І» — вверх. Всі удари однієї гучності, маятник не зупиняється.<br><b>Зроби:</b> 8 тактів D-DU на Em під рахунок уголос."}},l36:{en:{t:"The universal D-DU-UDU strum",x:"The most common pop strum: down, down-up, up-down-up. Per bar: D-DU-UDU. Learn it slowly in parts, then assemble.<br><b>Do:</b> 8 bars on Em or Am."},uk:{t:"Універсальний бій D-DU-UDU",x:"Найходовіший бій поп-музики: вниз, вниз-вверх, вверх-вниз-вверх. Схема на такт: Д-ДУ-УДУ. Розучи повільно по частинах, потім збереги.<br><b>Зроби:</b> 8 тактів на Em або Am."}},l37:{en:{t:"The “six” ballad strum",x:"Six strikes per bar: D-D-DU-D-DU — a soft ballad sway. Sounds great with fingerpicking in verses.<br><b>Do:</b> 8 bars on C–G–Am–F… or any chord pair."},uk:{t:"Бій «шістка» (баллада)",x:"Шість ударів на такт: Д-Д-ДУ-Д-ДУ — м’яке баладне похитування. Добре звучить із перебором у куплетах.<br><b>Зроби:</b> 8 тактів на C–G–Am–F… або на будь-якій парі акордів."}},l38:{en:{t:"Reggae skip: accent on the “AND”",x:"Reggae flips the rhythm: strong beats are SKIPPED (muted), strikes land on the “AND”. That’s the jumping groove.<br><b>Do:</b> count “1-and-2-and” and play only on the “AND”, muting with the palm on the count."},uk:{t:"Реггі-скіп: акцент на «І»",x:"Реггі перевертає ритм: сильні частки ПРОПУСКАЮТЬСЯ (глушаться), удари — на «І». Звідси «стрибаючий» грув.<br><b>Зроби:</b> рахуй «раз-і-два-і» і грай тільки на «І», на рахунок — глушіння долонею."}},l39:{en:{t:"Shuffle and swing",x:"Shuffle — eighths played unevenly: “long-short”, like a triplet with a rest. The swaying blues groove.<br><b>Do:</b> say “1-and-a” and play D-DU, hitting on “1” and “a”.",app:{text:"Turn on a swinging backing and play the pentatonic over it — swing lives on the «🎵 Song» tab.",tool:"song",btn:"🎵 Song"}},uk:{t:"Шафл і свінг",x:"Шафл — восьмі граються нерівно: «довга-коротка», як тріоль із паузою. Гойдаючий блюзовий грув.<br><b>Зроби:</b> промов «1-і-а» і грай D-DU, ударяючи на «1» і на «а».",app:{text:"Увімкни фон із гойдалкою і грай поверх пентатоніку — гойдалка у вкладці «🎵 Пісня».",tool:"song",btn:"🎵 Пісня"}}},l40:{en:{t:"Rests and muting",x:"A rest in a strum is NOT silence of the hand, but muting: the palm or left-hand fingers touch the strings at the moment of the strike. The rhythm machine keeps swinging.<br><b>Do:</b> a D-DU strum where the first hit of every bar is a muted “chok”."},uk:{t:"Паузи і глушилка",x:"Пауза в бою — це НЕ мовчання руки, а глушіння: долоня або пальці лівої кладуться на струни в момент удару. Ритм-машина продовжує гойдатися.<br><b>Зроби:</b> бій D-DU, де перший удар кожного такту — глухий «чок»."}},l41:{en:{t:"Fingerpicking: basic patterns",x:"Right-hand fingers: p (thumb) — bass, i-m-a (index-middle-ring) — the three top strings. Classic: p–i–m–a–m–i.<br><b>Do:</b> the p-i-m-a pattern on Em, slowly, no rush."},uk:{t:"Фінгерстайл: базові патерни",x:"Пальці правої: p (великий) — бас, i-m-a (вказівний-середній-безіменний) — три верхні. Класика: p–i–m–a–m–i.<br><b>Зроби:</b> патерн p-i-m-a на акорді Em, повільно, без поспіху."}},l42:{en:{t:"The 4-3-2-1 picking",x:"A simple picking: thumb on the 4th string (bass), then 3-2-1 in turns. Keep it even: every note the same length.<br><b>Do:</b> Am, 4 picking cycles, the bass changes with the chord."},uk:{t:"Перебор 4-3-2-1",x:"Простий перебір: великий палець по 4-й струні (бас), далі 3-2-1 по черзі. Тримай рівність: кожна нота однакової довжини.<br><b>Зроби:</b> Am, 4 круги перебору, бас змінюється по акорду."}},l43:{en:{t:"Picking with bass (Travis-lite)",x:"A simplified Travis: the bass alternates between the two lowest strings, fingers pick 3-2-1 over it. You get a swaying backing.<br><b>Do:</b> C: bass 5-4, fingers 3-2-1 — slowly, in a cycle."},uk:{t:"Перебор із басом (Travis-лайт)",x:"Спрощений Тревіс: бас чергується між двома нижніми струнами, пальці перебирають 3-2-1 поверх. Виходить «качальний» фон.<br><b>Зроби:</b> C: бас 5-4, пальці 3-2-1 — повільно, по колу."}},l44:{en:{t:"Playing with a metronome",x:"The metronome is an honest teacher: it never lies about evenness. Start at 60 bpm, add +5 only after playing it cleanly three times in a row.<br><b>Do:</b> turn on the metronome in «🧰 Tools» and play your favourite strum for 8 bars.",app:{text:"The metronome with meters — in Tools.",tool:"tools",btn:"🧰 Open"}},uk:{t:"Гра з метрономом",x:"Метроном — чесний учитель: він не бреше про рівність. Починай із 60 bpm, додавай +5 лише коли зіграв чисто три рази підряд.<br><b>Зроби:</b> увімкни метроном у «🧰 Інструментах» і пройди улюблений бій 8 тактів.",app:{text:"Метроном із розмірами — в Інструментах.",tool:"tools",btn:"🧰 Відкрити"}}},l45:{en:{t:"Playing with the ▶ Backing",x:"The backing track is already a “live” band: chords per bar, a beat, bass. Play your strum or picking over it.<br><b>Do:</b> build a song with «✨ Make it pretty» and turn on the «▶ Backing» right there.",app:{text:"The backing starts from «✨ Make it pretty» and «Mode of the day».",sect:"prac",btn:"🏋 To practices"}},uk:{t:"Гра з ▶ Фоном",x:"Фон (бектрек) — це вже «жива» група: акорди по тактах, біт, бас. Грай поверх свій бій або перебор.<br><b>Зроби:</b> зібери пісню «✨ Зроби гарно» і увімкни «▶ Фон» прямо там.",app:{text:"Фон запускається з «✨ Зроби гарно» і «Лада дня».",sect:"prac",btn:"🏋 До практик"}}},l46:{en:{t:"Percussion on the body",x:"Hit the top with the thumb knuckle (X) or slap the strings with the palm — percussion right on the guitar. Adds a “clap” to the groove.<br><b>Do:</b> a D-X-DU-X pattern: on X, knuckles on the body."},uk:{t:"Перкусія корпусом",x:"Удар кістяшками великого пальця по деке (X) або шльопок долонею по струнах — перкусія прямо на гітарі. Додає груву «плеск».<br><b>Зроби:</b> бій Д-X-ДУ-Х: на X — кістяшки по деке."}},r01:{en:{t:"Power chords: two fingers, the whole song",x:"A power chord = root + fifth on adjacent strings (a “flat” barre across two frets). It works in ANY mode — you can’t go wrong. The E/A/D shapes move across the neck: one finger — one chord. With Drop D the root is the open 6th string — a riff with no left hand at all. The country-rock drive — the «Boomchuck» preset.<br><b>Do:</b> sweep the E shape from the 1st to the 8th fret, keeping even eighths.",chord:[6,"5"]},uk:{t:"Пауер-акорди: два пальці — вся пісня",x:"Пауер-акорд = корінь + квінта на сусідніх струнах (баре «палець плашмя» на два лади). Він працює в БУДЬ-ЯКОМУ ладі — не помилишся. Форми E/A/D рухаються по грифу: один палець — один акорд. Із строєм Drop D корінь на 6-й відкритій — рифф узагалі без лівої руки. Кантрі-рокова розкачка — пресет «Бумчак».<br><b>Зроби:</b> проведи форму E від 1-го ладу до 8-го, тримай рівні восьмі.",chord:[6,"5"]}},r02:{en:{t:"Palm mute: the “chuk”",x:"Rest the side of your palm on the strings near the bridge — the strike turns dull and dense (a chuk). The core of hardcore, metal and reggae skank. Mute and release IN RHYTHM: press-strum-release. Muted “x”s exist in the «Boomchuck» and «Fingerstyle» presets.<br><b>Do:</b> eight hits: 4 muted chucks + 4 open — alternate to a metronome.",app:{text:"The metronome — in Tools.",tool:"tools",btn:"🧰 To the metronome"}},uk:{t:"Палм-м’ют: «чанк»",x:"Притисни ребро долоні до струн біля бриджу — удар глухий і щільний (чанк). Основа хардкору, металу й реггі-скенку. Глушити й відпускати треба В РИТМ: притиснув-ударив-відпустив. Глушені «x» є в пресетах «Бумчак» і «Фінгерстайл».<br><b>Зроби:</b> вісім ударів: 4 глухих «чанк» + 4 відкритих — чергуй під метроном.",app:{text:"Метроном — в Інструментах.",tool:"tools",btn:"🧰 До метронома"}}},r03:{en:{t:"The gallop: da-da-DA",x:"The metal gallop — an eighth + two sixteenths + an eighth: said out loud as “da-da-DA”. It lives on the sixteenth grid — without slow breakdown it won’t come. For counting practice — the «Waltz 3/4 (D-U-U)» and «Fingerstyle T-1-2-3» presets in the metronome.<br><b>Do:</b> turn on the metronome with «sixteenths» at 80 bpm, say the rhythm before the strike.",app:{text:"The metronome with subdivision — in Tools.",tool:"tools",btn:"🧰 To the metronome"}},uk:{t:"Кантер: да-да-ДА",x:"Кантер металу — восьма + дві шістнадцяті + восьма: промовляється «да-да-ДА». Рахується на шістнадцятій сітці — без повільного розбору не береться. Для тренування рахунку — пресети «Вальс 3/4 (D-U-U)» і «Фінгерстайл T-1-2-3» у метрономі.<br><b>Зроби:</b> увімкни метроном із поділом «шістнадцяті» і 80 bpm, промов ритм перед ударом.",app:{text:"Метроном із поділом — в Інструментах.",tool:"tools",btn:"🧰 До метронома"}}},l47:{en:{t:"Chromatics — meeting the neck",x:"The chromatic scale — all 12 semitones in a row. Play 1-2-3-4 fingers on every string — the hand learns to walk the neck, the ear learns semitones.<br><b>Do:</b> chromatics from the 5th fret, sixth string → first.",fret:[0,"chromatic"]},uk:{t:"Хроматика — знайомство з грифом",x:"Хроматика — усі 12 півтонів підряд. Грай 1-2-3-4 пальцями по кожній струні — рука вчиться ходити по грифу, вухо — чути півтони.<br><b>Зроби:</b> хроматика від 5-го ладу, шоста струна → перша.",fret:[0,"chromatic"]}},l48:{en:{t:"Major: the boxes",x:"The major scale lives in “boxes” — 4-fret windows in one position. Take C major in the open position and at the 7th — the same scale.<br><b>Do:</b> C major on the fretboard, play up and down in two positions.",fret:[0,"major"]},uk:{t:"Мажор: бокси",x:"Мажорна гама живе в «боксах» — вікнах із 4 ладів в одній позиції. Візьми до-мажор у відкритій позиції і в 7-й — це одна й та сама гама.<br><b>Зроби:</b> до-мажор на грифі, зіграй вверх-вниз у двох позиціях.",fret:[0,"major"]}},l49:{en:{t:"Minor pentatonic: box 1",x:"The pentatonic — 5 notes without “tricky” degrees: you CANNOT go wrong playing by the highlight. Box 1 is the most-used on the neck.<br><b>Do:</b> A minor pentatonic, box 1, play up and down.",fret:[9,"pentaMin"]},uk:{t:"Мінорна пентатоніка: бокс 1",x:"Пентатоніка — 5 нот без «складних» ступенів: на ній НЕМОЖЛИВО помилитися, якщо грати по підсвітці. Бокс 1 — найходовіший на грифі.<br><b>Зроби:</b> ля-мінорна пентатоніка, бокс 1, зіграй вверх-вниз.",fret:[9,"pentaMin"]}},l50:{en:{t:"Pentatonic: boxes 2–5",x:"The same set of notes — the next windows up the neck. Box 2 starts 3 frets after box 1, and so on in a chain.<br><b>Do:</b> switch the «Position» on the fretboard and run boxes 2–5 of A minor pentatonic.",fret:[9,"pentaMin"]},uk:{t:"Пентатоніка: бокси 2–5",x:"Той самий набір нот — наступні вікна по грифу. Бокс 2 починається з 3-го ладу після бокса 1, і так далі по ланцюжку.<br><b>Зроби:</b> переключи «Позицію» на грифі
