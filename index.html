      store.del('ga_settings'); store.del('ga_custom_tunings'); store.del('ga_ui'); store.del('ga_school'); location.reload();
    }
  });
}

/* ================= ИНСТРУМЕНТ: ПРОГРЕССИИ ================= */

function renderProgressions(el){
  el.innerHTML =
    '<h2>🎶 Прогрессии аккордов</h2>' +
    '<div class="card">' +
      '<div class="roots" id="p-roots"></div>' +
      '<label class="fld">Пресеты — все лады сразу, кликни любой</label>' +
      '<div id="p-presets"></div>' +
      '<div class="muted small" id="p-desc" style="margin-top:8px"></div>' +
      '<div id="p-out" style="margin-top:14px"></div>' +
    '</div>' +
    '<div class="hint">Нажми на аккорд в последовательности — прозвучит. «▶ Играть» — вся прогрессия подряд ' +
    '(удар по аккорду каждые 0,9 c). «На грифе» — показать тоны аккорда на грифе в текущем строе. ' +
    '✚ — добавить аккорд в песню (или «✚ Прогрессия в песню» — все аккорды разом, во вкладке «🎵 Песня»).</div>';

  const uiP = loadUI('prog');
  let pc = Number.isInteger(uiP.pc) ? uiP.pc : 0;
  let preset = PROGRESSIONS[uiP.preset] || PROGRESSIONS[0];
  let timers = [];
  const $ = s => el.querySelector(s);

  function stopSeq(){ timers.forEach(clearTimeout); timers = []; }

  function drawRoots(){
    saveUI('prog', { pc });
    $('#p-roots').innerHTML = NOTE_SHARP.map((n, i) =>
      '<button class="chip' + (i === pc ? ' on' : '') + '" data-pc="' + i + '">' + n + '</button>').join(' ');
    $('#p-roots').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { pc = +b.dataset.pc; drawRoots(); drawChords(); }));
  }
  function drawPresets(){
    saveUI('prog', { preset: PROGRESSIONS.indexOf(preset) });
    // все 13 пресетов сразу, сгруппированы по ладам — ничего не спрятано
    const groups = [];
    Object.keys(PROG_MODES).forEach(md => {
      const list = PROGRESSIONS.map((p, i) => [p, i]).filter(([p]) => p.mode === md);
      if (list.length) groups.push([md, list]);
    });
    $('#p-presets').innerHTML = groups.map(([md, list]) =>
      '<div class="row" style="margin:0 0 6px 0">' +
        '<span class="muted small" style="min-width:150px">' + esc(PROG_MODES[md].name) + ':</span>' +
        list.map(([p, i]) =>
          '<button class="chip' + (p === preset ? ' on' : '') + '" data-p="' + i + '" title="' + esc(p.degs.map(d => typeof d === 'object' ? ROMAN[d.d] : ROMAN[d]).join('–')) + '">' + esc(p.name) + '</button>').join(' ') +
      '</div>').join('');
    $('#p-presets').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { preset = PROGRESSIONS[+b.dataset.p]; drawPresets(); drawChords(); }));
    const dEl = $('#p-desc');
    if (dEl) dEl.textContent = preset.d || '';
  }

  function buildChords(){
    return preset.degs.map(raw => {
      const d = typeof raw === 'object' ? raw.d : raw;
      const base = modeTriad(preset.mode, d);
      let q = (raw && raw.q) || base.q;
      if (preset.dom7 && !(raw && raw.q)) q = q === 'maj' ? '7' : (q === 'min' ? 'm7' : q);
      const rootPc = ((pc + base.off) % 12 + 12) % 12;
      const vs = findVoicings(rootPc, q);
      return { deg: degLabel(d, q), rootPc, q, name: chordName(rootPc, q), vs };
    });
  }

  function drawChords(){
    stopSeq();
    const chords = buildChords();
    // полоска последовательности
    let html = '<div class="deg-list">' + chords.map((c, k) =>
      '<button class="deg-chip" data-k="' + k + '"><b>' + esc(c.name) + '</b><span class="rn">' + esc(c.deg) + '</span>' +
      '<span class="rn" data-add="' + k + '" title="Добавить аккорд в песню" style="cursor:pointer">✚</span></button>').join('') + '</div>';
    html += '<div class="row" style="margin-top:12px">' +
      '<button class="btn primary small" id="p-play">▶ Играть последовательность</button>' +
      '<button class="btn small" id="p-stop">⏹ Стоп</button>' +
      '<button class="btn small" id="p-tosong" title="Добавить ВСЕ аккорды прогрессии в песню (вкладка «Песня»)">✚ Прогрессия в песню</button>' +
      '<span class="muted small" id="p-songmsg"></span>' +
      '</div>';
    // схемы: только уникальные аккорды, первая аппликатура
    const seen = new Set();
    let grid = '';
    chords.forEach(c => {
      if (seen.has(c.name) || !c.vs.length) return;
      seen.add(c.name);
      grid += '<div class="chord-card" data-k="' + chords.indexOf(c) + '" title="Нажми — прозвучит">' +
        '<div class="cname">' + esc(c.name) + '</div>' +
        chordDiagramSVG(c.vs[0], c.rootPc, c.q, { noTitle:true, fingers: deriveFingers(c.vs[0]) }) +
        '<div class="csrc">' + esc(c.vs[0].src) + '</div>' +
        '<button class="btn small" data-fret="' + chords.indexOf(c) + '" style="margin-top:6px">На грифе</button>' +
        '<button class="btn small" data-song="' + chords.indexOf(c) + '" title="Добавить аккорд в песню" style="margin-top:6px">✚ В песню</button>' +
      '</div>';
    });
    html += '<div class="chord-grid" style="margin-top:14px">' + grid + '</div>';
    $('#p-out').innerHTML = html;

    // из прогрессии — в песню: один аккорд или вся прогрессия
    function addSong(list){
      const names = list.map(c => c.name).join(', ');
      const songSec = document.getElementById('tool-song');
      if (songSec && songSec._addSongChords) songSec._addSongChords(list.map(c => ({ root: c.rootPc, q: c.q })));
      else { // вкладка «Песня» ещё не открывалась — дописать в storage
        const ui = loadUI('song');
        const seq = Array.isArray(ui.seq) ? ui.seq.slice() : [];
        list.forEach(c => seq.push({ root: c.rootPc, q: c.q }));
        ui.seq = seq;
        ui.chg = (Number.isInteger(ui.chg) ? ui.chg : 0) + 1;
        saveUI('song', ui);
        const fretSec = document.getElementById('tool-fret');
        if (fretSec && fretSec._onSong) fretSec._onSong();
      }
      const msg = $('#p-songmsg');
      if (msg) msg.textContent = 'Добавил в песню: ' + names;
    }
    $('#p-tosong').addEventListener('click', () => addSong(chords));
    $('#p-out').querySelectorAll('[data-song]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        addSong([chords[+b.dataset.song]]);
      }));

    $('#p-out').querySelectorAll('.deg-chip').forEach(b =>
      b.addEventListener('click', () => { const c = chords[+b.dataset.k]; if (c.vs.length) playVoicing(c.vs[0]); }));
    $('#p-out').querySelectorAll('[data-add]').forEach(x =>
      x.addEventListener('click', e => {
        e.stopPropagation();
        addSong([chords[+x.dataset.add]]);
      }));
    $('#p-play').addEventListener('click', () => {
      stopSeq();
      chords.forEach((c, k) => { if (c.vs.length) timers.push(setTimeout(() => playVoicing(c.vs[0]), k * 900)); });
    });
    $('#p-stop').addEventListener('click', stopSeq);
    $('#p-out').querySelectorAll('.chord-card').forEach(card => {
      card.addEventListener('click', () => { const c = chords[+card.dataset.k]; if (c.vs.length) playVoicing(c.vs[0]); });
      const fb = card.querySelector('[data-fret]');
      fb && fb.addEventListener('click', e => {
        e.stopPropagation();
        const c = chords[+fb.dataset.fret];
        showTool('fret');
        const sec = currentSection();
        sec._openChord && sec._openChord(c.rootPc, c.q);
      });
    });
  }

  drawRoots(); drawPresets(); drawChords();
  el._cleanup = stopSeq;
  // открыть конкретную прогрессию (из круга квинт): тоника + индекс пресета
  el._open = (tonicPc, progIdx) => {
    preset = PROGRESSIONS[progIdx] || PROGRESSIONS[0];
    pc = tonicPc;
    drawRoots(); drawPresets(); drawChords();
  };
}

/* ================= ИНСТРУМЕНТ: ПЕСНЯ ПО АККОРДАМ =================
   Выбираешь аккорд — видишь тональности, где он живёт, аккорды тональности,
   красивых «заёмных» соседей и подсказку «какой взять дальше» (функциональная
   гармония). Последовательность собирается кликами — грубо говоря, пишешь песню. */

const MAJ_OFF = [0,2,4,5,7,9,11];
const MIN_OFF = [0,2,3,5,7,8,10];
const DIATONIC_Q = {
  maj: ['maj','min','min','maj','maj','min','dim'],
  min: ['min','dim','maj','min','min','maj','maj'],
};
/* лады песни: 7-нотные — трезвучия на ступенях; пентатоники/блюз — пауэр-аккорды */
const SONG_MODES = [
  ['maj', 'мажор'], ['min', 'минор'], ['dorian', 'дорийский'], ['phrygian', 'фригийский'],
  ['lydian', 'лидийский'], ['mixolydian', 'миксолидийский'], ['locrian', 'локрийский'],
  ['pentaMaj', 'пентатоника мажор'], ['pentaMin', 'пентатоника минор'], ['blues', 'блюз'],
];
/* роль каждой ступени — «почему аккорд звучит именно так» */
const DEG_ROLE = {
  maj: [
    'тоника: «дом», точка покоя — сюда всё возвращается',
    'мягкая подготовка доминанты: классический путь ii → V',
    'проходная и неуверенная — чаще уходит в vi или IV',
    'уход «в сторону» из дома; после неё напрашивается V',
    'главное напряжение тональности: тянет обратно в I',
    '«ложная тоника» — мажор, но с оттенком грусти',
    'остро и неустойчиво: почти всегда ведёт в I',
  ],
  min: [
    'тоника минора: «дом» с грустной окраской',
    'остро и неустойчиво: обычно ведёт в v или V',
    '«светлая» мажорная ступень внутри минора',
    'усиливает минорное настроение, уходит «в глубину»',
    'мягкая доминанта — возврат в i без острого крюка',
    'утешение: «свет из минора», часто после i',
    'нейтральный шаг вниз к тонике',
  ],
};
function diatonicTriads(T, mode){
  const ivName = { maj: 'major', min: 'minor' }[mode] || mode; // в SCALES ключи major/minor
  const iv = SCALES[ivName] ? SCALES[ivName].iv : SCALES.major.iv;
  if (iv.length === 7){
    const step = i => iv[i % 7] + 12 * Math.floor(i / 7);
    return iv.map((o, d) => {
      const third = step(d + 2) - step(d);
      const fifth = step(d + 4) - step(d);
      const q = third === 3 && fifth === 7 ? 'min' : third === 4 && fifth === 7 ? 'maj'
        : third === 3 && fifth === 6 ? 'dim' : third === 4 && fifth === 8 ? 'aug' : 'maj';
      return { root: ((T + o) % 12 + 12) % 12, q, d };
    });
  }
  // пентатоники/блюз — пауэр-аккорды на каждой ноте лада
  return iv.map((o, d) => ({ root: ((T + o) % 12 + 12) % 12, q: '5', d }));
}
function borrowedTriads(T, mode){
  if (mode !== 'maj' && mode !== 'min') return []; // заёмные — только у мажора/минора
  const b = mode === 'maj'
    ? [ [10,'maj','♭VII — рок-ход из минора'], [8,'maj','♭VI — драматичный подъём'],
        [3,'maj','♭III — «свет из минора»'],   [5,'min','iv — минорная тоска'] ]
    : [ [7,'maj','V мажор — доминанта (гарм. минор)'], [10,'maj','VII — мягкий возврат'],
        [1,'maj','♭II — неаполитанское напряжение'],   [5,'maj','IV мажор — дорийский просвет'] ];
  return b.map(([o, q, why]) => ({ root: ((T + o) % 12 + 12) % 12, q, why }));
}
/* функциональные тяготения: ступень → [[следующая ступень, вес]…] */
const NEXT_DEG = {
  0: [[4,3],[3,2],[5,2],[1,1]],   // I → V, IV, vi, ii
  1: [[4,3],[6,1]],               // ii → V, vii°
  2: [[5,2],[3,1]],               // iii → vi, IV
  3: [[4,2],[0,2],[1,1]],         // IV → V, I, ii
  4: [[0,3],[5,1]],               // V → I, vi
  5: [[3,2],[1,2],[4,1]],         // vi → IV, ii, V
  6: [[0,3]],                     // vii° → I
};
const DEG_WHY = {
  '0>4':'I → V — энергия вперёд, готовим разрешение',
  '0>3':'I → IV — мягкий плагальный шаг (как в хорале)',
  '0>5':'I → vi — оттенок грусти, «подушка» перед следующим ходом',
  '0>1':'I → ii — джазовый шаг',
  '1>4':'ii → V — классическое джазовое движение',
  '1>6':'ii → vii° — томление без разрешения',
  '2>5':'iii → vi — уход вниз по кругу квинт',
  '2>3':'iii → IV — продолжаем путь',
  '3>4':'IV → V — готовим разрешение (часть каданса IV–V–I)',
  '3>0':'IV → I — плагальный каданс, церковно-нежный возврат',
  '3>1':'IV → ii — приятное скольжение',
  '4>0':'V → I — классическое разрешение (полный каданс): напряжение падает',
  '4>5':'V → vi — обманчивый каданс: ждали домой, а попали в грусть',
  '5>3':'vi → IV — тёплый ход по кругу квинт',
  '5>1':'vi → ii — блюзы и соул любят',
  '5>4':'vi → V — подъём напряжения',
  '6>0':'vii° → I — резкое разрешение, нота «в лоб»',
};
/* в какой тональности живёт последовательность (или один аккорд) */
function detectKey(chords){
  if (!chords.length) return null;
  let best = null;
  for (let T = 0; T < 12; T++){
    ['maj','min'].forEach(m => {
      const set = diatonicTriads(T, m);
      let score = 0;
      chords.forEach(c => { if (set.some(x => x.root === c.root && x.q === c.q)) score += 1; });
      const tonicQ = m === 'maj' ? 'maj' : 'min';
      if (chords[0].root === T && chords[0].q === tonicQ) score += 0.6;
      if (chords[chords.length - 1].root === T && chords[chords.length - 1].q === tonicQ) score += 0.6;
      if (!best || score > best.score) best = { T, mode: m, score };
    });
  }
  return best && best.score > 0 ? best : null;
}

  const uiS = loadUI('song');

  let key = Number.isInteger(uiS.key) ? uiS.key : 0;
  let mode = SONG_MODES.some(x => x[0] === uiS.mode) ? uiS.mode : 'maj';
  let seq = Array.isArray(uiS.seq)
    ? uiS.seq.filter(c => c && Number.isInteger(c.root) && CHORD_TYPES.includes(c.q)).map(c => ({ root: c.root, q: c.q }))
    : [];
  let timers = [];
  const $ = s => el.querySelector(s);
  let styleId = STYLES[uiS.styleId] ? uiS.styleId : 'pop';                                  // выбранный стиль «Сделай красиво»
  let bpm = Number.isInteger(uiS.bpm) ? Math.max(30, Math.min(240, uiS.bpm))                 // ЕДИНЫЙ темп песни (фон/метроном/подсказки)
    : Number.isInteger(uiS.styleBpm) ? Math.max(30, Math.min(240, uiS.styleBpm)) : STYLES[styleId].bpm; // миграция со styleBpm (v2.6–3.5)
  let bgStrumSel = ['metro', 'even'].concat(STRUM_PRESETS.map(p => p[0])).includes(uiS.bgStrum) ? uiS.bgStrum : 'metro'; // бой фона
  let generated = false;       // песня собрана «✨ Сделай красиво» (сводка жива для транспонирования)
  let genSummaryBase = '';     // базовая сводка генерации без приставок транспонирования
  let chg = Number.isInteger(uiS.chg) ? uiS.chg : 0; // счётчик правок песни — по нему гриф понимает, что пора перестроиться
  let booted = false;                                // первый рендер вкладки — не считаем изменением
  function persist(){ // правка песни → поднять счётчик и звать гриф (если тот открыт)
    if (booted) chg++;
    saveUI('song', { seq, key, mode, chordRoot, chordQ, chg, styleId, bpm, bgStrum: bgStrumSel });

    if (booted) drawSongBpm();

  function stopAll(){ timers.forEach(clearTimeout); timers = []; }
  function voicingOf(c){ const vs = findVoicings(c.root, c.q); return vs.length ? vs[0] : null; }
  function degInKey(c){
    const d = diatonicTriads(key, mode).findIndex(x => x.root === c.root && x.q === c.q);
    return d >= 0 ? degLabel(d, c.q) : 'заём';
  }

  function addChord(c){
    seq.push({ root: c.root, q: c.q });
    generated = false; // песня правилась руками — сводка генерации больше не «своя»
    const v = voicingOf(c);
    if (v) playVoicing(v);
    drawSeq(); drawNext();
  }

  /* --- твой аккорд --- */
  function chordChanged(){
    el.querySelectorAll('[data-q]').forEach(b => b.classList.toggle('on', b.dataset.q === chordQ));

  function drawPickerChips(){
    $('#s-roots').innerHTML = NOTE_SHARP.map((n, i) =>

    $('#s-roots').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { chordRoot = +b.dataset.pc; chordChanged(); }));
  }

  /* --- где этот аккорд встречается: ТОП по покрытию песни + все варианты свёрнуто --- */
  function drawKeys(){
    const c = { root: chordRoot, q: chordQ };
    const MODES_ORDER = ['maj','min','dorian','phrygian','lydian','mixolydian','locrian'];
    const rows = [];
    for (let T = 0; T < 12; T++){
      MODES_ORDER.forEach(md => {
        const dia = diatonicTriads(T, md);
        const d = dia.findIndex(x => x.root === c.root && x.q === c.q);
        if (d < 0) return;
        let cov = 0; // сколько аккордов ПЕСНИ лежит в этой тональности
        seq.forEach(sc => { if (dia.some(x => x.root === sc.root && x.q === sc.q)) cov++; });
        rows.push({ T, md, d, cov });
      });
    }
    rows.sort((a, b) => b.cov - a.cov || a.T - b.T || MODES_ORDER.indexOf(a.md) - MODES_ORDER.indexOf(b.md));
    const maxCov = rows.length ? rows[0].cov : 0;
    const chip = r => {
      const nm = SONG_MODES.find(x => x[0] === r.md);
      const cov = (seq.length && r.cov > 0) ? ' · <b>' + r.cov + '</b> из ' + seq.length : ''; // «0 из N» не печатаем — выглядит как поломка
      return '<button class="chip' + (r.T === key && r.md === mode ? ' on' : '') + '" data-k="' + r.T + '" data-m="' + r.md + '">' +
        pcName(r.T) + ' ' + esc(nm ? nm[1] : r.md) + cov + ' <span class="muted small">' + degLabel(r.d, chordQ) + '</span></button>';
    };
    const top = rows.slice(0, 6), rest = rows.slice(6);
    const allDet = len => '<details class="hint" style="width:100%; margin-top:6px"><summary style="cursor:pointer">показать все варианты (' + len + ')</summary>' +
      '<div class="row" style="margin-top:8px">' + rows.map(chip).join(' ') + '</div></details>';
    const borrowHead = 'этот аккорд не лежит ни в одной из тональностей твоей песни (заёмный) — тональности самого аккорда:';
    $('#s-keys').innerHTML = rows.length
      ? '<span class="muted small" style="width:100%">' + esc(chordName(chordRoot, chordQ)) +
        (seq.length ? (maxCov > 0 ? ' — лучшие для песни:</span> ' : ' ' + borrowHead + '</span> ') + top.map(chip).join(' ') +
          (rest.length ? allDet(rows.length) : '')
        : ' встречается в:</span> ' + top.map(chip).join(' ') +
          (rest.length ? allDet(rows.length) : ''))
      : '<span class="muted small">Вне диатоники — заимствованный аккорд, тональность выбери справа.</span>';
    $('#s-keys').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => {
        key = +b.dataset.k; mode = b.dataset.m;
        persist();
        $('#s-key').value = String(key);
        drawModeChips();
        drawSongChords(); drawNext(); drawSeq();
      }));
  }
  /* если выбранный аккорд не в текущей тональности — мягко переключаемся на его главную */
  function applyAutoKey(){
    const guess = detectKey([{ root: chordRoot, q: chordQ }]);
    if (guess && !diatonicTriads(key, mode).some(x => x.root === chordRoot && x.q === chordQ)){
      key = guess.T; mode = guess.mode;
      $('#s-key').value = String(key);
      drawModeChips();
      drawSongChords();
    }
  }

  /* --- аккорды тональности + заимствованные --- */
  function cardHTML(c, sub){
    const v = voicingOf(c);
    if (!v) return '';
    const d = diatonicTriads(key, mode).findIndex(x => x.root === c.root && x.q === c.q);
    const role = d >= 0 ? ' ' + degLabel(d, c.q) + (DEG_ROLE[mode] ? ' — ' + DEG_ROLE[mode][d] : '') : ' Заимствованный аккорд: ' + (c.why || 'вне гаммы');
    return '<div class="chord-card" title="Клик — добавить в песню и сыграть.' + esc(role) + '">' +
      '<div class="cname">' + esc(chordName(c.root, c.q)) + '</div>' +
      chordDiagramSVG(v, c.root, c.q, { noTitle:true, fingers: deriveFingers(v) }) +
      '<div class="csrc">' + esc(sub) + '</div>' +
    '</div>';
  }
  function drawSongChords(){
    const dia = diatonicTriads(key, mode).filter(c => voicingOf(c));
    const bor = borrowedTriads(key, mode)
      .filter(c => !dia.some(x => x.root === c.root && x.q === c.q))
      .filter(c => voicingOf(c));
    $('#s-dia').innerHTML = dia.map(c => cardHTML(c, degLabel(c.d, c.q))).join('') || '<span class="muted small">Аппликатур пока нет.</span>';
    $('#s-bor').innerHTML = bor.map(c => cardHTML(c, c.why)).join('');
    const borH = $('#s-bor-h');
    if (borH) borH.style.display = bor.length ? '' : 'none';
    [[dia, '#s-dia'], [bor, '#s-bor']].forEach(([list, sel]) => {
      const cards = $(sel).querySelectorAll('.chord-card');
      list.forEach((c, i) => { if (cards[i]) cards[i].addEventListener('click', () => addChord(c)); });
    });
    drawTheory();
  }
  function drawTheory(){
    const dia = diatonicTriads(key, mode);
    const isDiatonic = mode === 'maj' || mode === 'min';
    let html;
    if (isDiatonic){
      const par = mode === 'maj' ? 'минора' : 'мажора';
      html = '<b>Почему эти аккорды?</b> Гамма ' + pcName(key) + ' ' + (mode === 'maj' ? 'мажора' : 'минора') +
        ' — это 7 нот. На каждой ступени строится трезвучие из нот той же гаммы — так появляются «родные» аккорды тональности:<br>' +
        dia.map(c => '<b>' + esc(chordName(c.root, c.q)) + '</b> (' + degLabel(c.d, c.q) + ') — ' + esc(DEG_ROLE[mode][c.d])).join('<br>') +
        '<br>Классические кадансы: <b>V → I</b> — полный каданс (напряжение падает), <b>IV → I</b> — плагальный (нежный), ' +
        '<b>V → vi</b> — обманчивый (ждали домой — попали в грусть). ' +
        'Заимствованные аккорды приходят из параллельного ' + par + ': набор нот почти тот же, но «точка опоры» другая — звучит свежо.';
    } else {
      html = '<b>Лад ' + esc(SCALES[mode].name) + '</b> от ' + pcName(key) + '. ' + esc(SCALES[mode].d || '') +
        (dia.some(c => c.q === '5')
          ? '<br>Аккорды лада — пауэр-аккорды (квинта) на каждой ноте: классика для пентатоник и блюза, играются легко и всегда в тему.'
          : '<br>Аккорды лада построены на его ступенях.');
    }
    const d = dia.findIndex(x => x.root === chordRoot && x.q === chordQ);
    html += '<br><b>Твой аккорд ' + esc(chordName(chordRoot, chordQ)) + '</b> — ' + (d >= 0
      ? (isDiatonic ? degLabel(d, chordQ) + ' в этой тональности: ' + DEG_ROLE[mode][d] + '.' : degLabel(d, chordQ) + ' — нота выбранного лада.')
      : 'вне лада (заём). Такие аккорды добавляют цвета — после них обычно возвращаются в тонику.');
    $('#s-theory-body').innerHTML = html;
  }

  /* --- подсказка «какой взять дальше» --- */
  function drawNext(){
    const last = seq.length ? seq[seq.length - 1] : { root: chordRoot, q: chordQ };
    const dia = diatonicTriads(key, mode);
    const d = dia.findIndex(x => x.root === last.root && x.q === last.q);
    let cands = [];
    if (d >= 0){
      if (dia.every(x => x.q === '5')){
        // пентатоника/блюз: любая нота лада — безопасный следующий шаг
        dia.forEach((c, i) => {
          if (i !== d) cands.push({ root: c.root, q: c.q, w: 1, why: 'нота лада — прозвучит в тему' });
        });
      } else (NEXT_DEG[d] || []).forEach(([nd, w]) => {
        const c = dia[nd];
        if (!c) return;
        cands.push({ root: c.root, q: c.q, w, why: DEG_WHY[d + '>' + nd] || (degLabel(d, last.q) + ' → ' + degLabel(nd, c.q)) });
      });
    } else {
      cands = dia.filter(x => x.d === 0 || x.d === 3 || x.d === 4)
        .map(c => ({ root: c.root, q: c.q, w: 2, why: 'вернуться в тональность' }));
    }
    cands = cands.filter(c => !(c.root === last.root && c.q === last.q));
    cands.sort((a, b) => b.w - a.w);
    const top = cands.filter(c => voicingOf(c)).slice(0, 5);
    $('#s-next').innerHTML = top.length ? top.map((c, i) => {
      const dd = dia.findIndex(x => x.root === c.root && x.q === c.q);
      return '<button class="chip" data-n="' + i + '"><b>' + esc(chordName(c.root, c.q)) + '</b> ' +
        '<span class="muted small">' + (dd >= 0 ? degLabel(dd, c.q) : '') + '</span></button>';
    }).join(' ') : '<span class="muted small">Сыграй что-нибудь — подскажу продолжение.</span>';
    $('#s-next-hint').innerHTML = top.length
      ? top.map(c => '<b>' + esc(chordName(c.root, c.q)) + '</b> — ' + esc(c.why)).join(' · ')
      : '';
    $('#s-next').querySelectorAll('button[data-n]').forEach(b =>
      b.addEventListener('click', () => addChord(top[+b.dataset.n])));
  }

  /* --- последовательность (песня) --- */
  function arpOf(c){
    const v = voicingOf(c);
    if (!v) return;
    const tn = tuningNotes();
    v.f.forEach((f, i) => { if (f >= 0 && tn[i] !== undefined) pluck(midiFreq(tn[i] + f), i * 0.13, 0.7); });
  }
  function playSongArpAll(){
    stopAll();
    const step = (60 / bpm) * 4 * 1000; // такт на аккорд в темпе песни
    seq.forEach((c, k) => timers.push(setTimeout(() => arpOf(c), k * step)));
  }
  function drawSeq(){
    $('#s-seq').innerHTML = seq.length
      ? seq.map((c, i) =>
          '<button class="deg-chip" data-i="' + i + '"><b>' + esc(chordName(c.root, c.q)) + '</b>' +
          '<span class="rn">' + esc(degInKey(c)) + '</span>' +
          '<span class="rn" data-arp="' + i + '" title="Арпеджио этого аккорда" style="cursor:pointer">♪</span>' +
          '<span class="rn" data-del="' + i + '" title="Убрать из песни" style="cursor:pointer">✕</span></button>').join(' ')
      : '<span class="muted small">Пока пусто — кликай аккорды выше.</span>';
    $('#s-seq').querySelectorAll('[data-del]').forEach(x =>
      x.addEventListener('click', e => {
        e.stopPropagation();
        seq.splice(+x.dataset.del, 1);
        generated = false; // песня правилась руками
        drawSeq(); drawNext(); drawGuess();
      }));
    $('#s-seq').querySelectorAll('[data-arp]').forEach(x =>
      x.addEventListener('click', e => {
        e.stopPropagation();
        arpOf(seq[+x.dataset.arp]);
      }));
    $('#s-seq').querySelectorAll('.deg-chip').forEach((chip, i) =>
      chip.addEventListener('click', () => {
        if (sufler){ startPlayback(i); return; } // суфлёр: продолжить с этого аккорда
        const v = voicingOf(seq[i]);
        if (v) playVoicing(v);
      }));
    persist();
    drawGuess();
    $('#s-tr-down').disabled = $('#s-tr-up').disabled = !seq.length; // транспонировать нечего
    // гриф живёт в ногу с песней: панель «Твоя песня» перерисовывается
    const fretSec = document.getElementById('tool-fret');
    if (fretSec && fretSec._refresh) fretSec._refresh();
  }
  function drawGuess(){
    const g = detectKey(seq);
    $('#s-guess').textContent = g
      ? 'Тональность твоей песни (по аккордам): ' + pcName(g.T) + (g.mode === 'maj' ? ' мажор' : ' минор')
      : '';
  }
  /* --- проигрывание песни (и суфлёр): аккорд на такт в темпе песни --- */
  let sufler = false;   // режим суфлёра: крупная строка + автопрокрутка
  let playIdx = 0;      // какой аккорд звучит сейчас
  let lastHl = -1;      // какой чип уже подсвечен/проскроллен (гейт от лишних прокруток)

  function highlightSeq(k){ // подсветить текущий чип в «Твоей песне» + мягкая автопрокрутка
    const chips = $('#s-seq').querySelectorAll('.deg-chip');
    chips.forEach((c, i) => c.classList.toggle('on', i === k));
    const cur = chips[k];
    if (cur && lastHl !== k){
      cur.scrollIntoView({ block:'nearest', behavior:'smooth' });
      lastHl = k;
    }
    if (k < 0) lastHl = -1;
  }
  function drawSufler(){
    if (!sufler) return;
    const c = seq[playIdx];
    const now = $('#sufler-now');
    now.innerHTML = c ? esc(chordName(c.root, c.q)) : '—';
    now.classList.remove('sufler-pop'); void now.offsetWidth; now.classList.add('sufler-pop');
    const nxt = seq.slice(playIdx + 1, playIdx + 4).map(x => esc(chordName(x.root, x.q))).join(' · ');
    $('#sufler-next').innerHTML = nxt ? 'дальше: ' + nxt : 'конец песни';
  }
  function stopSufler(){
    if (!sufler) return;
    sufler = false;
    const b = $('#s-sufler');
    if (b){ b.textContent = '🎬 Суфлёр'; b.classList.add('primary'); b.classList.remove('danger'); }
    const box = $('#s-sufler-box');
    if (box) box.style.display = 'none';
    highlightSeq(-1);
  }
  function startPlayback(fromIdx){ // игра песни с места fromIdx — аккорд на такт в темпе песни
    stopAll();
    if (!seq.length) return;
    playIdx = Math.max(0, Math.min(fromIdx, seq.length - 1));
    const step = (60 / bpm) * 4 * 1000; // такт на аккорд в темпе песни
    const fire = (k) => {
      playIdx = k;
      const v = voicingOf(seq[k]);
      if (v) playVoicing(v);
      highlightSeq(k); // подсветка и автопрокрутка всегда синхронны со звуком
      if (sufler) drawSufler();
      if (k === seq.length - 1 && sufler) // конец песни — суфлёр выключается и сворачивается
        timers.push(setTimeout(() => stopSufler(), step));
    };
    if (playIdx === seq.length - 1) fire(playIdx);
    else {
      fire(playIdx);
      for (let k = playIdx + 1; k < seq.length; k++)
        timers.push(setTimeout(() => fire(k), (k - playIdx) * step));
    }
    if (sufler){ drawSufler(); highlightSeq(playIdx); }
  }
  function playSong(){ startPlayback(0); }

  function drawModeChips(){
    $('#s-mode-row').innerHTML = SONG_MODES.map(([k, nm]) =>
      '<button class="chip' + (k === mode ? ' on' : '') + '" data-m="' + k + '">' + nm + '</button>').join(' ');
    $('#s-mode-row').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => {
        mode = b.dataset.m;
        persist();
        drawModeChips();
        drawKeys(); drawSongChords(); drawNext(); drawSeq();
      }));
  }
  $('#s-key').addEventListener('change', e => { key = +e.target.value; persist(); drawSongChords(); drawNext(); drawSeq(); });

  /* --- «Сделай красиво»: генерация песни по стилю --- */
  function drawStyleBlock(){
    $('#s-styles').innerHTML = Object.keys(STYLES).map(k =>
      '<button class="chip' + (k === styleId ? ' on' : '') + '" data-st="' + k + '">' + STYLES[k].name + '</button>').join(' ');
    $('#s-styles').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => {
        styleId = b.dataset.st;
        bpm = STYLES[styleId].bpm; // стиль приносит свой темп — в общий темп песни
        persist();
        drawStyleBlock();
        drawSongBpm();
      }));
    $('#s-bpm').value = bpm;
    $('#s-bpmval').textContent = bpm;
    drawSongBpm();
  }
  function drawSongBpm(){ // ярлык связи с метрономом: «= метроном» или «в метрономе: N»
    const l = $('#s-metrobpm');
    if (!l) return;
    const mb = loadUI('tools').bpm;
    l.textContent = Number.isInteger(mb) ? (mb === bpm ? '= метроном' : 'в метрономе: ' + mb) : '';
  }
  function impHint(T){ // что советовать для импровизации в выбранном стиле
    const st = STYLES[styleId];
    const ru = SOLF[T].charAt(0).toUpperCase() + SOLF[T].slice(1);
    if (st.scaleHint === 'pentaMin') return ru + '-минорная пентатоника';
    if (st.scaleHint === 'pentaMaj') return ru + '-мажорная пентатоника';
    const nm = (SONG_MODES.find(x => x[0] === st.mode) || [])[1] || st.mode;
    return 'гамма лада (' + nm + ')';
  }
  function generateSong(useT, useMode){ // без аргументов — случайная тональность и лад стиля; с аргументами — из ютуб-джема
    bgStop(); // пересобрали — старый фон глушим
    const st = STYLES[styleId];
    const T = Number.isInteger(useT) ? ((useT % 12) + 12) % 12 : Math.floor(Math.random() * 12);
    if (useMode && SONG_MODES.some(x => x[0] === useMode)) mode = useMode; else mode = st.mode;
    bpm = st.bpm; // «Сделай красиво» приносит темп стиля — в общий темп песни
    const dia = diatonicTriads(T, mode);
    seq = st.form.map(f => ({ root: dia[f[0]].root, q: f[1] || dia[f[0]].q }));
    key = T;
    $('#s-key').value = String(key);
    drawModeChips(); drawKeys(); drawSongChords(); drawNext(); drawSeq(); // drawSeq сохранит и позовёт гриф
    const mdName = (SONG_MODES.find(x => x[0] === mode) || [])[1] || mode;
    $('#s-stylemsg').innerHTML = '<b style="color:var(--accent)">' + esc(SOLF[key].charAt(0).toUpperCase() + SOLF[key].slice(1)) + ' ' + esc(mdName) +
      '</b> · ' + esc(st.name.toLowerCase()) + ' · ' + esc(st.formLabel) + ' · темп ' + bpm +
      ' · импровизируй: <b>' + esc(impHint(key)) + '</b>';
    generated = true;
    genSummaryBase = $('#s-stylemsg').innerHTML;
    $('#s-styletip').textContent = st.tip || '';
  }
  $('#s-gen').addEventListener('click', generateSong);
  $('#s-regen').addEventListener('click', generateSong);

  /* транспонирование песни ±полутон: аккорды + тональность, лад не меняется */
  function transposeSong(dir){
    if (!seq.length) return;
    seq.forEach(c => { c.root = ((c.root + dir) % 12 + 12) % 12; });
    key = ((key + dir) % 12 + 12) % 12;
    $('#s-key').value = String(key);
    persist(); // chg → привязанный гриф и «что играть» перестроятся сами
    drawSeq(); drawSongChords(); drawNext(); drawGuess();
    const mdName = (SONG_MODES.find(x => x[0] === mode) || [])[1] || mode;
    const keyName = SOLF[key].charAt(0).toUpperCase() + SOLF[key].slice(1) + ' ' + mdName;
    if (generated && genSummaryBase){
      $('#s-stylemsg').innerHTML = genSummaryBase + ' · <b>транспонирована в ' + esc(keyName) + '</b>';
    } else {
      $('#s-stylemsg').textContent = 'Песня теперь в ' + keyName;
    }
  }
  $('#s-tr-down').addEventListener('click', () => transposeSong(-1));
  $('#s-tr-up').addEventListener('click', () => transposeSong(1));
  $('#s-bpm').addEventListener('input', e => { bpm = +e.target.value; $('#s-bpmval').textContent = bpm; persist(); });
  $('#s-bg').addEventListener('click', () => {
    if (bgTrack){ bgStop(); return; }
    if (!seq.length){ $('#s-stylemsg').textContent = 'Сначала собери песню или нажми «✨ Сделай красиво».'; return; }
    const pattern = bgStrumSel === 'metro' ? (loadUI('tools').strum || '') : strumPatternById(bgStrumSel);
    bgStart(seq.slice(), bpm, pattern);
  });
  const bgStrumSelEl = $('#s-bg-strum');
  if (bgStrumSelEl){
    bgStrumSelEl.value = bgStrumSel;
    bgStrumSelEl.addEventListener('change', e => { bgStrumSel = e.target.value; persist(); });
  }
  bgSyncUI = () => { // фон глобальный — кнопка отражает его состояние при любом входе на вкладку
    const b = $('#s-bg');
    if (b){ b.textContent = bgTrack ? '■ Стоп фона' : '▶ Фон'; b.classList.toggle('danger', !!bgTrack); }
  };
  bgSyncUI();
  el.querySelectorAll('[data-q]').forEach(b =>
    b.addEventListener('click', () => { chordQ = b.dataset.q; chordChanged(); }));
  $('#s-play').addEventListener('click', () => { stopSufler(); playSong(); });
  $('#s-sufler').addEventListener('click', () => {
    if (sufler){ stopAll(); stopSufler(); return; }
    stopAll();
    if (!seq.length) return;
    sufler = true;
    const b = $('#s-sufler');
    b.textContent = '■ Суфлёр';
    b.classList.remove('primary'); b.classList.add('danger');
    $('#s-sufler-box').style.display = '';
    $('#s-sufler-box').scrollIntoView({ block:'nearest', behavior:'smooth' }); // один раз — к строке суфлёра
    startPlayback(0); // всегда сначала списка
  });
  $('#s-arp-all').addEventListener('click', playSongArpAll);
  $('#s-fret').addEventListener('click', () => {
    showTool('fret');
    const sec = currentSection();
    if (sec._showSongChord && seq.length) sec._showSongChord(0);
  });
  $('#s-stop').addEventListener('click', () => { stopAll(); stopSufler(); });
  $('#s-arp-all').addEventListener('click', () => { stopAll(); stopSufler(); playSongArpAll(); });
  $('#s-clear').addEventListener('click', () => { stopAll(); seq = []; generated = false; drawSeq(); drawNext(); });

  drawPickerChips();
  drawStyleBlock();
  drawModeChips();
  drawKeys();
  drawSongChords();
  drawNext();
  drawSeq();
  drawSongBpm();
  booted = true; // дальше persist() вызывается только от правок пользователя
  el._cleanup = () => { stopAll(); stopSufler(); };
  el._getSong = () => seq.slice(); // вкладка «Гриф» читает песню отсюда
  el._getMode = () => mode;        // и лад песни
  el._songInfo = () => ({ key, mode, chg }); // гриф: тональность/лад/счётчик правок
  el._toolsBpm = () => drawSongBpm(); // метроном сменил темп — обновить ярлык «в метрономе»
  el._genSong = (T, md) => { // ютуб-джем: собрать песню в заданных тональности/ладу
    if (Number.isInteger(T)) generateSong(T, md);
  };
  el._addSongChords = (list) => {  // вкладка «Прогрессии» дописывает аккорды в песню
    (list || []).forEach(c => {
      if (c && Number.isInteger(c.root) && CHORD_TYPES.includes(c.q))
        seq.push({ root: ((c.root % 12) + 12) % 12, q: c.q });
    });
    persist(); drawSeq(); drawNext(); drawGuess();
  };
  el._setSong = (newSeq) => {      // вкладка «Гриф» изменяет песню (удаление аккордов)
    seq = (newSeq || []).filter(c => c && Number.isInteger(c.root) && (c.q === 'maj' || c.q === 'min'));
    persist(); drawSeq(); drawNext(); drawGuess();
  };
}

/* ================= ИНСТРУМЕНТ: ЛАДЫ + ИНТЕРВАЛЫ (по Гримуару) =================
   Mode Generator Chart как fig. 21 книги: «хочу G миксолидийский → играй C мажор от G».
   Лады мажора как главы книги: Ионийский I, Дорийский II, … Локрийский VII. */

const MODE_GEN = [
  { k:'major',      rn:'I',   name:'Ионийский (мажор)' },
  { k:'dorian',     rn:'II',  name:'Дорийский' },
  { k:'phrygian',   rn:'III', name:'Фригийский' },
  { k:'lydian',     rn:'IV',  name:'Лидийский' },
  { k:'mixolydian', rn:'V',   name:'Миксолидийский' },
  { k:'minor',      rn:'VI',  name:'Эолийский (минор)' },
  { k:'locrian',    rn:'VII', name:'Локрийский' },
];

const INTERVAL_LIST = [
  [0,'Прима (унисон)'], [1,'Малая секунда'], [2,'Большая секунда'],
  [3,'Малая терция'], [4,'Большая терция'], [5,'Кварта'],
  [6,'Тритон'], [7,'Квинта'], [8,'Малая секста'], [9,'Большая секста'],
  [10,'Малая септима'], [11,'Большая септима'], [12,'Октава'],
];

function playScaleSeq(scaleKey2, tonic, gain = 0.7){
  const iv = SCALES[scaleKey2].iv;
  if (!iv) return;
  const base = 48 + tonic;
  iv.forEach((off, i) => pluck(midiFreq(base + off), i * 0.16, gain));
  pluck(midiFreq(base + 12), iv.length * 0.16, gain + 0.1);
}

function renderModes(el){
  el.innerHTML =
    '<h3 style="margin-top:0">🧭 Лады мажора — семь лиц одного набора</h3>' +
    '<div class="card">' +
      '<div class="row">' +
        '<label class="small">Тоника лада <select id="md-key">' +
          NOTE_SHARP.map((n, i) => '<option value="' + i + '"' + (i === 7 ? ' selected' : '') + '>' + n + '</option>').join('') +
        '</select></label>' +
        '<span class="muted small">Один и тот же набор нот — семь ладов. Строка целиком — прослушать.</span>' +
      '</div>' +
      '<div id="md-table" style="margin-top:12px"></div>' +
      '<div class="hint">Как fig. 21 в книге: хочешь G миксолидийский — играй C мажор от G ' +
      '(те же ноты, центр на G). 🔊 — прослушать лад, «На гриф» — открыть на вкладке «Гриф».</div>' +
    '</div>' +
    '<div class="card"><h3 style="margin-top:0">Интервалы во всех тональностях</h3>' +
      '<div class="row">' +
        '<label class="small">От ноты <select id="iv-key">' +
          NOTE_SHARP.map((n, i) => '<option value="' + i + '"' + (i === 0 ? ' selected' : '') + '>' + n + '</option>').join('') +
        '</select></label>' +
        '<span class="muted small">Нажми на интервал — прозвучит. Ниже тот же интервал от всех 12 нот.</span>' +
      '</div>' +
      '<div class="deg-list" id="iv-list" style="margin-top:10px"></div>' +
      '<h3>«<span id="iv-now">Квинта</span>» от всех нот</h3>' +
      '<div class="roots" id="iv-all"></div>' +
    '</div>';

  const $ = s => el.querySelector(s);
  const uiM = loadUI('modes');
  let key = Number.isInteger(uiM.key) ? uiM.key : 7;   // G — как в примере из книги
  let ivKey = 0, ivSel = 7;
  $('#md-key').value = String(key);

  function drawTable(){
    $('#md-table').innerHTML = MODE_GEN.map(m => {
      const off = SCALE_TO_MODEOFF[m.k];
      const parent = ((key - off) % 12 + 12) % 12;
      return '<div class="row" data-snd="' + m.k + '" style="padding:8px 4px; border-bottom:1px solid var(--line); cursor:pointer" title="Прослушать ' + pcName(key) + ' ' + m.name + '">' +
        '<div class="grow"><b>' + pcName(key) + ' ' + m.name + '</b>' +
        ' <span class="muted small">(' + m.rn + ' ступень мажора)</span><br>' +
        '<span class="small">играй <b>' + pcName(parent) + ' мажор</b> от ' + pcName(key) + '</span></div>' +
        '<button class="btn small" data-fret="' + m.k + '">На гриф</button>' +
        '</div>';
    }).join('');
    $('#md-table').querySelectorAll('[data-snd]').forEach(r =>
      r.addEventListener('click', () => playScaleSeq(r.dataset.snd, key)));
    $('#md-table').querySelectorAll('[data-fret]').forEach(b =>
      b.addEventListener('click', e => {
        e.stopPropagation();
        showTool('fret');
        const s = currentSection();
        s._open && s._open(key, b.dataset.fret);
      }));
  }

  function playIv(from, semis){
    pluck(midiFreq(48 + from), 0, 0.7);
    if (semis) pluck(midiFreq(48 + from + semis), 0.16, 0.8);
  }

  function drawIv(){
    $('#iv-list').innerHTML = INTERVAL_LIST.map(([sm, nm]) =>
      '<button class="chip' + (sm === ivSel ? ' on' : '') + '" data-iv="' + sm + '">' + nm + '</button>').join(' ');
    $('#iv-list').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { ivSel = +b.dataset.iv; drawIv(); playIv(ivKey, ivSel); }));
    const nm = INTERVAL_LIST.find(x => x[0] === ivSel)[1];
    $('#iv-now').textContent = nm + ' — ' + ivSel + ' полутон' + (ivSel === 1 || ivSel === 12 ? '' : 'ов');
    $('#iv-all').innerHTML = NOTE_SHARP.map((n, i) => {
      const to = pcName(((i + ivSel) % 12 + 12) % 12);
      return '<button class="chip" data-from="' + i + '">' + n + ' → ' + to + '</button>';
    }).join(' ');
    $('#iv-all').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => playIv(+b.dataset.from, ivSel)));
  }

  $('#md-key').addEventListener('change', e => { key = +e.target.value; saveUI('modes', { key }); drawTable(); });
  $('#iv-key').addEventListener('change', e => { ivKey = +e.target.value; playIv(ivKey, ivSel); });
  drawTable(); drawIv();
}

/* ================= ИНСТРУМЕНТ: ШКОЛА (для начинающих) =================
   Уроки с нуля: струны → первые аккорды → бой → гамма → песня → импровизация.
   Каждый урок — короткая теория + интерактив (клик = звук) + кнопка «Пройдено».
   Прогресс хранится в браузере (ga_school). */

function renderSchool(el){
  const $ = s => el.querySelector(s);
  let done = store.get('ga_school', []);
  if (!Array.isArray(done) || done.length !== 6) done = [false, false, false, false, false, false];
  let timers = [];

  /* разделы Школы: База (уроки) / Практики / Лады (переехали из вкладки) / Теория */

  { id:'l21', c:1, t:'Септаккорды: 7, m7, maj7', x:'7 (доминант) — мажор с «вопросом», тянет в тонику: блюз и рок. m7 — мягкий минор (соул). maj7 — «сказочный» джаз. Разница — одна ступень.<br><b>Сделай:</b> Cmaj7 → C → C7 → Cm7 — услышь, как меняется настроение.', chord:[0, 'maj7'] },
